<script>
(()=>{
 const P=JSON.parse(document.getElementById('payload').textContent);
 const KEY='humain-lock-v1:'+P.salt;
 const bytes=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
 const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
 const store={get(){try{return sessionStorage.getItem(KEY)}catch(e){return null}},set(v){try{sessionStorage.setItem(KEY,v)}catch(e){}},drop(){try{sessionStorage.removeItem(KEY)}catch(e){}}};
 async function decrypt(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(P.iv),additionalData:new TextEncoder().encode(P.aad)},key,bytes(P.ciphertext));
  return new TextDecoder().decode(pt);
 }
 function show(html){
  // Writing before this wrapper finishes loading splices into its stream or skips the page's own
  // DOMContentLoaded handlers; wait until it is fully loaded, then leave the load task.
  if(document.readyState!=='complete'){addEventListener('load',()=>setTimeout(()=>show(html)),{once:true});return}
  document.open();document.write(html);document.close();
 }
 const gate=document.getElementById('gate'),form=document.getElementById('unlock'),input=document.getElementById('password'),go=document.getElementById('go'),status=document.getElementById('status');
 function ask(){gate.hidden=false;input.focus()}
 form.addEventListener('submit',async e=>{
  e.preventDefault();go.disabled=true;status.textContent='';
  try{
   const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveBits']);
   const raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes(P.salt),iterations:P.iterations},base,256));
   const html=await decrypt(raw);
   input.value='';store.set(b64(raw));show(html);
  }catch(err){status.textContent='Wrong password.';go.disabled=false;input.select()}
 });
 const cached=store.get();
 if(cached)decrypt(bytes(cached)).then(show,()=>{store.drop();ask()});else ask();
})();
</script>
