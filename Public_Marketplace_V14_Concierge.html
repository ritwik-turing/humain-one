<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turing's Marketplace — powered by HUMAIN ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#080c0b;--bg2:#0e1413;--panel:#121a18;--panel2:#172120;
 --line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.05);
 --ink:#edf3f0;--muted:#93a09a;--faint:#6d7a75;
 --acc:#2fd39b;--acc2:#19b381;--acc-dim:rgba(47,211,155,.13);--acc-line:rgba(47,211,155,.34);
 --gold:#d9ad5c;--gold-dim:rgba(217,173,92,.13);
 --blue:#63aef0;--blue-dim:rgba(99,174,240,.13);
 --amber:#e6a94e;--amber2:#e6a94e;--amber-dim:rgba(230,169,78,.13);
 --red:#f0736a;--red-dim:rgba(240,115,106,.13);
 --sans:"Onest",-apple-system,"Segoe UI",sans-serif;
 --disp:"Sora",var(--sans);
 --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 --sh:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background-image:radial-gradient(90% 60% at 50% -10%,rgba(47,211,155,.10),transparent 62%),radial-gradient(60% 50% at 100% 0%,rgba(99,174,240,.055),transparent 55%)}
button,input{font-family:inherit}
::selection{background:rgba(47,211,155,.26)}
*:focus{outline:none}
.fv:focus-visible,button:focus-visible,input:focus-visible{box-shadow:0 0 0 3px rgba(47,211,155,.32)!important;border-color:var(--acc-line)!important}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px 28px;background:rgba(8,12,11,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;white-space:nowrap}
.lg-t{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:-.03em;color:#fff}
.lg-t i{font-style:normal;position:relative}
.lg-t i::after{content:"";position:absolute;left:50%;top:-.44em;transform:translateX(-50%);width:.14em;height:.14em;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.lg-m{font-weight:400;color:var(--muted)}
.lg-sep{width:1px;height:18px;background:var(--line)}
.lg-h{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;letter-spacing:.24em;color:#cfe3da}
.lg-one{font-size:8.5px;letter-spacing:.13em;color:#04120d;background:var(--acc);padding:2px 6px;border-radius:5px;font-weight:700}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px 90px}

/* ---------- ask screen ---------- */
.ask{min-height:calc(100vh - 230px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 0 40px;position:relative}
.aurora{position:absolute;top:44%;left:50%;width:min(940px,96vw);height:520px;pointer-events:none;background:radial-gradient(closest-side,rgba(47,211,155,.19),transparent 72%);filter:blur(52px);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.ask>*{position:relative;z-index:1}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);display:inline-flex;align-items:center;gap:11px;margin-bottom:20px}
.eyebrow::before,.eyebrow::after{content:"";height:1px;width:34px;background:linear-gradient(90deg,transparent,rgba(47,211,155,.5))}
.eyebrow::after{background:linear-gradient(90deg,rgba(47,211,155,.5),transparent)}
.ask h1{font-family:var(--disp);font-size:clamp(30px,4.6vw,50px);font-weight:600;letter-spacing:-.035em;line-height:1.08;margin:0 0 14px;max-width:16ch;background:linear-gradient(175deg,#ffffff 30%,#9fd9c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.ask .lede{font-size:15px;color:var(--muted);max-width:56ch;margin:0 0 34px}
.askbox{width:min(700px,94vw);position:relative}
.askfield{display:flex;align-items:center;gap:13px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:5px 6px 5px 20px;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.askfield:focus-within{border-color:var(--acc-line);box-shadow:var(--sh),0 0 0 4px rgba(47,211,155,.11)}
.askfield input{flex:1;min-width:0;border:none;background:transparent;color:var(--ink);font-size:16px;padding:16px 0;outline:none}
.askfield input::placeholder{color:var(--faint)}
.askicon{color:var(--acc);font-size:15px;flex:none}
.suggests{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:22px;max-width:720px}
.sug{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.028);color:#c6d3ce;font-size:12.5px;font-weight:500;padding:8px 15px;border-radius:999px;cursor:pointer;transition:border-color .18s,background .18s,color .18s,transform .08s}
.sug:hover{border-color:var(--acc-line);background:var(--acc-dim);color:var(--ink)}
.sug:active{transform:translateY(1px)}
.askfoot{margin-top:36px;font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.linkish{color:var(--acc);cursor:pointer;font-weight:500;background:none;border:none;font-size:inherit;padding:0}
.linkish:hover{text-decoration:underline}
.dot{width:3px;height:3px;border-radius:50%;background:var(--faint);display:inline-block}

/* ---------- results ---------- */
.qbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:5px 6px 5px 17px;margin:26px 0 8px;transition:border-color .2s,box-shadow .2s}
.qbar:focus-within{border-color:var(--acc-line);box-shadow:0 0 0 4px rgba(47,211,155,.1)}
.qbar input{flex:1;min-width:0;border:none;background:transparent;color:var(--ink);font-size:15px;padding:12px 0;outline:none}
.rmeta{font-size:12.5px;color:var(--faint);margin-bottom:20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.res{display:flex;gap:17px;padding:20px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.022),transparent);margin-bottom:13px;transition:border-color .2s,transform .2s,box-shadow .2s;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.res:hover{border-color:rgba(255,255,255,.16);transform:translateY(-2px);box-shadow:0 12px 34px rgba(0,0,0,.36)}
.res.best{border-color:var(--acc-line);background:linear-gradient(180deg,rgba(47,211,155,.075),transparent 70%)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.res:nth-child(1){animation-delay:.02s}.res:nth-child(2){animation-delay:.07s}.res:nth-child(3){animation-delay:.12s}.res:nth-child(4){animation-delay:.17s}.res:nth-child(5){animation-delay:.22s}.res:nth-child(6){animation-delay:.27s}
.av{width:48px;height:48px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--acc);background:linear-gradient(155deg,rgba(47,211,155,.19),rgba(47,211,155,.05));box-shadow:inset 0 0 0 1px rgba(47,211,155,.22)}
.res .body{flex:1;min-width:0}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rname{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:-.02em;color:#fff}
.rpub{font-size:12.5px;color:var(--muted);margin-top:1px}
.why{margin:11px 0 0;padding:11px 13px;border-radius:11px;background:rgba(47,211,155,.065);border-left:2px solid var(--acc-line);font-size:13px;color:#c8ded5}
.why b{color:var(--acc);font-weight:600}
.sigs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.ractions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}

/* ---------- badges + buttons ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.badge.acc{background:var(--acc-dim);color:var(--acc)}
.badge.blue{background:var(--blue-dim);color:var(--blue)}
.badge.gold{background:var(--gold-dim);color:var(--gold)}
.badge.amber{background:var(--amber-dim);color:var(--amber2)}
.badge.red{background:var(--red-dim);color:var(--red)}
.badge.mut{background:rgba(255,255,255,.055);color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);font-weight:600;font-size:13px;padding:10px 18px;border-radius:11px;cursor:pointer;transition:background .17s,border-color .17s,transform .07s,box-shadow .17s}
.btn:hover{background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.17)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04130e;font-weight:700}
.btn.pri:hover{background:#42e3ab;border-color:#42e3ab;box-shadow:0 8px 26px rgba(47,211,155,.24)}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn.gh{background:transparent}

/* ---------- evidence ---------- */
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;cursor:pointer;background:none;border:none;padding:0;margin:24px 0 18px}
.back:hover{color:var(--acc)}
.ehead{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px}
.ehead .av{width:58px;height:58px;font-size:16px;border-radius:17px}
.ehead h1{font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:-.028em;margin:0 0 3px;color:#fff;line-height:1.12}
.two{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.verdict{display:flex;align-items:center;gap:15px;padding:17px 18px;border-radius:16px;background:linear-gradient(120deg,rgba(47,211,155,.11),rgba(47,211,155,.02));border:1px solid var(--acc-line)}
.verdict.warn{background:linear-gradient(120deg,rgba(230,169,78,.11),rgba(230,169,78,.02));border-color:rgba(230,169,78,.32)}
.vmark{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--acc);color:#04130e;box-shadow:0 0 0 5px rgba(47,211,155,.13)}
.verdict.warn .vmark{background:var(--amber2);color:#221501;box-shadow:0 0 0 5px rgba(230,169,78,.13)}
.vt{font-weight:600;font-size:14.5px;color:#fff}
.vs{font-size:12.5px;color:var(--muted);margin-top:2px}
.sec{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.022);padding:17px 19px;margin-top:14px}
.sech{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.tag{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sec.guard .tag{color:#a98bea}.sec.prism .tag{color:var(--acc)}.sec.att .tag{color:var(--amber2)}
.secmeta{margin-left:auto;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{text-align:right;font-weight:500;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:13px;padding:14px}
.stat .n{font-family:var(--disp);font-size:25px;font-weight:600;line-height:1;color:#fff}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:7px}
.stat .s{font-size:10.5px;color:var(--acc);margin-top:3px;font-weight:500}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
@media(max-width:560px){.checks{grid-template-columns:1fr}}
.chk{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line2)}
.chk span{color:var(--muted)}.chk b{color:var(--acc);font-size:11.5px;font-weight:600}
.note{font-size:12px;color:var(--faint);line-height:1.55;margin:11px 0 0}
.mono{font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.055);color:var(--muted);padding:3px 8px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s}
.mono:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.rail{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.028);padding:18px;position:sticky;top:84px}
.railtop{display:flex;align-items:center;gap:14px;padding-bottom:15px;margin-bottom:14px;border-bottom:1px solid var(--line2)}
.tnum{font-family:var(--disp);font-size:33px;font-weight:600;line-height:1;color:var(--acc)}
.tlbl{font-size:11px;color:var(--muted);margin-top:4px}

/* ---------- browse ---------- */
.bhead{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;margin:30px 0 4px}
.bhead h2{font-family:var(--disp);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0;color:#fff}
.bhead .sub{font-size:12.5px;color:var(--faint)}
.row{display:flex;align-items:center;gap:15px;padding:15px 17px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:rgba(255,255,255,.018);transition:border-color .18s,background .18s}
.row:hover{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.035)}
.row .av{width:40px;height:40px;font-size:12.5px;border-radius:12px}
.row .rn{font-weight:600;font-size:14.5px;color:#fff}
.row .rd{font-size:12.5px;color:var(--muted);margin-top:1px}
.rowacts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- runtime ---------- */
.chat{display:flex;flex-direction:column;gap:10px;padding:16px;background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:15px;min-height:220px;max-height:360px;overflow:auto}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--acc);color:#04130e;font-weight:500;border-bottom-right-radius:5px}
.msg.ag{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-bottom-left-radius:5px}
.fin{flex:1;min-width:0;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:11px;padding:11px 14px;font-size:13.5px;outline:none;transition:border-color .17s,box-shadow .17s}
.fin:focus{border-color:var(--acc-line);box-shadow:0 0 0 3px rgba(47,211,155,.12)}
.fb{appearance:none;border:1px solid var(--line);background:transparent;border-radius:999px;font-size:11px;padding:2px 10px;cursor:pointer;color:var(--muted)}
.fb.on{border-color:var(--acc-line);background:var(--acc-dim);color:var(--acc)}

#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(10px);background:#eef3f0;color:#0a0f0d;font-size:13px;font-weight:600;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99;box-shadow:var(--sh)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){.top{padding:12px 16px}.wrap{padding:0 16px 70px}.lg-sep,.lg-h{display:none}.ask{min-height:auto;padding:34px 0}.ehead .av{width:46px;height:46px}}
</style>
</head>

</div>
<div class="wrap" id="app"></div>

 {id:'triage',nm:'Support Triage',pub:'Dammam Cloud Co.',origin:'external',vrf:0,cat:'Back office',cap:'Classifies inbound support tickets and routes them with SLA awareness',
  ds:'Classifies and routes inbound support tickets with SLA awareness.',
  tags:['support','ticket','tickets','triage','routing','sla','helpdesk','classify','queue','customer'],

const INTENTS=[
 'Process supplier invoices end to end',
 'Translate a legal document into Arabic',

const state={screen:'ask',q:'',agentId:null,sessions:{}};

/* ================= matching =================
   ponytail: deterministic keyword scorer, no model call. Scores name > tags > capability > category,
   and returns the terms that actually hit so the UI can explain the match honestly. */
const STOP=new Set(['a','an','and','the','to','for','of','in','on','my','our','we','i','need','want','help','with','me','can','you','please','some','is','are','it','that','this','how','do','get','find','agent','agents']);
function terms(q){return q.toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));}
function stem(w){return w.replace(/(ing|ies|es|s)$/,'');}
// word-start match, so "invoice" hits "invoices" but "book" never hits "playbook"
const rx=w=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
function score(a,ts){
 let s=0;const hit=new Set();
 ts.forEach(t=>{
  const st=stem(t),r=rx(st.length>3?st:t);
  if(a.tags.some(g=>g===t||g===st||stem(g)===st)){s+=10;hit.add(t);}
  if(r.test(a.nm)){s+=8;hit.add(t);}
  if(r.test(a.cat)){s+=5;hit.add(t);}
  if(r.test(a.cap)||r.test(a.ds)){s+=4;hit.add(t);}
 });
 if(s>0&&a.cert)s+=2;           // certified agents rank above uncertified on equal relevance
 return {score:s,hit:[...hit]};
}
function search(q){
 const ts=terms(q);
 if(!ts.length)return {ts:[],ranked:[],weak:true};
 const ranked=AGENTS.map(a=>({a,...score(a,ts)})).filter(r=>r.score>0).sort((x,y)=>y.score-x.score||y.a.trust-x.a.trust);
 return {ts,ranked,weak:ranked.length===0||ranked[0].score<8};
}
// ponytail: one runnable check — the shipped intents must each return a sensible top match
(function(){
 const expect={'Process supplier invoices end to end':'invoiceapp','Translate a legal document into Arabic':'translate','Chase our unpaid invoices':'invoice','Onboard a new employee':'hr','Summarize a supplier contract':'contract','Answer citizen benefit queries':'citizen'};
 Object.entries(expect).forEach(([q,id])=>{const r=search(q);console.assert(r.ranked.length&&r.ranked[0].a.id===id,'intent "'+q+'" expected '+id+' got '+(r.ranked[0]||{a:{}}).a.id);});
 console.assert(AGENTS.every(a=>a.origin==='internal'||a.origin==='external'),'every agent needs an origin');
})();

function um(a){const m=Math.round(parseFloat(a.use)*1000);return {ltRuns:m*14,ltTasks:Math.round(m*14*2.6),t30:Math.round(m*2.6)};}
