document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

},\n {id:\"customs\",code:\"CU\",name:\"Customs Classification Agent\",purpose:\"Classifies imported goods against tariff codes\",runtime:\"python 3.11\",life:\"Suspended\",trust:\"79\",tenant:\"moh-gov\",updated:\"5 days ago\",full:false},\n {id:\"fraud\",code:\"FR\",name:\"Fraud Signals Agent\",purpose:\"Flags anomalous benefit claims for human review\",runtime:\"python 3.11\",life:\"Needs attention\",trust:null,tenant:\"msa-gov\",updated:\"today\",full:false}\n];\nfunction agentMatches(e){const f=state.filter;if(f.status!==\"All\"&&e.life!==f.status)return false;if(f.q&&!((e.name+\" \"+e.purpose).toLowerCase().includes(f.q.toLowerCase())))return false;return true;}\nfunction createAgentRecord(name,purpose,cfg){\n  const base=(name||'agent').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24)||'agent';\n  let id=base,n=2;while(AGENTS_INDEX.some(x=>x.id===id)){id=base+'-'+(n++);}\n  AGENTS_INDEX.unshift({id:id,code:(name||'AG').slice(0,2).toUpperCase(),name:name,purpose:purpose,runtime:\"python 3.11\",life:\"Draft\",trust:\"\",tenant:\"msa-gov\",updated:\"just now\",full:true});\n  AGENTS[id]={id:id,name:name,purpose:purpose,tenant:\"Ministry of Social Affairs · tenant: msa-gov\",officer:\"case officer\",runtime:\"python 3.11\",model:\"claude-sonnet-4-6\",systemPrompt:(cfg&&cfg.system)||(\"You are \"+name+\".\"),caCfg:(cfg&&cfg.yaml)||\"\",fresh:true};\n  return id;\n}\nfunction agentGridHTML(){const list=AGENTS_INDEX.filter(agentMatches);if(!list.length)return `<div class=\"agcanvas\"><div class=\"agempty\">No agents match this filter.<\u002Fdiv><\u002Fdiv>`;\n const ICON={citizen:\"users\",procurement:\"file-check-2\",health:\"stethoscope\",permit:\"file-badge\",visa:\"plane\",grants:\"graduation-cap\",hr:\"calendar-clock\",customs:\"package-search\",fraud:\"shield-alert\"};\n const cards=list.map(e=>`<div class=\"agentcard\" data-id=\"${e.id}\" data-kind=\"${e.full?'open':'mini'}\"><div class=\"ico\"><i data-lucide=\"${ICON[e.id]||'bot'}\ reventDefault();e.stopPropagation();var id=card.getAttribute('data-id'),sx=e.clientX,sy=e.clientY,sl=parseFloat(card.style.left)||0,st=parseFloat(card.style.top)||0,moved=false;card.setPointerCapture(e.pointerId);function mv(ev){var dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.abs(dx)+Math.abs(dy)>5){moved=true;card.classList.add('dragging');}if(moved){card.style.left=Math.max(0,sl+dx)+'px';card.style.top=Math.max(0,st+dy)+'px';}}function up(){card.removeEventListener('pointermove',mv);card.removeEventListener('pointerup',up);card.classList.remove('dragging');if(moved){agCanvasState.pos[id]={x:parseFloat(card.style.left),y:parseFloat(card.style.top)};agLayout();}else{agSelect(id,card);}}card.addEventListener('pointermove',mv);card.addEventListener('pointerup',up);}\nfunction agPanDown(e){var cv=document.getElementById('agCanvas');if(e.target.closest('.agentcard')||e.target.closest('#agRearrange'))return;var sx=e.clientX,sy=e.clientY,ox=agCanvasState.pan.x,oy=agCanvasState.pan.y;cv.classList.add('panning');cv.setPointerCapture(e.pointerId);function mv(ev){agCanvasState.pan.x=ox+(ev.clientX-sx);agCanvasState.pan.y=oy+(ev.clientY-sy);agApplyPan();}function up(){cv.removeEventListener('pointermove',mv);cv.removeEventListener('pointerup',up);cv.classList.remove('panning');}cv.addEventListener('pointermove',mv);cv.addEventListener('pointerup',up);}\nfunction setupCanvas(){var cv=document.getElementById('agCanvas'),pl=document.getElementById('agPlane');if(!cv||!pl)return;agLayout();agApplyPan();pl.querySelectorAll('.agentcard').forEach(function(card){card.addEventListener('pointerdown',function(e){agCardDown(e,card);});if(card.getAttribute('data-id')===agCanvasState.sel)card.classList.add('sel');});cv.addEventListener('pointerdown',agPanDown);var rb=document.getElementById('agRearrange');if(rb)rb.addEventListener('click',function(e){e.stopPropagation();agCanvasState.pos={};agCanvasState.pan={x:0,y:0};agApplyPan();agLayout();});if(!agCanvasState.bound){agCanvasState.bound=true;window.addEventListener('resize',function(){if(document.getElementById('agCanvas'))agLayout();});}}\nfunction refreshGrid(){const g=document.getElementById('agentGrid');if(g){g.innerHTML=agentGridHTML();setupCanvas();if(window.lucide)lucide.createIcons();}}\n\n/* ---------- CHROME ---------- */\nconst TITLES={home:\"Home\",infra:\"Infrastructure\",env:\"Environments\",agents:\"My Agents\",detail:\"Agent\",mini:\"Agent\",submit:\"Submit Agent\",resolve:\"Resolve & Govern\",plan:\"Review Generated Plan\",deploy:\"Provision & Deploy\",runtime:\"Runtime & Resources\",test:\"Test in Sandbox\",evidence:\"Evidence\",publish:\"Submit to Marketplace\",market:\"Marketplace\",listing:\"Agent Listing\",scenario:\"Run Agent\",sandboxes:\"Sandboxes\",templates:\"Templates\",requests:\"My Requests\",evals:\"Evaluations\",data:\"Data Catalog\",tenancy:\"Tenancy & Templates\",exception:\"Request a Template\",library:\"My Acquired Agents\",infra:\"Infrastructure\"};\nfunction renderNav(){document.querySelectorAll('#nav a').forEach(a=>{const g=a.getAttribute('data-go');const inJ=STEPS.some(s=>s.id===state.screen);a.classList.toggle('active',g===state.screen||(g==='agents'&&(state.screen==='detail'||state.screen==='mini'||inJ))||(g==='market'&&(state.screen==='listing'||state.screen==='scenario')));});}\nfunction renderStepper(){const w=$(\"#stepper\");const inJ=STEPS.some(s=>s.id===state.screen);if(!inJ){w.style.display=\"none\";w.innerHTML=\"\";return;}w.style.display=\"flex\";const cur=stepIndex(state.screen);\n  w.innerHTML=STEPS.map((s,i)=>{const cls=i<cur?\"done\":i===cur?\"active\":\"\";const mk=i<cur?\"✓\":(i+1);return `<div class=\"step ${cls}\" data-i=\"${i}\" data-step=\"${s.id}\"><span class=\"n\">${mk}<\u002Fspan>${s.label}<\u002Fdiv>`;}).join(\"\");\n  w.querySelectorAll('.step').forEach(el=>el.addEventListener('click',()=>{const i=+el.getAttribute('data-i');if(i<=cur)go(el.getAttribute('data-step'));}));}\nfunction renderTop(){var t=$(\"#topTitle\");if(t)t.textContent=TITLES[state.screen]||\"\";var c=$(\"#crumbs\");if(!c)return;\n  const inJ=STEPS.some(s=>s.id===state.screen);const market=['market','listing','scenario'].includes(state.screen);\n  c.textContent=inJ?`HUMAIN ONE / Agents / ${A().name} / ${TITLES[state.screen]}`:state.screen==='detail'?`HUMAIN ONE / Agents / ${A().name}`:state.screen==='mini'?`HUMAIN ONE / Agents / ${state.mini?state.mini.name:''}`:(market?`HUMAIN ONE / Marketplace${state.screen!=='market'?' / '+A().name:''}`:`HUMAIN ONE / ${TITLES[state.screen]}`);}\n\n/* ---------- CLI ---------- */\n/* Interactive CLI — shares state with the UI, both stay in lockstep */\nfunction esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;');}\nfunction cliEcho(cls,txt){const log=$(\"#cliLog\");if(!log)return;const d=document.createElement('div');d.className='ln '+(cls||'');d.innerHTML=txt;log.appendChild(d);const b=$(\"#cliBody\");if(b)b.scrollTop=b.scrollHeight;}\nfunction renderCLI(){ /* mirror only journey steps into the transcript (no page-nav noise) */\n  if(!$(\"#cliLog\"))return;\n  if(STEPS.some(s=>s.id===state.screen)) cliEcho('out','↳ '+AGENTS[state.agentId].manifest[0][1]+' · '+state.screen+' (step '+(stepIndex(state.screen)+1)+'/'+STEPS.length+')');\n}\nfunction cliNeed(verb){cliEcho('err','usage:  '+verb+' [id]   ·   run  list  to see agent ids');}\nfunction cliNope(a){cliEcho('err','no agent “'+esc(a)+'”   ·   run  list  to see agent ids');}\nfunction resolveAgent(tok){if(!tok)return null;tok=String(tok).toLowerCase();\n  return AGENTS_INDEX.find(e=>e.id===tok)\n    || AGENTS_INDEX.find(e=>e.full&&AGENTS[e.id].manifest[0][1]===tok)\n    || AGENTS_INDEX.find(e=>e.name.toLowerCase().replace(/\\s+/g,'-')===tok)\n    || AGENTS_INDEX.find(e=>e.name.toLowerCase().includes(tok)) || null;}\nfunction pad(s,n){s=String(s);return (s+' '.repeat(n)).slice(0,n);}\nfunction cliList(){cliEcho('out',pad('AGENT (id)',26)+pad('STATUS',18)+'TRUST');\n  AGENTS_INDEX.forEach(e=>cliEcho('out',pad(e.id,26)+pad(e.life,18)+(e.trust||'—')));\n  cliEcho('out','→ try:  submit grants   ·   next grants   ·   open citizen   ·   market health');}\nfunction cliHelp(){cliEcho('out','commands  (the “humain agent” prefix is optional · [id] = an id from  list):');\n  ['list                                              every agent + lifecycle status',\n   'submit [id]                                       start the governed path / advance a directory agent',\n   'next [id]                                         advance one step (or one lifecycle stage)',\n   'resolve|plan|deploy|runtime|test|evidence|publish [id]   jump to a journey step',\n   'open [id]                                         owner view (versions, redeploy)',\n   'market [id]                                       consumer listing (published only)',\n   'status [id]                                       print the current state',\n   'clear                                             clear the screen'].forEach(l=>cliEcho('out','  '+l));}\nfunction cliJourney(step,arg){\n  let e=arg?resolveAgent(arg):AGENTS_INDEX.find(x=>x.id===state.agentId);\n  if(arg&&!e)return cliNope(arg);\n  if(!e){cliEcho('err','no active agent — start one with:  submit [id]');return;}\n  if(!e.full){cliEcho('err',e.id+' is a directory agent at “'+e.life+'” — advance it with:  next '+e.id);return;}\n  state.agentId=e.id;$(\"#tenantline\").textContent=AGENTS[e.id].tenant;go(step);\n}\nfunction runCli(raw){const cmd=(raw||'').trim();if(!cmd)return;\n  cliEcho('cmdline','<span class=\"pr\">msa-gov $<\u002Fspan> <span class=\"cmd\">'+esc(cmd)+'<\u002Fspan>');\n  let t=cmd.replace(/^humain\\s+/i,'').replace(/^agent\\s+/i,'').trim();\n  const p=t.split(/\\s+/);const v=(p[0]||'').toLowerCase();const arg=p[1];\n  const steps=['resolve','plan','deploy','runtime','test','evidence','publish'];\n  if(v==='help'||v==='?'){cliHelp();return;}\n  if(v==='clear'){$(\"#cliLog\").innerHTML='';return;}\n  if(v==='list'||v==='ls'){cliList();return;}\n  if(v==='status'){if(!arg)return cliNeed('status');const e=resolveAgent(arg);if(!e)return cliNope(arg);cliEcho('out',e.id+': '+e.life+' · trust '+(e.trust||'—')+' · placement KSA · Riyadh');return;}\n  if(v==='open'){if(!arg)return cliNeed('open');const e=resolveAgent(arg);if(!e)return cliNope(arg);e.full?openDetail(e.id):openMini(e.id);return;}\n  if(v==='market'){if(!arg)return cliNeed('market');const e=resolveAgent(arg);if(!e)return cliNope(arg);if(e.life!=='Published'){cliEcho('err',e.id+' is not published yet ('+e.life+') — not in the Marketplace');return;}listAgent(e.id);return;}\n  if(v==='acquire'||v==='buy'){if(!arg)return cliNeed('acquire');const e=resolveAgent(arg);if(!e)return cliNope(arg);if(e.life!=='Published'){cliEcho('err',e.id+' is not published yet ('+e.life+') — cannot acquire');return;}openModal(modalAcquire(e.id));return;}\n  if(v==='library'||v==='acquired'||v==='mine'){go('agents');cliEcho('out',state.acquired.size?('acquired: '+[...state.acquired].join(', ')+' — see the Acquired section in My Agents'):'no acquired agents yet — acquire one from the Marketplace');return;}\n  if(v==='submit'){if(!arg)return cliNeed('submit');const e=resolveAgent(arg);if(!e)return cliNope(arg);if(e.full)startJourney(e.id);else advanceMock(e.id);return;}\n  if(v==='next'){const e=arg?resolveAgent(arg):AGENTS_INDEX.find(x=>x.id===state.agentId);if(arg&&!e)return cliNope(arg);if(!e)return cliNeed('next');\n    if(e.full){state.agentId=e.id;const inJ=STEPS.some(s=>s.id===state.screen);if(!inJ){startJourney(e.id);}else{const i=stepIndex(state.screen);if(i<STEPS.length-1)go(STEPS[i+1].id);else cliEcho('out',e.id+' is at the final step — submit it from the Publish screen');}}\n    else advanceMock(e.id);return;}\n  if(steps.includes(v))return cliJourney(v,arg);\n  cliEcho('err','unknown command “'+esc(v)+'”   ·   try  help  or  list');\n}\nfunction initCli(){$(\"#cliBody\").innerHTML='<div id=\"cliLog\"><\u002Fdiv><div class=\"cliprompt\"><span>msa-gov $<\u002Fspan><input id=\"cliIn\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"type a command — e.g. list · submit grants · next grants\"/><\u002Fdiv>';\n  cliEcho('out',\"HUMAIN ONE CLI — mirrors the UI. Start with  list , then e.g.  submit grants  ·  next grants  ·  open citizen . Type  help  for everything.\");\n  const inp=$(\"#cliIn\");if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const val=inp.value;inp.value='';runCli(val);}});}\n\n/* ---------- BUILD SCREENS ---------- */\nfunction scrHome(){  const counts={};AGENTS_INDEX.forEach(e=>counts[e.life]=(counts[e.life]||0)+1);\n  const pub=counts['Published']||0;\n  const prog=AGENTS_INDEX.filter(e=>['Resolving','Provisioning','Deployed','In evaluation','Review-ready'].includes(e.life)).length;\n  const drafts=counts['Draft']||0;\n  const attn=counts['Needs attention']||0;\n  const total=AGENTS_INDEX.length;\n  const first=(USER.name||'there').split(' ')[0];\n  const ICON={citizen:\"users\",procurement:\"file-check-2\"};\n  const recent=AGENTS_INDEX.slice(0,3).map(e=>`<div class=\"hagent\" data-id=\"${e.id}\" data-kind=\"${e.full?'open':'mini'}\">\n      <div class=\"hag-ico\"><i data-lucide=\"${ICON[e.id]||'bot'}\"><\u002Fi><\u002Fdiv>\n      <div style=\"min-width:0;flex:1\">\n        <div class=\"hag-nm\">${e.name}<\u002Fdiv>\n        <div class=\"hag-ds\">${e.purpose}<\u002Fdiv>\n        <div class=\"row\" style=\"gap:6px;margin-top:8px;align-items:center\">${badge(lifeClass(e.life),e.life)} ${e.trust?badge('teal','Trust '+e.trust):badge('muted','no score yet')} <span class=\"small\">updated ${e.updated||'just now'}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n  const stat=(n,lbl,bcls,sub)=>`<div class=\"hstat\"><div class=\"hstat-n\">${n}<\u002Fdiv>${badge(bcls,lbl)}<div class=\"hstat-sub\">${sub}<\u002Fdiv><\u002Fdiv>`;\n  return `<div style=\"width:100%\">\n    <h1 class=\"ds-display\" style=\"margin:0;font-size:1.9rem\">Welcome back, ${first}<\u002Fh1>\n    <p class=\"lede\" style=\"margin:8px 0 0;max-width:640px\">Your developer home on HUMAIN ONE. Start a new agent, pick up recent work, or browse what is published. Your full directory of ${total} agents lives under My Agents — it is not the first thing you land on.<\u002Fp>\n    <div class=\"hstats\" style=\"margin-top:22px\">\n      ${stat(pub,'Published','gov','live in the Marketplace')}\n      ${stat(prog,'In progress','preview','on the governed path')}\n      ${stat(drafts,'Drafts','muted','not yet submitted')}\n      ${stat(attn,'Needs attention','alert','last deploy failed')}\n    <\u002Fdiv>\n    <div class=\"card\" style=\"margin-top:18px\"><div class=\"hd\" style=\"border:none\"><h3>Start something<\u002Fh3><span class=\"small\">two ways in<\u002Fspan><\u002Fdiv>\n      <div class=\"bd\" style=\"padding-top:0\">\n        <div class=\"row\" style=\"gap:12px;align-items:center;flex-wrap:wrap\">\n          <button class=\"btn primary\" data-journey=\"citizen\"><i data-lucide=\"plus\"><\u002Fi> Create agent<\u002Fbutton>\n          <button class=\"btn\" data-go=\"market\">Browse the Marketplace<\u002Fbutton>\n          <button class=\"btn ghost\" data-go=\"agents\">View all agents (${total}) →<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"note info\" style=\"margin-top:16px\"><span class=\"ni\">✦<\u002Fspan><div><b>Quick Start<\u002Fb> is docked at the bottom of every screen. Describe an agent in plain language and it will run each step of the governed path in the UI for you.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"row\" style=\"justify-content:space-between;align-items:center;margin:24px 0 12px\"><h3 style=\"margin:0\">Recent agents<\u002Fh3><button class=\"btn ghost\" data-go=\"agents\">See all →<\u002Fbutton><\u002Fdiv>\n    <div class=\"hagents\">${recent}<\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction scrAgents(){\n  const counts={};AGENTS_INDEX.forEach(e=>counts[e.life]=(counts[e.life]||0)+1);\n  const statuses=[\"All\",...LIFE.filter(s=>counts[s])];\n  const stOpts='';\n  const counts2=counts;\n  const pills=statuses.map(s=>`<button class=\"fpill ${state.filter.status===s?'on':''}\" data-status=\"${s}\">${s==='All'?'All':s}<span class=\"fpc\">${s==='All'?AGENTS_INDEX.length:counts[s]}<\u002Fspan><\u002Fbutton>`).join(\"\");\n  const stItems=statuses.map(s=>`<button class=\"fmenu-item ${state.filter.status===s?'on':''}\" data-status=\"${s}\"><span>${s==='All'?'All statuses':s}<\u002Fspan><span class=\"fpc\">${s==='All'?AGENTS_INDEX.length:counts[s]}<\u002Fspan><\u002Fbutton>`).join(\"\");\n  const fLabel=state.filter.status==='All'?'All statuses':state.filter.status;\n  return `<div class=\"row\" style=\"align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px\">\n    <div style=\"max-width:440px\"><h2 style=\"margin:0\">My Agents<\u002Fh2><p class=\"lede\" style=\"margin:6px 0 0\">Agents are the unit you build and ship. Filter by lifecycle status, search, or open one. You never start from a bare sandbox.<\u002Fp><\u002Fdiv>\n    <button class=\"btn primary\" data-journey=\"citizen\" style=\"flex:none;white-space:nowrap\"><i data-lucide=\"plus\"><\u002Fi> Submit Agent<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"row\" style=\"align-items:center;margin-bottom:0;gap:10px\">\n    <div class=\"searchbox\"><i data-lucide=\"search\"><\u002Fi><input id=\"fq\" placeholder=\"Search agents…\" value=\"${state.filter.q}\"/><\u002Fdiv>\n    <div class=\"fdrop\" id=\"fDrop\">\n      <button class=\"fdrop-btn\" id=\"fDropBtn\"><i data-lucide=\"list-filter\"><\u002Fi> <span id=\"fDropLabel\">${fLabel}<\u002Fspan> <i data-lucide=\"chevron-down\"><\u002Fi><\u002Fbutton>\n      <div class=\"fmenu\" id=\"fMenu\" hidden>${stItems}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"agentGrid\" style=\"margin-top:14px\">${agentGridHTML()}<\u002Fdiv>\n  ${acquiredSection()}`;\n}\nfunction acquiredSection(){if(!state.acquired.size)return '';\n  const ICON={citizen:\"users\",procurement:\"file-check-2\",health:\"stethoscope\",permit:\"file-badge\",visa:\"plane\",grants:\"graduation-cap\",hr:\"calendar-clock\",customs:\"package-search\",fraud:\"shield-alert\"};\n  const cards=[...state.acquired].map(id=>{const e=AGENTS_INDEX.find(x=>x.id===id);const full=!!AGENTS[id];return `<div class=\"acqcard\">\n      <div class=\"acqcard-top\"><span class=\"acqcard-ico\"><i data-lucide=\"${ICON[id]||'bot'}\"><\u002Fi><\u002Fspan><div class=\"acqcard-tt\"><div class=\"acqcard-nm\">${e.name}<\u002Fdiv><div class=\"acqcard-sub\">${e.purpose}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"acqcard-tags\">${badge('teal','✓ acquired')} ${badge('gov','KSA sovereign')} ${e.trust?badge('muted','Trust '+e.trust):''}<\u002Fdiv>\n      <div class=\"acqcard-foot\">${full?`<button class=\"btn sm primary\" data-run=\"${id}\"><i data-lucide=\"message-square\"><\u002Fi> Chat with agent<\u002Fbutton>`:''}<button class=\"btn sm\" data-list=\"${id}\">View listing<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>`;}).join(\"\");\n  return `<hr class=\"sep\" style=\"margin:26px 0 16px\"/><div class=\"row\" style=\"justify-content:space-between;align-items:center;margin-bottom:6px\"><h2 style=\"font-size:18px;margin:0\">Acquired from Marketplace<\u002Fh2>${badge('muted',state.acquired.size+' in your workspace')}<\u002Fdiv><p class=\"lede\" style=\"margin:0 0 14px\">Published agents you acquired and consume in your workspace (tenant ${USER.tenant}). The publisher manages their build and versions — you just run them.<\u002Fp><div class=\"acqgrid\">${cards}<\u002Fdiv>`;\n}\nfunction scrMini(){const e=state.mini;if(!e)return scrAgents();\n  const stage={Draft:\"Manifest drafted. Not yet submitted to the governed path.\",Resolving:\"Resolving the plan from the manifest.\",Provisioning:\"The Sovereign Runtime is being assembled.\",Deployed:\"Running in its sandbox. Not yet evaluated for listing.\",\"In evaluation\":\"Running its evaluation suite to build a Trust Score.\",\"Review-ready\":\"Tested and evidenced. Ready for marketplace submission.\",Published:\"Live in the Marketplace, signed off by a domain champion.\",Suspended:\"Idle. Auto-suspended on time-to-live to avoid cost.\",\"Needs attention\":\"Last deploy failed. Needs developer attention.\"}[e.life]||\"\";\n  const pos=LIFE.indexOf(e.life);\n  const track=LIFE.map(s=>`<span class=\"chip ${s===e.life?'sel':''}\" style=\"cursor:default\">${s}<\u002Fspan>`).join(\"\");\n  return `<h2>${e.name}<\u002Fh2><p class=\"lede\">${e.purpose}<\u002Fp>\n  <div class=\"row\" style=\"margin-bottom:14px\">${badge(lifeClass(e.life),e.life)} ${e.trust?badge('teal','Trust '+e.trust):badge('muted','no score yet')} ${badge('muted',e.runtime)} ${badge('muted','tenant: '+e.tenant)} ${badge('muted','updated '+e.updated)}<\u002Fdiv>\n  <div class=\"card\"><div class=\"hd\"><h3>Lifecycle<\u002Fh3><span class=\"small\">stage ${pos+1} of ${LIFE.length}<\u002Fspan><\u002Fdiv><div class=\"bd\">\n    <div class=\"row\" style=\"gap:6px\">${track}<\u002Fdiv>\n    <div class=\"note info\" style=\"margin-top:14px\"><span class=\"ni\">i<\u002Fspan><div>${stage}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"ft\" style=\"justify-content:space-between\"><span class=\"small\">Directory entry for the preview. The two reference agents run the full governed path end to end.<\u002Fspan><button class=\"btn ghost\" data-go=\"agents\">Back to My Agents<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\nfunction scrDetail(){const a=A();\n  return `<h2>${a.name}<\u002Fh2><p class=\"lede\">The agent's own page. Open it any time from My Agents to see its runtime, its evidence, its version history, and to redeploy or roll back. Version history is not buried inside the build journey.<\u002Fp>\n  <div class=\"row\" style=\"margin-bottom:14px\">${badge('gov','◆ running')} ${badge('gov','KSA · Riyadh')} ${trustBadge(a)} ${badge('muted',a.runtime)}<\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"hd\"><h3>Version history<\u002Fh3>${badge('muted','rollback / redeploy')}<\u002Fdiv><div class=\"bd\">\n      <div class=\"verrow\"><span><b>v1.4<\u002Fb> · main@8f2a1c · developer@msa-gov<\u002Fspan>${badge('gov','current')}<button class=\"btn sm\" data-redeploy=\"v1.4\">Redeploy<\u002Fbutton><\u002Fdiv>\n      <div class=\"verrow\"><span><b>v1.3<\u002Fb> · main@b1d77a<\u002Fspan><span class=\"small\">yesterday<\u002Fspan><button class=\"btn sm\" data-roll=\"v1.3\">Roll back<\u002Fbutton><\u002Fdiv>\n      <div class=\"verrow\"><span><b>v1.2<\u002Fb> · main@4c9e02<\u002Fspan><span class=\"small\">2 days ago<\u002Fspan><button class=\"btn sm\" data-roll=\"v1.2\">Roll back<\u002Fbutton><\u002Fdiv>\n      <div class=\"note info\" id=\"rollNote\" style=\"margin-top:10px\"><span class=\"ni\">i<\u002Fspan><div>Roll back to any prior version, or redeploy the current one, in one action from the portal (HUMAIN-184 / 465). Each action writes a new deployment record.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>Deployment record<\u002Fh3>${badge('teal','source of truth')}<\u002Fdiv><div class=\"bd\"><div class=\"kv\">\n      <div class=\"k\">Version<\u002Fdiv><div class=\"v\">v1.4 ${badge('gov','current')}<\u002Fdiv><div class=\"k\">Source<\u002Fdiv><div class=\"v\">git main@8f2a1c · ${a.deployCfg[0][1]}<\u002Fdiv><div class=\"k\">Actor<\u002Fdiv><div class=\"v\">developer@msa-gov<\u002Fdiv><div class=\"k\">Time<\u002Fdiv><div class=\"v\">today · 09:43<\u002Fdiv><div class=\"k\">Placement<\u002Fdiv><div class=\"v\">KSA · Riyadh<\u002Fdiv><\u002Fdiv>\n      <div class=\"small\" style=\"margin-top:8px\">Backed by the deployment record store (HUMAIN-182), stamped per deploy (HUMAIN-183).<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"hd\"><h3>Sovereign Runtime<\u002Fh3>${badge('teal','building blocks')}<\u002Fdiv><div class=\"bd\"><div class=\"resgrid\">${blockCards('READY')}<\u002Fdiv>\n    <div class=\"small\" style=\"margin-top:10px\">${RUNTIME_TAGLINE}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"ft\" style=\"justify-content:space-between\"><span class=\"small\">This page is the post-deploy home for the agent.<\u002Fspan><span>\n    <button class=\"btn\" data-go=\"test\">Test in sandbox<\u002Fbutton>\n    <button class=\"btn\" data-go=\"evidence\">Evidence<\u002Fbutton>\n    <button class=\"btn\" data-go=\"listing\">View in Marketplace<\u002Fbutton>\n    <button class=\"btn primary\" data-journey=\"${a.id}\">Replay the governed path →<\u002Fbutton><\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n}\nfunction validateManifest(src){const ub=$(\"#upBadge\");if(ub){ub.className='badge gov';ub.textContent='◆ validated';}\n  const mt=$(\"#upMeta\");if(mt)mt.classList.remove('hidden');\n  const mw=$(\"#manifestWrap\");if(mw)mw.innerHTML=yamlFor(A());\n  const rb=$(\"#toResolveBtn\");if(rb)rb.disabled=false;\n  if(window.lucide)lucide.createIcons();\n  if($(\"#cliLog\"))cliEcho('out','↳ agent.yaml validated (schema v1) · source '+(src||'upload'));}\nfunction animateUpload(){const bar=$(\"#upBar\"),pct=$(\"#upPct\"),stat=$(\"#upStat\"),zone=$(\"#upZone\"),prog=$(\"#upProg\");if(!bar||!zone)return;\n  zone.classList.add('hidden');prog.classList.remove('hidden');let p=0;\n  const t=setInterval(()=>{p+=Math.max(5,Math.round((100-p)*0.2));if(p>100)p=100;bar.style.width=p+'%';pct.textContent=p+'%';\n    if(p>=100){clearInterval(t);stat.innerHTML='<i data-lucide=\"loader-2\"><\u002Fi> validating against manifest schema v1…';if(window.lucide)lucide.createIcons();\n      setTimeout(()=>{stat.style.display='none';validateManifest('upload');},700);\n    }},140);\n}\nfunction useEditedYaml(){const ta=$(\"#yamlEdit\");const stat=$(\"#editStat\");\n  if(ta&&(!ta.value||!/kind:\\s*Agent/i.test(ta.value))){if(stat){stat.className='note alert';stat.innerHTML='<span class=\"ni\">!<\u002Fspan><div>This does not look like an agent manifest. It needs at least <b>kind: Agent<\u002Fb> and a <b>metadata.name<\u002Fb>.<\u002Fdiv>';}return;}\n  if(stat){stat.className='note gov';stat.innerHTML='<span class=\"ni\">✓<\u002Fspan><div>Manifest validated against schema v1 (HUMAIN-233). Parsed and ready to resolve.<\u002Fdiv>';}\n  validateManifest('edited');}\nfunction scrSubmit(){const a=A();const fname=a.manifest[0][1]+'.yaml';\n  return `<h2>Submit a new version<\u002Fh2><p class=\"lede\">You submit one thing: the agent's <b>agent.yaml<\u002Fb>. The manifest is the whole agent — runtime, services, data, policy, and a <b>source<\u002Fb> field that says where the code lives. There is no separate package upload. HUMAIN ONE validates and resolves everything behind it, and the live v1.4 keeps serving until v1.5 is certified.<\u002Fp>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"hd\"><h3>Agent manifest<\u002Fh3><span id=\"upBadge\" class=\"badge muted\">agent.yaml<\u002Fspan><\u002Fdiv><div class=\"bd\">\n      <div class=\"srcpick\"><div class=\"srctab sel\" data-mmode=\"upload\">⤓ Upload agent.yaml<\u002Fdiv><div class=\"srctab\" data-mmode=\"edit\">✎ Edit inline<\u002Fdiv><\u002Fdiv>\n      <div id=\"mUpload\">\n        <div id=\"upZone\" class=\"upzone\"><div class=\"upicon\">⤓<\u002Fdiv><div>Drop <b>${fname}<\u002Fb> here, or<\u002Fdiv><button class=\"btn primary\" id=\"upBtn\" style=\"margin-top:10px\">Choose agent.yaml<\u002Fbutton><div class=\"small\" style=\"margin-top:10px\">Validated against manifest schema v1 on upload<\u002Fdiv><\u002Fdiv>\n        <div id=\"upProg\" class=\"hidden\"><div class=\"upfilecard\"><span class=\"upfilecard-ic\"><i data-lucide=\"file-code-2\"><\u002Fi><\u002Fspan><div class=\"upfilecard-main\"><div class=\"uprow\"><span class=\"upfile\">${fname}<\u002Fspan><span id=\"upPct\" class=\"small\">0%<\u002Fspan><\u002Fdiv><div class=\"deploybar\"><i id=\"upBar\"><\u002Fi><\u002Fdiv><\u002Fdiv><\u002Fdiv><div id=\"upStat\" class=\"small\" style=\"margin-top:9px;display:flex;align-items:center;gap:6px\">Uploading…<\u002Fdiv><\u002Fdiv>\n        <div class=\"row\" style=\"justify-content:space-between;align-items:center;margin-top:12px\"><span class=\"small\">Don't have one yet?<\u002Fspan><button class=\"btn sm\" id=\"dlExample\">⤓ Download example agent.yaml<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"mEdit\" class=\"hidden\">\n        <textarea id=\"yamlEdit\" spellcheck=\"false\" style=\"width:100%;min-height:300px;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;line-height:1.55;background:var(--ink);color:#dfe7ea;border:1px solid var(--line-2);border-radius:10px;padding:14px;resize:vertical;white-space:pre\">${yamlText(a)}<\u002Ftextarea>\n        <div class=\"row\" style=\"justify-content:space-between;align-items:center;margin-top:10px\"><span class=\"small\">Edit the manifest here and validate without leaving the browser.<\u002Fspan><span style=\"display:flex;gap:8px\"><button class=\"btn sm\" id=\"dlExample2\">⤓ Download<\u002Fbutton><button class=\"btn primary sm\" id=\"useYaml\">Validate &amp; use →<\u002Fbutton><\u002Fspan><\u002Fdiv>\n        <div id=\"editStat\" class=\"note info\" style=\"margin-top:12px\"><span class=\"ni\">i<\u002Fspan><div>The manifest is the only thing you submit. The <b>source<\u002Fb> field declares where the code lives.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"upMeta\" class=\"hidden\">\n        <div class=\"upok\"><span class=\"upok-ic\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan><div><b>${fname}<\u002Fb> validated · manifest schema v1 <span class=\"small\">(HUMAIN-233)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"upsum\">\n          <div class=\"upsum-row\"><span class=\"upsum-k\">Agent name<\u002Fspan><span class=\"upsum-v\">${a.name}<\u002Fspan><\u002Fdiv>\n          <div class=\"upsum-row\"><span class=\"upsum-k\">Version<\u002Fspan><span class=\"upsum-v\">v1.5 ${badge('preview','new')} <span class=\"small\" style=\"color:var(--muted)\">· current live: v1.4<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"upsum-row\"><span class=\"upsum-k\">Runtime<\u002Fspan><span class=\"upsum-v\" style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12.5px\">${a.runtime}<\u002Fspan><\u002Fdiv>\n          <div class=\"upsum-row\"><span class=\"upsum-k\">Source<\u002Fspan><span class=\"upsum-v\" style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12.5px\">${a.srcType||'git'} · ${a.srcRepo||'github.com/your-org/your-agent'} @ ${(a.srcRef||'main').split('@')[1]||a.srcRef||'main'}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"note gov\" style=\"margin-top:14px\"><span class=\"ni\">◆<\u002Fspan><div>Manifest format follows HUMAIN One (H2O) as source of truth. No infrastructure choices are asked here, and there is no second file to upload.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv><div class=\"ft\"><button class=\"btn ghost\" data-go=\"agents\">Cancel<\u002Fbutton><button class=\"btn primary\" id=\"toResolveBtn\" disabled data-go=\"resolve\">Submit &amp; Resolve →<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>Detected manifest<\u002Fh3><span class=\"small\">read-only<\u002Fspan><\u002Fdiv><div class=\"bd\"><div class=\"manifest\" id=\"manifestWrap\"><span class=\"cmt\"># waiting for agent.yaml — upload or edit to validate &amp; parse…<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction scrResolve(){const a=A();\n  const rows=[\n    [\"Sandbox template match\",`Matched <b>${a.template.name} ${a.template.version}<\u002Fb> (${a.template.spec}). ${a.template.reason}`],\n    [\"Manifest-derived config\",`From agent.yaml: runtime <b>${a.runtime}<\u002Fb>, entrypoint <b>${a.entrypoint}<\u002Fb>, resources <b>${a.cpu} vCPU · ${a.memory}<\u002Fb>, a <b>${a.nodes.length}-node<\u002Fb> workflow graph. The platform generates the deployment config (endpoint, health <b>${a.health}<\u002Fb>, replicas <b>${a.replicas}<\u002Fb>, scaling) as a separate devflow-deployment.yaml.`],\n    [\"Sovereign Runtime to assemble\",`Building blocks: Private Network, Runtime Cluster, Compute Pool, Identity &amp; Access, Database, Storage, Secrets Vault, Image Registry. Provisioned as code.`],\n    [\"Application blueprints\",a.blueprints.map(b=>b[0]).join(\", \")+`. SMTP capture is a real, shipped blueprint.`],\n    [\"Governance inherited\",`Egress <b>deny-all except approved endpoints<\u002Fb>, data <b>${a.gov[1][1]}<\u002Fb>, retention <b>${a.gov[2][1]}<\u002Fb>, access <b>${a.gov[3][1]}<\u002Fb>.`],\n    [\"Sovereign placement\",`<b>KSA · Riyadh.<\u002Fb> Because the Sovereign Runtime is provisioned as code, the same plan runs on any cloud and stays in the Kingdom from day one.`],\n    [\"Audit &amp; lifecycle\",`Plan generated and recorded. State set to <b>review required<\u002Fb> before provisioning.`]\n  ];\n  const rendered=rows.map((r,i)=>`<div class=\"rrow pending\" data-i=\"${i}\"><div class=\"rc\">${i+1}<\u002Fdiv><div><div class=\"rt\">${r[0]}<\u002Fdiv><div class=\"rd\">${r[1]}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`).join(\"\");\n  return `<h2>Resolve &amp; Govern<\u002Fh2><p class=\"lede\">The new surface. It shows its work. HUMAIN ONE reads the package and resolves the matched sandbox template, the Sovereign Runtime it will assemble, the governance, and the sovereign placement, step by step. No black box.<\u002Fp>\n  <div class=\"card\"><div class=\"hd\"><h3>Resolving ${a.name}<\u002Fh3><span id=\"resolveState\" class=\"badge muted\">resolving…<\u002Fspan><\u002Fdiv><div class=\"bd\"><div class=\"resolve\" id=\"resolveList\">${rendered}<\u002Fdiv><\u002Fdiv>\n  <div class=\"ft\"><span class=\"small\" id=\"resolveHint\" style=\"margin-right:auto\">Reading manifest and applying tenant policy…<\u002Fspan><button class=\"btn ghost\" data-go=\"submit\">Back<\u002Fbutton><button class=\"btn primary\" id=\"toPlan\" disabled data-go=\"plan\">Review Generated Plan →<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"note preview\" style=\"margin-top:14px\"><span class=\"ni\">Preview<\u002Fspan><div>Sandbox template match, the runtime plan and policy inheritance are shown live. Synthetic data and mock blueprints are representative fixtures for LEAP.<\u002Fdiv><\u002Fdiv>`;\n}\nfunction animateResolve(){const rows=[...document.querySelectorAll('#resolveList .rrow')];let i=0;const tick=()=>{if(i>0)rows[i-1].classList.remove('pending');if(i>=rows.length){$(\"#resolveState\").className=\"badge gov\";$(\"#resolveState\").textContent=\"◆ resolved\";$(\"#resolveHint\").textContent=\"Plan generated. Review required before provisioning.\";const b=$(\"#toPlan\");if(b)b.disabled=false;cliEcho('gd','✓ plan generated · review required');return;}rows[i].querySelector('.rc').textContent=\"✓\";i++;setTimeout(tick,440);};setTimeout(tick,350);}\n\nfunction optsFor(type,cur){let opts=[];\n  if(type==='src')opts=[\"Upload Zip\",\"From GitHub\",\"Pre-built Image\"];\n  else if(type==='rep')opts=[\"1\",\"2\",\"3\",\"4\"];\n  else if(type==='res')opts=[\"1 vCPU · 2Gi\",\"2 vCPU · 4Gi\",\"4 vCPU · 8Gi\"];\n  else if(type==='hpa')opts=[cur,\"min 2 · max 6 · target 60% CPU\",\"min 1 · max 4 · target 80% CPU\"];\n  else if(type==='region')opts=REGIONS;\n  const uniq=[...new Set(opts)];\n  return `<select class=\"ov\">${uniq.map(o=>`<option ${o===cur?'selected':''}>${o}<\u002Foption>`).join(\"\")}<\u002Fselect> ${badge('teal','overridable')}`;\n}\nfunction scrPlan(){const a=A();\n  const rep=a.deployCfg.find(c=>c[2]==='rep'),res=a.deployCfg.find(c=>c[2]==='res'),rg=a.deployCfg.find(c=>c[2]==='region');\n  const gov=a.gov.map(g=>`<div class=\"k\">${g[0]}<\u002Fdiv><div class=\"v\">${g[1]} ${badge('lock','🔒')}<\u002Fdiv>`).join(\"\");\n  return `<h2>Review &amp; approve<\u002Fh2><p class=\"lede\">HUMAIN ONE resolved everything from your agent. Adjust the few open fields if you need to, then approve.<\u002Fp>\n  <div class=\"card\"><div class=\"hd\"><h3>Deployment<\u002Fh3><span>${badge('gov','◆ KSA · Riyadh')} ${badge('teal','resolved')}<\u002Fspan><\u002Fdiv><div class=\"bd\">\n    <div class=\"kv\" style=\"grid-template-columns:150px 1fr\">\n      <div class=\"k\">Runtime<\u002Fdiv><div class=\"v\">${a.runtime} · port ${a.port} ${badge('lock','🔒 locked')}<\u002Fdiv>\n      <div class=\"k\">Replicas<\u002Fdiv><div class=\"v\">${optsFor('rep',rep?rep[1]:'2')}<\u002Fdiv>\n      <div class=\"k\">Compute<\u002Fdiv><div class=\"v\">${optsFor('res',res?res[1]:'2 vCPU · 4Gi')}<\u002Fdiv>\n      <div class=\"k\">Region<\u002Fdiv><div class=\"v\">${optsFor('region',rg?rg[1]:'KSA · Riyadh')}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"row\" style=\"margin-top:14px;align-items:center;justify-content:space-between\">\n      <span class=\"small\">Sovereign Runtime · 8 governed blocks · provisioned as code · policy inherited.<\u002Fspan>\n      <button class=\"btn sm\" id=\"planMore\">Show details<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"planDetails\" class=\"hidden\" style=\"margin-top:14px\">\n      <div class=\"lbl\">Sovereign Runtime blocks<\u002Fdiv><div class=\"resgrid\" style=\"margin-top:6px\">${blockCards('planned')}<\u002Fdiv>\n      <hr class=\"sep\"/><div class=\"lbl\">Governance &amp; placement<\u002Fdiv>\n      <div class=\"kv\" style=\"margin-top:6px;grid-template-columns:160px 1fr\">${gov}<div class=\"k\">Placement<\u002Fdiv><div class=\"v\">KSA · Riyadh ${badge('gov','sovereign')}<\u002Fdiv><div class=\"k\">Tenant<\u002Fdiv><div class=\"v\">msa-gov<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"ft\" style=\"justify-content:space-between\"><span class=\"small\">Approving writes the audit record and provisions the runtime.<\u002Fspan><span><button class=\"btn ghost\" data-go=\"resolve\">Back<\u002Fbutton> <button class=\"btn\" data-modal=\"reqtpl\">No template fits?<\u002Fbutton> <button class=\"btn primary\" data-go=\"deploy\">Approve &amp; provision →<\u002Fbutton><\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n}\n\nfunction scrDeploy(){const a=A();\n  const blocks=BLOCKS.map((b,i)=>`<div class=\"rescard\" data-r=\"${i}\"><div><div class=\"rn\">${b[0]}<\u002Fdiv><div class=\"rsub\"><span class=\"cap\">${b[2]}<\u002Fspan><\u002Fdiv><\u002Fdiv><span class=\"statedot\" data-state=\"${i}\"><i><\u002Fi>queued<\u002Fspan><\u002Fdiv>`).join(\"\");\n  const chk=[[\"agent.yaml present in project root\",\"ok\"],[\"Dockerfile present in repository root\",\"ok\"],[\"Port \"+a.port+\" exposed in container\",\"ok\"],[\"Health check endpoint configured\",\"ok\"],[\"Build + publish pipeline\",\"wait\"]];\n  return `<h2>Provision &amp; Deploy<\u002Fh2><p class=\"lede\">HUMAIN ONE assembles the Sovereign Runtime from the approved plan and runs the build pipeline. You did not pick a cluster, region, or cloud. The runtime is provisioned as code, so it resolves all of it from your agent and stays in-Kingdom.<\u002Fp>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"hd\"><h3>Assembling the Sovereign Runtime<\u002Fh3><span id=\"depBadge\" class=\"badge muted\">starting…<\u002Fspan><\u002Fdiv><div class=\"bd\"><div class=\"deploybar\"><i id=\"depBar\"><\u002Fi><\u002Fdiv><div class=\"resgrid\" id=\"resList\">${blocks}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>Build pipeline &amp; logs<\u002Fh3>${badge('muted','CI/CD')}<\u002Fdiv><div class=\"bd\">\n      <ul class=\"checklist\" id=\"chk\">${chk.map((c,i)=>`<li class=\"${c[1]==='ok'?'ok':'wait'}\" data-c=\"${i}\"><span class=\"ck\">${c[1]==='ok'?'✓':'…'}<\u002Fspan>${c[0]}<\u002Fli>`).join(\"\")}<\u002Ful>\n      <div class=\"logbox\" id=\"log\" style=\"margin-top:12px\"><div class=\"t\"># assembling Sovereign Runtime · provisioned as code · cloud abstracted<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"ft\"><span class=\"small\" style=\"margin-right:auto\">On success a deployment record is written: version, source, actor, time (HUMAIN-182/183).<\u002Fspan><button class=\"btn primary\" id=\"toRuntime\" disabled data-go=\"runtime\">Open runtime detail →<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\nfunction animateDeploy(){const cards=[...document.querySelectorAll('#resList [data-state]')];const bar=$(\"#depBar\");const log=$(\"#log\");\n  const lines=[\"Private Network — isolated network + subnets…\",\"Runtime Cluster — private container cluster…\",\"Compute Pool — right-sizing compute…\",\"Identity & Access — binding scoped service identity…\",\"Database — managed SQL, private address…\",\"Storage — object storage with lifecycle…\",\"Secrets Vault — provisioning scoped secrets…\",\"Image Registry — building + publishing image…\",\"deployment record v1.5 stamped · all blocks READY · KSA Riyadh\"];let i=0;\n  const tick=()=>{ if(i<cards.length){cards[i].className=\"statedot prov\";cards[i].innerHTML=\"<i><\u002Fi>provisioning\";}\n    if(i>0){cards[i-1].className=\"statedot ready\";cards[i-1].innerHTML=\"<i><\u002Fi>READY\";}\n    if(log&&lines[i]){const ok=i>=lines.length-1;log.innerHTML+=`<div class=\"${ok?'ok':''}\"><span class=\"t\">›<\u002Fspan> ${lines[i]}<\u002Fdiv>`;log.scrollTop=log.scrollHeight;}\n    bar.style.width=Math.round(((i+1)/cards.length)*100)+\"%\";\n    if(i>=cards.length){const c=$(\"#chk [data-c='4']\");if(c){c.className=\"ok\";c.querySelector('.ck').textContent=\"✓\";}$(\"#depBadge\").className=\"badge gov\";$(\"#depBadge\").textContent=\"◆ all READY\";const b=$(\"#toRuntime\");if(b)b.disabled=false;cliEcho('gd','✓ deployed · deployment record v1.5 · all blocks READY');return;} i++;setTimeout(tick,520);};\n  setTimeout(()=>{bar.style.width=\"5%\";tick();},350);}\n\nfunction scrRuntime(){const a=A();\n  return `<h2>Runtime &amp; Resources<\u002Fh2><p class=\"lede\">The provisioned sandbox for this agent. The runtime is the Sovereign Runtime, assembled from named building blocks and shown with their ready state. Because it is provisioned as code, HUMAIN ONE places this runtime in-Kingdom from day one, whatever the cloud underneath.<\u002Fp>\n  <div class=\"card\"><div class=\"hd\"><h3>${a.manifest[0][1]} · Sovereign Runtime<\u002Fh3><span>${badge('gov','◆ running')} ${badge('gov','KSA · Riyadh')} ${badge('teal','provisioned as code')}<\u002Fspan><\u002Fdiv><div class=\"bd\">\n    <div class=\"resgrid\">${blockCards('READY')}<\u002Fdiv>\n    <div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">◆<\u002Fspan><div>${RUNTIME_TAGLINE} Swap the cloud underneath and the agent does not change. Sovereignty is a property of the runtime, not the demo.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"hd\"><h3>Deployment record<\u002Fh3>${badge('teal','source of truth')}<\u002Fdiv><div class=\"bd\"><div class=\"kv\" style=\"grid-template-columns:160px 1fr\">\n    <div class=\"k\">Version<\u002Fdiv><div class=\"v\">v1.5 ${badge('preview','new · in test')}<\u002Fdiv><div class=\"k\">Source<\u002Fdiv><div class=\"v\">git main@8f2a1c · ${a.deployCfg[0][1]}<\u002Fdiv><div class=\"k\">Actor<\u002Fdiv><div class=\"v\">developer@msa-gov<\u002Fdiv><div class=\"k\">Time<\u002Fdiv><div class=\"v\">today · 09:43<\u002Fdiv><\u002Fdiv>\n    <div class=\"note info\" style=\"margin-top:10px\"><span class=\"ni\">i<\u002Fspan><div>This is the new version in its test sandbox. The live v1.4 keeps serving; version history and rollback live on the agent's page.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"ft\"><button class=\"btn ghost\" data-go=\"deploy\">Back<\u002Fbutton><button class=\"btn primary\" data-go=\"test\">Test in sandbox →<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\n\nfunction scrTest(){const a=A();\n  return `<h2>Test in Sandbox<\u002Fh2><p class=\"lede\">This is the developer validating the agent inside the sandbox, against synthetic data. It produces the evidence behind the agent's Trust Score. This is testing, not a citizen using the service. Consumption happens later, on the Marketplace.<\u002Fp>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"hd\"><h3>Connect data + run evaluation<\u002Fh3>${PRISM}<\u002Fdiv><div class=\"bd\">\n      <div class=\"kv\"><div class=\"k\">Dataset<\u002Fdiv><div class=\"v\">${a.manifest[6][1]} ${badge('muted','synthetic')}<\u002Fdiv><div class=\"k\">Eval suite<\u002Fdiv><div class=\"v\">${a.id==='citizen'?'citizen-eligibility-eval':'procurement-compliance-eval'}<\u002Fdiv><div class=\"k\">Runner<\u002Fdiv><div class=\"v\">per-sandbox · isolated<\u002Fdiv><\u002Fdiv>\n      <button class=\"btn primary\" id=\"runEval\" style=\"margin-top:14px\">Run evaluation suite<\u002Fbutton>\n      <div id=\"evalOut\" class=\"note info\" style=\"margin-top:12px\"><span class=\"ni\">i<\u002Fspan><div>If the Prism integration lands by LEAP, scoring runs in Prism. If not, this is a mock evaluation that returns the same shape of evidence (epic HUMAIN-111).<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>Developer test exchange<\u002Fh3><span class=\"small\">synthetic<\u002Fspan><\u002Fdiv><div class=\"bd\"><div class=\"chat\">\n      <div class=\"bub user\">${a.scenario.turns[0].text}<\u002Fdiv>\n      <div class=\"bub agent\">${a.id==='citizen'?'Likely within the eligibility threshold; two documents missing. Routing a case summary to a case officer.':'That route is not compliant at 180,000 SAR. Recommending the competitive quotation route and drafting the package for a procurement officer.'}<span class=\"cite\">Policy-grounded · redaction applied · human handoff prepared<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">◆<\u002Fspan><div>No production data. The developer is checking behavior and capturing evidence before the new version is published.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"ft\"><button class=\"btn ghost\" data-go=\"runtime\">Back<\u002Fbutton><button class=\"btn primary\" data-go=\"evidence\">See evidence →<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\n\nfunction scrEvidence(){const a=A();\n  return `<h2>Evidence<\u002Fh2><p class=\"lede\">The lifecycle and evidence trail behind the agent's Trust Score. It turns a tested agent into a publishable one, and travels with the agent into the Marketplace.<\u002Fp>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"hd\"><h3>Lifecycle &amp; audit trail<\u002Fh3>${badge('gov','immutable')}<\u002Fdiv><div class=\"bd\"><ul class=\"tl\">\n      <li><div class=\"tt\">Plan generated<\u002Fdiv><div class=\"td\">Sandbox template ${a.template.version} matched, Sovereign Runtime + governance resolved.<\u002Fdiv><div class=\"ts\">09:41<\u002Fdiv><\u002Fli>\n      <li><div class=\"tt\">Plan approved<\u002Fdiv><div class=\"td\">Audit record written.<\u002Fdiv><div class=\"ts\">09:42<\u002Fdiv><\u002Fli>\n      <li><div class=\"tt\">Provisioned + deployed<\u002Fdiv><div class=\"td\">All Sovereign Runtime blocks READY · deployment record v1.5 · KSA Riyadh.<\u002Fdiv><div class=\"ts\">09:43<\u002Fdiv><\u002Fli>\n      <li><div class=\"tt\">Tested on synthetic data<\u002Fdiv><div class=\"td\">${a.id==='citizen'?'4 redactions':'3 redactions'} · policy traces captured.<\u002Fdiv><div class=\"ts\">09:45<\u002Fdiv><\u002Fli>\n      <li><div class=\"tt\">Human handoff recorded<\u002Fdiv><div class=\"td\">Structured case package routed to the ${a.officer} queue. The agent did not make the final decision.<\u002Fdiv><div class=\"ts\">09:46<\u002Fdiv><\u002Fli>\n      <li><div class=\"tt\">Submitted for certification<\u002Fdiv><div class=\"td\">Queued for domain champion sign-off before listing (preview).<\u002Fdiv><div class=\"ts\">09:47<\u002Fdiv><\u002Fli>\n    <\u002Ful><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>Runtime &amp; governance<\u002Fh3><\u002Fdiv><div class=\"bd\"><div class=\"kv\">\n      <div class=\"k\">Runtime<\u002Fdiv><div class=\"v\">Sovereign Runtime · KSA Riyadh ${badge('gov','running')}<\u002Fdiv>\n      <div class=\"k\">Provisioning<\u002Fdiv><div class=\"v\">As code · cloud abstracted<\u002Fdiv>\n      <div class=\"k\">Egress<\u002Fdiv><div class=\"v\">Deny-all except approved ${badge('lock','🔒')}<\u002Fdiv>\n      <div class=\"k\">Redactions<\u002Fdiv><div class=\"v\">${a.id==='citizen'?'4 applied':'3 applied'}<\u002Fdiv>\n      <div class=\"k\">Policy traces<\u002Fdiv><div class=\"v\">All claims linked to approved rules<\u002Fdiv>\n      <div class=\"k\">Deployment record<\u002Fdiv><div class=\"v\">v1.5 · developer@msa-gov<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"hd\"><h3>Trust Score<\u002Fh3>${PRISM}<\u002Fdiv><div class=\"bd\"><div class=\"scorewrap\">${trustCells(a)}<\u002Fdiv>\n    <div class=\"note info\" style=\"margin-top:12px\"><span class=\"ni\">i<\u002Fspan><div>The Trust Score is a composite of evaluation, audit completeness, policy grounding and governance. It measures readiness to trust, not raw model accuracy.<\u002Fdiv><\u002Fdiv>\n    <div class=\"note preview\" style=\"margin-top:10px\"><span class=\"ni\">Preview<\u002Fspan><div>If Prism lands by LEAP these are live Prism scores; otherwise it is a mock evaluation of the same shape. Certification (domain champion sign-off) is shown as preview.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"ft\"><button class=\"btn ghost\" data-go=\"test\">Back<\u002Fbutton><button class=\"btn primary\" data-go=\"publish\">Submit to Marketplace →<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\n\nfunction scrPublish(){const a=A();\n  return `<h2>Submit v1.5 to Marketplace<\u002Fh2><p class=\"lede\">The supply side ends here. Version <b>v1.5<\u002Fb> is submitted carrying its Trust Score and evidence. Publishing is gated behind certification: a domain champion signs off before v1.5 replaces v1.4 as the live listing. The live v1.4 keeps serving until then.<\u002Fp>\n  <div class=\"card\"><div class=\"hd\"><h3>${a.name} · v1.5<\u002Fh3><span>${trustBadge(a)} ${badge('preview','certification gate · preview')}<\u002Fspan><\u002Fdiv><div class=\"bd\">\n    <ul class=\"checklist\"><li class=\"ok\"><span class=\"ck\">✓<\u002Fspan>Trust Score and evaluation evidence attached<\u002Fli><li class=\"ok\"><span class=\"ck\">✓<\u002Fspan>Audit trail + deployment record (v1.5) attached<\u002Fli><li class=\"ok\"><span class=\"ck\">✓<\u002Fspan>Policy traces captured<\u002Fli><li class=\"wait\"><span class=\"ck\">…<\u002Fspan>Domain champion sign-off — in the domain champion queue (preview)<\u002Fli><\u002Ful>\n    <div class=\"note preview\" style=\"margin-top:14px\"><span class=\"ni\">Preview<\u002Fspan><div>The domain-champion queue and certification gating are shown for direction. On sign-off, v1.5 becomes the live listing and v1.4 is retained for rollback.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"ft\"><button class=\"btn ghost\" data-go=\"evidence\">Back<\u002Fbutton><button class=\"btn primary\" data-go=\"market\">View Marketplace →<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\n\n/* ---------- MARKETPLACE (demand side) ---------- */\nfunction scrMarket(){\n  const pub=AGENTS_INDEX.filter(e=>e.life==='Published');\n  const ICON={citizen:\"users\",procurement:\"file-check-2\",health:\"stethoscope\",permit:\"file-badge\",visa:\"plane\",grants:\"graduation-cap\",hr:\"calendar-clock\",customs:\"package-search\",fraud:\"shield-alert\"};\n  const cards=pub.map(e=>`<div class=\"mktcard\" data-list=\"${e.id}\">\n      <div class=\"mktcard-top\">\n        <span class=\"mktcard-ico\"><i data-lucide=\"${ICON[e.id]||'bot'}\"><\u002Fi><\u002Fspan>\n        ${e.trust?`<span class=\"mkttrust\"><b>${e.trust}<\u002Fb> Trust<\u002Fspan>`:`<span class=\"mkttrust muted\">No score<\u002Fspan>`}\n      <\u002Fdiv>\n      <div class=\"mktcard-nm\">${e.name}<\u002Fdiv>\n      <div class=\"mktcard-sub\">${e.purpose}<\u002Fdiv>\n      <div class=\"mktcard-tags\">${badge('gov','KSA sovereign')} ${badge('gov','published')} ${state.acquired.has(e.id)?badge('teal','✓ acquired'):''}<\u002Fdiv>\n      <div class=\"mktcard-foot\"><span class=\"small\">${e.tenant}<\u002Fspan><span class=\"mktcard-view\">View details <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n  return `<h2>Marketplace<\u002Fh2><p class=\"lede\">The demand side. Only <b>published<\u002Fb> agents are listed — each has passed certification and carries a Trust Score and its evidence. This is where ministries and agencies discover and consume agents. It is separate from the build path.<\u002Fp>\n  <div class=\"note info\" style=\"margin-bottom:16px\"><span class=\"ni\">i<\u002Fspan><div>Single-tenant today. Open, self-serve consumption across the Kingdom is the end-state demand model, sequenced after the supply-side foundation.<\u002Fdiv><\u002Fdiv>\n  <div class=\"mktgrid\">${cards}<\u002Fdiv>`;\n}\nfunction scrListing(){const a=A();\n  const gov=a.gov.map(g=>`<div class=\"k\">${g[0]}<\u002Fdiv><div class=\"v\">${g[1]}<\u002Fdiv>`).join(\"\");\n  return `<h2>${a.name}<\u002Fh2><p class=\"lede\">A published listing. A consumer reads the Trust Score and the evidence and governance behind it, trusts it, then runs the agent. This is consumption, on the demand side, not the developer journey.<\u002Fp>\n  <div class=\"card\"><div class=\"hd\"><h3>${a.name}<\u002Fh3><span>${trustBadge(a)} ${badge('gov','◆ KSA sovereign')} ${badge('preview','review-ready')}<\u002Fspan><\u002Fdiv><div class=\"bd\">\n    <div class=\"small\">${a.purpose} · runtime ${a.runtime} · tenant msa-gov · publisher Ministry of Social Affairs<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"grid2\" style=\"margin-top:16px\">\n    <div class=\"card\"><div class=\"hd\"><h3>Evidence behind the Trust Score<\u002Fh3>${PRISM}<\u002Fdiv><div class=\"bd\">\n      <div class=\"scorewrap\" style=\"margin:0 0 12px\">${trustCells(a)}<\u002Fdiv>\n      <div class=\"kv\"><div class=\"k\">Deployment record<\u002Fdiv><div class=\"v\">v1.4 · main@8f2a1c · developer@msa-gov<\u002Fdiv><div class=\"k\">Audit trail<\u002Fdiv><div class=\"v\">Plan → approve → provision → test → handoff (immutable)<\u002Fdiv><div class=\"k\">Policy traces<\u002Fdiv><div class=\"v\">Every claim linked to approved rules<\u002Fdiv><div class=\"k\">Redactions<\u002Fdiv><div class=\"v\">${a.id==='citizen'?'4 applied':'3 applied'}<\u002Fdiv><div class=\"k\">Human handoff<\u002Fdiv><div class=\"v\">Routed to ${a.officer} queue<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>Governance &amp; sovereignty<\u002Fh3>${badge('gov','explicit')}<\u002Fdiv><div class=\"bd\"><div class=\"kv\">${gov}\n      <div class=\"k\">Placement<\u002Fdiv><div class=\"v\">KSA · Riyadh ${badge('gov','sovereign')}<\u002Fdiv>\n      <div class=\"k\">Runtime<\u002Fdiv><div class=\"v\">Sovereign Runtime (provisioned as code)<\u002Fdiv>\n      <div class=\"k\">Certification<\u002Fdiv><div class=\"v\">Domain champion sign-off ${badge('preview','preview')}<\u002Fdiv><\u002Fdiv>\n      <div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">◆<\u002Fspan><div>Access to the agent follows its data classification. The cloud substrate is abstracted by the Sovereign Runtime, so the listing is in-Kingdom by construction.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"ft\" style=\"justify-content:space-between\"><span class=\"small\">Same package pattern reuses across ministries.<\u002Fspan><span><button class=\"btn ghost\" data-go=\"market\">Back to Marketplace<\u002Fbutton><button class=\"btn primary\" data-go=\"scenario\">Run this agent →<\u002Fbutton><\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n}\nfunction scrScenario(){const a=A();const s=a.scenario;\n  const bubs=s.turns.map(t=>{if(t.who==='user')return `<div class=\"bub user\">${t.text}<\u002Fdiv>`;let inner=\"\";if(t.guard)inner+=`<span class=\"gtag\">⚠ Guardrail · non-compliant route blocked<\u002Fspan>`;inner+=t.text;if(t.cite)inner+=`<span class=\"cite\">${t.cite}<\u002Fspan>`;if(t.handoff)inner+=`<span class=\"cite\">↪ Human-in-the-loop: structured package routed to the ${a.officer} queue. The agent does not make the final decision.<\u002Fspan>`;return `<div class=\"bub agent${t.guard?' guard':''}\">${inner}<\u002Fdiv>`;}).join(\"\");\n  return `<h2>Run Agent · ${a.persona}<\u002Fh2><p class=\"lede\">Demand side. A consumer uses the published agent. This is the runtime behavior a ministry sees, running in policy on synthetic data for the preview.<\u002Fp>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"hd\"><h3>${s.title}<\u002Fh3>${badge('gov','◆ in policy')}<\u002Fdiv><div class=\"bd\"><div class=\"chat\">${bubs}<\u002Fdiv><\u002Fdiv><div class=\"ft\"><span class=\"small\" style=\"margin-right:auto\">Consuming: ${a.name}<\u002Fspan><button class=\"btn\" data-go=\"listing\">Back to listing<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>What governance did here<\u002Fh3><\u002Fdiv><div class=\"bd\"><ul class=\"tl\">\n      <li><div class=\"tt\">Policy-grounded answers<\u002Fdiv><div class=\"td\">Every claim cites approved rules.<\u002Fdiv><\u002Fli>\n      <li><div class=\"tt\">Redaction applied<\u002Fdiv><div class=\"td\">Identifiers redacted before logs.<\u002Fdiv><\u002Fli>\n      <li><div class=\"tt\">Guardrail held<\u002Fdiv><div class=\"td\">${a.id==='citizen'?'No final benefit decision made by the agent.':'A non-compliant route was refused, not executed.'}<\u002Fdiv><\u002Fli>\n      <li><div class=\"tt\">Human handoff<\u002Fdiv><div class=\"td\">Structured package routed to the ${a.officer}.<\u002Fdiv><\u002Fli>\n    <\u002Ful><div class=\"note gov\"><span class=\"ni\">◆<\u002Fspan><div>No production data. Synthetic fixtures only.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n/* ---------- SECONDARY ---------- */\nfunction scrTemplates(){return `<p class=\"lede\">Approved sandbox configurations available to your tenant. Agents are matched to these during Resolve. Developers do not build infrastructure here. Each template assembles the Sovereign Runtime from its building blocks.<\u002Fp>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"hd\"><h3>basic-python-sandbox<\u002Fh3>${badge('muted','system default')}<\u002Fdiv><div class=\"bd\"><div class=\"kv\"><div class=\"k\">Version<\u002Fdiv><div class=\"v\">v1.0.0<\u002Fdiv><div class=\"k\">Runtime<\u002Fdiv><div class=\"v\">python 3.11<\u002Fdiv><div class=\"k\">CPU / Mem<\u002Fdiv><div class=\"v\">2 vCPU · 4Gi · GPU no<\u002Fdiv><div class=\"k\">Services<\u002Fdiv><div class=\"v\">postgres<\u002Fdiv><div class=\"k\">Runtime blocks<\u002Fdiv><div class=\"v\"><span class=\"small\">Network · Cluster · Compute · Database<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>Advance-python-sandbox<\u002Fh3>${badge('gov','active')}<\u002Fdiv><div class=\"bd\"><div class=\"kv\"><div class=\"k\">Version<\u002Fdiv><div class=\"v\">v1.0.0<\u002Fdiv><div class=\"k\">Runtime<\u002Fdiv><div class=\"v\">python 3.11<\u002Fdiv><div class=\"k\">CPU / Mem<\u002Fdiv><div class=\"v\">4 vCPU · 8Gi · GPU no<\u002Fdiv><div class=\"k\">Services<\u002Fdiv><div class=\"v\">postgres<\u002Fdiv><div class=\"k\">Runtime blocks<\u002Fdiv><div class=\"v\"><span class=\"small\">Network · Cluster · Compute · Identity · Database · Storage · Secrets · Registry<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"row\" style=\"margin-top:14px\"><button class=\"btn\" id=\"reqExt\">Request extension<\u002Fbutton><button class=\"btn\" data-modal=\"reqtpl\">Request new template<\u002Fbutton><\u002Fdiv>\n  <div id=\"extNote\"><\u002Fdiv>`;\n}\nfunction scrSandboxes(){\n  const cards=SANDBOXES.map(sb=>{const a=AGENTS[sb.agentId];const running=sb.status.indexOf('Running')>=0;\n    return `<div class=\"sbxcard\" data-sbx=\"${sb.id}\">\n      <div class=\"sbxcard-top\">\n        <span class=\"sbxcard-ico\"><i data-lucide=\"box\"><\u002Fi><\u002Fspan>\n        <div class=\"sbxcard-tt\"><div class=\"sbxcard-nm\">${sb.id}<\u002Fdiv><div class=\"sbxcard-sub\">Sandbox for ${a.name}<\u002Fdiv><\u002Fdiv>\n        ${badge(sb.statusBadge,(running?'● ':'')+sb.status)}\n      <\u002Fdiv>\n      <div class=\"sbxcard-grid\">\n        <div class=\"sbxcell\"><span class=\"sbxcell-l\">Compute<\u002Fspan><span class=\"sbxcell-v\">${sbxCompute(a)}<\u002Fspan><\u002Fdiv>\n        <div class=\"sbxcell\"><span class=\"sbxcell-l\">Region<\u002Fspan><span class=\"sbxcell-v\">KSA · Riyadh<\u002Fspan><\u002Fdiv>\n        <div class=\"sbxcell\"><span class=\"sbxcell-l\">Runtime blocks<\u002Fspan><span class=\"sbxcell-v\">8 assembled<\u002Fspan><\u002Fdiv>\n        <div class=\"sbxcell\"><span class=\"sbxcell-l\">Created<\u002Fspan><span class=\"sbxcell-v\">${sb.created}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sbxcard-foot\"><span class=\"small\"><i data-lucide=\"${running?'wallet':'moon'}\"><\u002Fi> ${sb.costDay}<\u002Fspan><span class=\"sbxcard-view\">Open runtime <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`;}).join(\"\");\n  return `<p class=\"lede\">Provisioned runtimes, each attached to an agent and assembled from the Sovereign Runtime building blocks. Click one to see its compute, scaling, network, and cost. Nothing is created from this screen; idle sandboxes auto-suspend on a time-to-live.<\u002Fp>\n  <div class=\"sbxgrid\">${cards}<\u002Fdiv>\n  <div class=\"note info\" style=\"margin-top:18px\"><span class=\"ni\">i<\u002Fspan><div>Bare environments are created only in Admin. Every sandbox here is owned by an agent, so none are left orphaned and billing.<\u002Fdiv><\u002Fdiv>`;\n}\nfunction scrRequests(){return `<p class=\"lede\">Template and extension requests you have raised. These route to a tenant admin for approval. You cannot self-provision a bare environment; you request a template instead.<\u002Fp>\n  <div class=\"card\"><div class=\"hd\"><h3>Open requests<\u002Fh3><button class=\"btn sm\" data-modal=\"reqtpl\">+ New request<\u002Fbutton><\u002Fdiv><div class=\"bd\"><div class=\"kv\" style=\"grid-template-columns:1.6fr 1fr 1fr 1fr\"><div class=\"k\">Request<\u002Fdiv><div class=\"k\">Type<\u002Fdiv><div class=\"k\">Routed to<\u002Fdiv><div class=\"k\">Status<\u002Fdiv>\n    <div class=\"v\">Custom GPU runtime profile<\u002Fdiv><div class=\"v\">New template<\u002Fdiv><div class=\"v\">Tenant admin<\u002Fdiv><div class=\"v\">${badge('preview','pending approval')}<\u002Fdiv>\n    <div class=\"v\">Advance-python-sandbox · +memory<\u002Fdiv><div class=\"v\">Extension<\u002Fdiv><div class=\"v\">Tenant admin<\u002Fdiv><div class=\"v\">${badge('gov','approved')}<\u002Fdiv>\n    <div class=\"v\">Node 20 template<\u002Fdiv><div class=\"v\">New template<\u002Fdiv><div class=\"v\">Tenant admin<\u002Fdiv><div class=\"v\">${badge('gov','approved → published')}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n}\nfunction scrEvals(){\n  const EICON={Functional:\"clipboard-check\",Safety:\"shield-check\",Compliance:\"scale\",Performance:\"gauge\"};\n  const cards=EVALS.map(ev=>{const a=AGENTS[ev.agentId];const score=a.trustScore;const sc=score>=80?'good':score>=60?'mid':'low';\n    return `<div class=\"evcard\" data-eval=\"${ev.id}\">\n      <div class=\"evcard-l\">\n        <div class=\"evcard-top\">\n          <span class=\"evcard-ico\"><i data-lucide=\"${EICON[ev.focus]||'flask-conical'}\"><\u002Fi><\u002Fspan>\n          <div class=\"evcard-tt\"><div class=\"evcard-nm\">${a.name} · v1.4<\u002Fdiv><div class=\"evcard-suite\">${ev.suite}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"evcard-meta\">\n          <span class=\"evmeta\"><i data-lucide=\"target\"><\u002Fi>${ev.focus}<\u002Fspan>\n          <span class=\"evmeta\"><i data-lucide=\"list-checks\"><\u002Fi>${ev.scenarios} scenarios<\u002Fspan>\n          <span class=\"evmeta\"><i data-lucide=\"clock\"><\u002Fi>${ev.dur}<\u002Fspan>\n          <span class=\"evcard-pass\"><i data-lucide=\"check\"><\u002Fi>Pass<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"evcard-r ${sc}\">\n        <div class=\"evscore\">${score}<\u002Fdiv>\n        <div class=\"evscore-lbl\">Trust<\u002Fdiv>\n        <span class=\"evcard-view\">View results <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>`;}).join(\"\");\n  return `<h2>Evaluations<\u002Fh2><p class=\"lede\">Evaluation runs and the Trust Score per agent version. Click a run to see the score breakdown, suite details, and scenario-level checks. ${`<span class=\"badge preview\">Prism if it lands by LEAP · otherwise mock evaluation<\u002Fspan>`}<\u002Fp>\n  <div class=\"evgrid\">${cards}<\u002Fdiv>\n  <div class=\"note info\" style=\"margin-top:18px\"><span class=\"ni\">i<\u002Fspan><div>epic HUMAIN-111 · evaluation evidence travels with the agent into the Marketplace.<\u002Fdiv><\u002Fdiv>`;\n}\nfunction scrData(){return `<h2>Data Catalog<\u002Fh2><p class=\"lede\">Datasets available to attach to sandboxes. Synthetic and mock sources for safe testing. No production citizen or enterprise data is used in the preview.<\u002Fp>\n  <div class=\"card\"><div class=\"bd\"><div class=\"kv\" style=\"grid-template-columns:1.4fr 1fr 1fr\"><div class=\"k\">Dataset<\u002Fdiv><div class=\"k\">Type<\u002Fdiv><div class=\"k\">Used by<\u002Fdiv>\n    <div class=\"v\">synthetic-citizen-records<\u002Fdiv><div class=\"v\">${badge('muted','synthetic')}<\u002Fdiv><div class=\"v\">Citizen Support Agent<\u002Fdiv>\n    <div class=\"v\">synthetic-procurement-records<\u002Fdiv><div class=\"v\">${badge('muted','synthetic')}<\u002Fdiv><div class=\"v\">Procurement Compliance Agent<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n}\nfunction scrTenancy(){return `<div class=\"note preview\" style=\"margin-bottom:14px\"><span class=\"ni\">🔒<\u002Fspan><div><b>Admin access only.<\u002Fb> Tenancy governance, template authoring, and bare environment creation. Kept out of the developer path so a runtime is never created without an agent attached.<\u002Fdiv><\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"hd\"><h3>Tenants &amp; quotas<\u002Fh3>${badge('gov','governed')}<\u002Fdiv><div class=\"bd\"><div class=\"kv\" style=\"grid-template-columns:1.4fr 1fr 1fr\"><div class=\"k\">Tenant<\u002Fdiv><div class=\"k\">Sandbox quota<\u002Fdiv><div class=\"k\">Status<\u002Fdiv>\n      <div class=\"v\">msa-gov<\u002Fdiv><div class=\"v\">8 / 20<\u002Fdiv><div class=\"v\">${badge('gov','active')}<\u002Fdiv>\n      <div class=\"v\">moh-gov<\u002Fdiv><div class=\"v\">3 / 15<\u002Fdiv><div class=\"v\">${badge('gov','active')}<\u002Fdiv>\n      <div class=\"v\">pif-enterprise-01<\u002Fdiv><div class=\"v\">1 / 10<\u002Fdiv><div class=\"v\">${badge('muted','onboarding')}<\u002Fdiv><\u002Fdiv>\n      <div class=\"note info\" style=\"margin-top:12px\"><span class=\"ni\">i<\u002Fspan><div>Quotas and policy limits are enforced per tenant. Every tenant's Sovereign Runtime is placed in-Kingdom.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>Approved templates<\u002Fh3>${badge('gov','tenant: msa-gov')}<\u002Fdiv><div class=\"bd\"><div class=\"kv\" style=\"grid-template-columns:1fr auto\"><div class=\"k\">basic-python-sandbox<\u002Fdiv><div class=\"v\">v1.0.0 ${badge('gov','active')}<\u002Fdiv><div class=\"k\">Advance-python-sandbox<\u002Fdiv><div class=\"v\">v1.0.0 ${badge('gov','active')}<\u002Fdiv><div class=\"k\">Advance-node-sandbox<\u002Fdiv><div class=\"v\">v1.0.0 ${badge('gov','active')}<\u002Fdiv><div class=\"k\">Custom GPU profile<\u002Fdiv><div class=\"v\">${badge('preview','pending')}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ft\"><button class=\"btn\" data-modal=\"authtpl\">+ Author template<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"margin-top:16px\"><div class=\"hd\"><h3>Bare environment creation<\u002Fh3>${badge('alert','admin scope')}<\u002Fdiv><div class=\"bd\">\n    <p>Creating an empty sandbox with no agent attached is allowed here, for template authoring and platform testing only.<\u002Fp>\n    <button class=\"btn\" data-modal=\"bareenv\">Create bare environment<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\nfunction scrException(){const a=A();return `<h2>Request a Template<\u002Fh2><p class=\"lede\">This path only appears when no approved template matches the agent. It is not part of the normal golden path. The request goes to an admin for approval.<\u002Fp>\n  <div class=\"grid2\">\n    <div class=\"card\"><div class=\"hd\"><h3>Why you are here<\u002Fh3>${badge('alert','no approved match')}<\u002Fdiv><div class=\"bd\"><p>The agent declared a configuration none of the approved templates for <b>msa-gov<\u002Fb> can satisfy. You cannot self-provision a bare environment. Request a new template instead.<\u002Fp><div class=\"kv\" style=\"margin-top:8px\"><div class=\"k\">Unmatched need<\u002Fdiv><div class=\"v\">Custom GPU runtime profile<\u002Fdiv><div class=\"k\">Routes to<\u002Fdiv><div class=\"v\">Tenant admin · template author<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"ft\"><button class=\"btn ghost\" data-go=\"plan\">Back to plan<\u002Fbutton><button class=\"btn primary\" id=\"reqTpl\">Submit template request<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"hd\"><h3>Approval queue<\u002Fh3><span class=\"small\">admin view<\u002Fspan><\u002Fdiv><div class=\"bd\"><ul class=\"tl\" id=\"apprTl\"><li><div class=\"tt\">Request drafted<\u002Fdiv><div class=\"td\">Custom GPU runtime profile for ${a.name}.<\u002Fdiv><\u002Fli><\u002Ful><div class=\"note info\"><span class=\"ni\">i<\u002Fspan><div>Once an admin approves and publishes the template, it becomes a matched option and the agent returns to the normal resolve path.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n/* ---------- OVERLAYS: drawer + modal ---------- */\nfunction openDrawer(html){const d=$(\"#drawer\");d.innerHTML=html;d.classList.add('open');var app=document.getElementById('app');if(app)app.classList.add('collapsed');bindDrawer();}\nfunction openModal(html){$(\"#mbox\").innerHTML=html;$(\"#scrim\").classList.add('show');$(\"#modal\").classList.add('open');bindModal();}\nfunction closeOverlays(){$(\"#drawer\").classList.remove('open');$(\"#modal\").classList.remove('open');$(\"#scrim\").classList.remove('show');}\nfunction closeModal(){$(\"#modal\").classList.remove('open');$(\"#scrim\").classList.remove('show');}\nfunction openNamedModal(n){const M={reqtpl:modalReqTpl,authtpl:modalAuthTpl,bareenv:modalBareEnv,createagent:modalCreateAgent,setupenv:modalSetupEnv};if(M[n])openModal(M[n]());}\nfunction modalSetupEnv(){return `<div class=\"mhd\"><h3>Set up environment<\u002Fh3><button class=\"dclose\" data-act=\"close\"><i data-lucide=\"x\"><\u002Fi><\u002Fbutton><\u002Fdiv><div class=\"mbd\">\n  <p class=\"small\" style=\"margin:0 0 14px\">An environment is set up <b>once<\u002Fb>. Pick a template and region; HUMAIN ONE provisions the Sovereign Runtime as code, in-Kingdom. Agents attach to it later, at session start.<\u002Fp>\n  <label class=\"flbl\">Name<\u002Flabel><input class=\"fld\" id=\"envName\" value=\"msa-gov · Sovereign Runtime 2\"/>\n  <div class=\"row\" style=\"gap:14px;margin-top:12px\">\n    <div style=\"flex:1\"><label class=\"flbl\">Template<\u002Flabel><select class=\"fld\" id=\"envTpl\"><option>Advance-python-sandbox v1.0.0<\u002Foption><option>basic-python-sandbox v1.0.0<\u002Foption><\u002Fs
