elect><\u002Fdiv>\n    <div style=\"flex:1\"><label class=\"flbl\">Region<\u002Flabel><select class=\"fld\" id=\"envRegion\"><option>KSA · Riyadh<\u002Foption><option>KSA · Jeddah<\u002Foption><option>KSA · Dammam<\u002Foption><\u002Fselect><\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"envDone\"><\u002Fdiv>\n  <div class=\"dfoot\" style=\"padding:16px 0 0;border:none;background:none;justify-content:flex-end;gap:10px\"><button class=\"btn ghost\" data-act=\"close\">Cancel<\u002Fbutton><button class=\"btn primary\" id=\"envProv\">Provision runtime<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>`;}\nfunction verPanel(a){return `\n  <div class=\"verrow\"><span><b>v1.5<\u002Fb> · main@8f2a1c · developer@msa-gov<\u002Fspan>${badge('preview','pending publish')}<span class=\"small\">awaiting sign-off<\u002Fspan><\u002Fdiv>\n  <div class=\"verrow\"><span><b>v1.4<\u002Fb> · main@2b9c10<\u002Fspan>${badge('gov','current · live')}<button class=\"btn sm\" data-act=\"redeploy\">Redeploy<\u002Fbutton><\u002Fdiv>\n  <div class=\"verrow\"><span><b>v1.3<\u002Fb> · main@b1d77a<\u002Fspan><span class=\"small\">yesterday<\u002Fspan><button class=\"btn sm\" data-act=\"roll\" data-v=\"v1.3\">Roll back<\u002Fbutton><\u002Fdiv>\n  <div class=\"note info\" id=\"drNote\" style=\"margin-top:10px\"><span class=\"ni\">i<\u002Fspan><div>Roll back or redeploy in one action; each writes a new deployment record (HUMAIN-184 / 182).<\u002Fdiv><\u002Fdiv>\n  <hr class=\"sep\"/><div class=\"lbl\">Deployment record<\u002Fdiv>\n  <div class=\"kv\" style=\"margin-top:6px;grid-template-columns:120px 1fr\"><div class=\"k\">Version<\u002Fdiv><div class=\"v\">v1.4 ${badge('gov','current')}<\u002Fdiv><div class=\"k\">Source<\u002Fdiv><div class=\"v\">git main@8f2a1c · ${a.deployCfg[0][1]}<\u002Fdiv><div class=\"k\">Actor<\u002Fdiv><div class=\"v\">developer@msa-gov<\u002Fdiv><div class=\"k\">Placement<\u002Fdiv><div class=\"v\">KSA · Riyadh<\u002Fdiv><\u002Fdiv>`;}\nfunction evPanel(a){return `\n  <div class=\"scorewrap\" style=\"grid-template-columns:repeat(2,1fr)\">${trustCells(a)}<\u002Fdiv>\n  <div class=\"note info\" style=\"margin-top:12px\"><span class=\"ni\">i<\u002Fspan><div>Trust Score is a composite of evaluation, audit, policy grounding and governance — readiness to trust, not raw accuracy.<\u002Fdiv><\u002Fdiv>\n  <hr class=\"sep\"/><div class=\"lbl\">Audit trail<\u002Fdiv>\n  <ul class=\"tl\" style=\"margin-top:8px\"><li><div class=\"tt\">Plan approved<\u002Fdiv><div class=\"td\">Audit record written.<\u002Fdiv><\u002Fli><li><div class=\"tt\">Provisioned + deployed<\u002Fdiv><div class=\"td\">All Sovereign Runtime blocks READY · v1.4.<\u002Fdiv><\u002Fli><li><div class=\"tt\">Tested on synthetic data<\u002Fdiv><div class=\"td\">Policy traces captured.<\u002Fdiv><\u002Fli><li><div class=\"tt\">Human handoff<\u002Fdiv><div class=\"td\">Routed to the ${a.officer} queue.<\u002Fdiv><\u002Fli><\u002Ful>`;}\nfunction govPanel(a){if(!a.gov)return '<p class=\"small\">No governance data.<\u002Fp>';const gov=a.gov.map(g=>`<div class=\"k\">${g[0]}<\u002Fdiv><div class=\"v\">${g[1]}<\u002Fdiv>`).join(\"\");\n  return `<div class=\"kv\" style=\"grid-template-columns:140px 1fr\">${gov}<div class=\"k\">Placement<\u002Fdiv><div class=\"v\">KSA · Riyadh ${badge('gov','sovereign')}<\u002Fdiv><div class=\"k\">Runtime<\u002Fdiv><div class=\"v\">Sovereign Runtime (as code)<\u002Fdiv><div class=\"k\">Certification<\u002Fdiv><div class=\"v\">Domain champion sign-off ${badge('preview','preview')}<\u002Fdiv><\u002Fdiv>`;}\nfunction manifestPanel(a){\n  const rows=a.manifest.map(r=>`<div class=\"k\">${r[0]}<\u002Fdiv><div class=\"v\">${r[1]}<\u002Fdiv>`).join(\"\");\n  const secrets=a.secrets.map(s=>`<span class=\"badge lock\">${s}<\u002Fspan>`).join(\" \");\n  const evals=a.evalSuites?a.evalSuites.map(s=>`<span class=\"badge lock\">${s}<\u002Fspan>`).join(\" \"):'—';\n  return `<div class=\"kv\" style=\"grid-template-columns:160px 1fr;margin-bottom:14px\">${rows}\n    <div class=\"k\">Secrets<\u002Fdiv><div class=\"v\">${secrets}<\u002Fdiv>\n    <div class=\"k\">Eval suites<\u002Fdiv><div class=\"v\">${evals}<\u002Fdiv><\u002Fdiv>\n  <div class=\"lbl\">agent.yaml<\u002Fdiv>\n  <div style=\"margin-top:8px;background:var(--subtle);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:monospace;font-size:11.5px;white-space:pre;overflow-x:auto;line-height:1.65;color:var(--text)\">${escHtml(yamlText(a))}<\u002Fdiv>\n  <button class=\"btn sm\" style=\"margin-top:10px\" onclick=\"navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify('__yaml__')}.replace('__yaml__',yamlText(AGENTS['${a.manifest[0][1].replace(/'/g,\"\\\\'\")}'])||''))\">Copy YAML<\u002Fbutton>`;\n}\nfunction deployPanel(a){\n  const cfg=a.deployCfg.map(r=>`<div class=\"k\">${r[0]}<\u002Fdiv><div class=\"v\">${r[1]}<\u002Fdiv>`).join(\"\");\n  return `<div class=\"kv\" style=\"grid-template-columns:200px 1fr\">${cfg}<\u002Fdiv>`;\n}\nfunction escHtml(s){return s.replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;');}\n\nfunction agentDrawer(id,ctx){\n  const e=AGENTS_INDEX.find(x=>x.id===id);const full=!!(e.full&&AGENTS[id]);const a=full?AGENTS[id]:null;\n  const pos=LIFE.indexOf(e.life);\n  const track=LIFE.map(s=>`<span class=\"chip ${s===e.life?'sel':''}\" style=\"cursor:default\">${s}<\u002Fspan>`).join(\"\");\n  const blocks=full?`<div class=\"lbl\" style=\"margin-top:16px\">Sovereign Runtime<\u002Fdiv><div class=\"resgrid\" style=\"margin-top:6px\">${blockCards('READY')}<\u002Fdiv>`:`<div class=\"note info\" style=\"margin-top:14px\"><span class=\"ni\">i<\u002Fspan><div>Directory entry for this preview. Use the action below to take it to its next lifecycle step. Full evidence and run are wired for the two reference agents.<\u002Fdiv><\u002Fdiv><div class=\"note info\" id=\"mNote\" style=\"display:none;margin-top:12px\"><\u002Fdiv>`;\n  const overview=`<div class=\"row\" style=\"gap:6px;margin-bottom:12px\">${badge(lifeClass(e.life),e.life)} ${e.trust?badge('teal','Trust '+e.trust):badge('muted','no score yet')} ${badge('muted',e.runtime)} ${badge('muted','tenant: '+e.tenant)}<\u002Fdiv>\n    <p class=\"small\">${e.purpose}<\u002Fp>\n    <div class=\"lbl\" style=\"margin-top:10px\">Lifecycle · stage ${pos+1} of ${LIFE.length}<\u002Fdiv><div class=\"row\" style=\"gap:6px;margin-top:6px\">${track}<\u002Fdiv>${blocks}`;\n  const tabs=[[\"overview\",\"Overview\"]];let panels=`<div class=\"dpanel sel\" data-panel=\"overview\">${overview}<\u002Fdiv>`;\n  if(full){tabs.push([\"versions\",\"Versions\"],[\"evidence\",\"Evidence\"],[\"gov\",\"Governance\"]);\n    panels+=`<div class=\"dpanel\" data-panel=\"versions\">${verPanel(a)}<\u002Fdiv><div class=\"dpanel\" data-panel=\"evidence\">${evPanel(a)}<\u002Fdiv><div class=\"dpanel\" data-panel=\"gov\">${govPanel(a)}<\u002Fdiv>`;}\n  const tabsHTML=tabs.map((t,i)=>`<div class=\"dtab ${i===0?'sel':''}\" data-tab=\"${t[0]}\">${t[1]}<\u002Fdiv>`).join(\"\");\n  let acts=`<button class=\"btn ghost\" data-act=\"close\">Close<\u002Fbutton>`;\n  if(full&&ctx==='market')acts+=`<button class=\"btn primary\" data-act=\"scenario\" data-id=\"${id}\">Run this agent →<\u002Fbutton>`;\n  else if(full)acts+=`<button class=\"btn\" data-act=\"scenario\" data-id=\"${id}\">Run (demo)<\u002Fbutton><button class=\"btn primary\" data-act=\"journey\" data-id=\"${id}\">Submit new version →<\u002Fbutton>`;\n  else if(e.life==='Published')acts+=`<button class=\"btn primary\" data-act=\"mmarket\" data-id=\"${id}\">View in Marketplace →<\u002Fbutton>`;\n  else acts+=`<button class=\"btn primary\" data-act=\"advance\" data-id=\"${id}\">${STEPVERB[e.life]||'Advance →'}<\u002Fbutton>`;\n  return `<div class=\"dhd\"><div style=\"flex:1;min-width:0\"><h3 style=\"margin:0\">${e.name}<\u002Fh3><div class=\"small\" style=\"margin-top:4px\">${ctx==='market'?'Marketplace listing · published · consume only':'Agent · '+id}<\u002Fdiv><\u002Fdiv><button class=\"dclose\" data-act=\"close\" title=\"Close\" style=\"position:static\">✕<\u002Fbutton><\u002Fdiv>\n    <div class=\"dtabs\">${tabsHTML}<\u002Fdiv><div class=\"dbody\">${panels}<\u002Fdiv><div class=\"dfoot\">${acts}<\u002Fdiv>`;\n}\nfunction bindDrawer(){const d=$(\"#drawer\");\n  if(window.lucide)lucide.createIcons();\n  const runEval=d.querySelector('#drRunEval');\n  if(runEval)runEval.onclick=()=>{runEval.disabled=true;runEval.textContent='Running…';setTimeout(()=>{runEval.textContent='Done';const n=d.querySelector('#evNote');if(n){n.style.display='block';n.className='note gov';n.innerHTML='<span class=\"ni\">✓<\u002Fspan><div>Suite completed · all checks passed. Results attached to v1.4 as new evidence.<\u002Fdiv>';}},1800);};\n  d.querySelectorAll('.dtab').forEach(t=>t.onclick=()=>{const k=t.getAttribute('data-tab');d.querySelectorAll('.dtab').forEach(x=>x.classList.toggle('sel',x===t));d.querySelectorAll('.dpanel').forEach(p=>p.classList.toggle('sel',p.getAttribute('data-panel')===k));});\n  d.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const act=b.getAttribute('data-act');\n    if(act==='close')closeOverlays();\n    else if(act==='noop')return;\n    else if(act==='menu'){const p=d.querySelector('#dMenuPop');if(p)p.style.display=p.style.display==='none'?'block':'none';return;}\n    else if(act==='journey'){closeOverlays();startJourney(b.getAttribute('data-id'));}\n    else if(act==='scenario')openModal(modalScenario(b.getAttribute('data-id')));\n    else if(act==='startsession')openModal(modalStartSession(b.getAttribute('data-id')));\n    else if(act==='edit')openModal(modalCreateAgent(b.getAttribute('data-id')));\n    else if(act==='archive'){closeOverlays();go('agents');}\n    else if(act==='goevals'){closeOverlays();go('evals');}\n    else if(act==='chat')openModal(modalChat(b.getAttribute('data-id'),b.getAttribute('data-tenant')));\n    else if(act==='roll'||act==='redeploy'){const n=$(\"#drNote\");if(n){n.className='note gov';n.innerHTML='<span class=\"ni\">✓<\u002Fspan><div>'+(act==='roll'?('Rolled back to '+b.getAttribute('data-v')):'Redeployed v1.4')+' in one action. A new deployment record was written.<\u002Fdiv>';}}\n    else if(act==='openagent')openDrawer(agentDrawer(b.getAttribute('data-id'),'build'));\n    else if(act==='sbxop'){const n=$(\"#sbxNote\");if(n){n.className='note gov';n.innerHTML='<span class=\"ni\">✓<\u002Fspan><div>'+b.getAttribute('data-op')+' requested for this sandbox. The control-plane records the action and logs a lifecycle event.<\u002Fdiv>';}}\n    else if(act==='rerun'){const n=$(\"#evNote\");if(n){n.style.display='block';n.className='note gov';n.innerHTML='<span class=\"ni\">✓<\u002Fspan><div>Suite re-queued on the current sandbox. Results will attach to v1.4 as new evidence.<\u002Fdiv>';}}\n    else if(act==='advance')advanceMock(b.getAttribute('data-id'));\n\n    else if(act==='mmarket')listAgent(b.getAttribute('data-id'));\n    else if(act==='acquire')openModal(modalAcquire(b.getAttribute('data-id')));\n    else if(act==='library'){closeOverlays();go('agents');}\n  });\n}\nfunction modalScenario(id){const a=AGENTS[id];const s=a.scenario;\n  const bubs=s.turns.map(t=>{if(t.who==='user')return `<div class=\"bub user\">${t.text}<\u002Fdiv>`;let inner=\"\";if(t.guard)inner+=`<span class=\"gtag\">⚠ Guardrail · non-compliant route blocked<\u002Fspan>`;inner+=t.text;if(t.cite)inner+=`<span class=\"cite\">${t.cite}<\u002Fspan>`;if(t.handoff)inner+=`<span class=\"cite\">↪ Human-in-the-loop: routed to the ${a.officer} queue. The agent does not make the final decision.<\u002Fspan>`;return `<div class=\"bub agent${t.guard?' guard':''}\">${inner}<\u002Fdiv>`;}).join(\"\");\n  return `<div class=\"mhd\"><h3>Run · ${a.persona}<\u002Fh3><button class=\"dclose\" data-act=\"close\">✕<\u002Fbutton><\u002Fdiv><div class=\"mbd\"><div class=\"row\" style=\"gap:6px;margin-bottom:10px\">${badge('gov','◆ in policy')} ${badge('muted',a.name)} ${badge('muted','synthetic data')}<\u002Fdiv><div class=\"chat\">${bubs}<\u002Fdiv><div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">◆<\u002Fspan><div>No production data. Policy-grounded, redacted, with a human handoff to the ${a.officer}.<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;}\nfunction modalAuthTpl(){return `<div class=\"mhd\"><h3>Author template<\u002Fh3><button class=\"dclose\" data-act=\"close\">✕<\u002Fbutton><\u002Fdiv><div class=\"mbd\">\n  <label class=\"flbl\">Template name<\u002Flabel><input class=\"fld\" id=\"tplName\" placeholder=\"e.g. gov-gpu-python-sandbox\"/>\n  <div class=\"row\" style=\"margin-top:4px\"><div style=\"flex:1\"><label class=\"flbl\">Runtime<\u002Flabel><input class=\"fld\" value=\"python 3.11\"/><\u002Fdiv><div style=\"flex:1\"><label class=\"flbl\">CPU / Memory<\u002Flabel><input class=\"fld\" value=\"8 vCPU · 16Gi\"/><\u002Fdiv><\u002Fdiv>\n  <label class=\"flbl\">Sovereign Runtime blocks<\u002Flabel><input class=\"fld\" value=\"Network · Cluster · Compute · Identity · Database · Storage · Secrets · Registry\"/>\n  <div id=\"authDone\"><\u002Fdiv>\n  <div class=\"dfoot\" style=\"padding:14px 0 0;border:none;background:none\"><button class=\"btn ghost\" data-act=\"close\">Cancel<\u002Fbutton><button class=\"btn primary\" id=\"authSave\">Publish template<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;}\nfunction modalBareEnv(){return `<div class=\"mhd\"><h3>Create bare environment<\u002Fh3><button class=\"dclose\" data-act=\"close\">✕<\u002Fbutton><\u002Fdiv><div class=\"mbd\">\n  <div class=\"note preview\"><span class=\"ni\">⚠<\u002Fspan><div>Bare environments have no agent and no auto-suspend owner. Use only for template authoring or platform testing.<\u002Fdiv><\u002Fdiv>\n  <label class=\"flbl\">Environment name<\u002Flabel><input class=\"fld\" id=\"bareName\" placeholder=\"e.g. tpl-author-scratch\"/>\n  <label class=\"flbl\">Region<\u002Flabel><input class=\"fld\" value=\"KSA · Riyadh\"/>\n  <div id=\"bareDone\"><\u002Fdiv>\n  <div class=\"dfoot\" style=\"padding:14px 0 0;border:none;background:none\"><button class=\"btn ghost\" data-act=\"close\">Cancel<\u002Fbutton><button class=\"btn primary\" id=\"bareCreate\">Create environment<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;}\nfunction modalReqTpl(){return `<div class=\"mhd\"><h3>Request a template<\u002Fh3><button class=\"dclose\" data-act=\"close\">✕<\u002Fbutton><\u002Fdiv><div class=\"mbd\">\n  <p class=\"small\">No approved template matched. You cannot self-provision a bare environment; request a new template and it routes to a tenant admin.<\u002Fp>\n  <div class=\"kv\" style=\"margin-top:8px;grid-template-columns:140px 1fr\"><div class=\"k\">Unmatched need<\u002Fdiv><div class=\"v\">Custom GPU runtime profile<\u002Fdiv><div class=\"k\">Routes to<\u002Fdiv><div class=\"v\">Tenant admin · template author<\u002Fdiv><\u002Fdiv>\n  <ul class=\"tl\" id=\"apprTl\" style=\"margin-top:12px\"><li><div class=\"tt\">Request drafted<\u002Fdiv><div class=\"td\">Custom GPU runtime profile.<\u002Fdiv><\u002Fli><\u002Ful>\n  <div class=\"dfoot\" style=\"padding:14px 0 0;border:none;background:none\"><button class=\"btn ghost\" data-act=\"close\">Cancel<\u002Fbutton><button class=\"btn primary\" id=\"reqTpl\">Submit request<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;}\nconst CA_TEMPLATES=[\n  {id:'blank',name:'Untitled agent',desc:'A blank starting point with the core toolset.',mcp:'[]',\n   system:'You are a general-purpose government agent that can research, write code, run commands, and operate approved tools within your ministry scope.'},\n  {id:'citizen',name:'Citizen support agent',desc:'Eligibility guidance and case resolution for citizen benefits.',mcp:'[policy-service, case-system]',\n   system:'You are a citizen support agent. Check benefit eligibility against approved policy, resolve cases, and hand off to a human officer for final decisions.'},\n  {id:'procurement',name:'Procurement compliance agent',desc:'Policy and budget compliance for internal procurement.',mcp:'[policy-service, budget-system]',\n   system:'You are a procurement compliance agent. Validate purchase requests against policy and budget rules, flag exceptions, and route approvals to the finance officer.'},\n];\nfunction caYaml(t){return ['name: '+t.name,'description: '+t.desc,'model: claude-sonnet-4-6','system: '+t.system,'mcp_servers: '+t.mcp,'tools:','  - type: agent_toolset_20260401','skills: []','# HUMAIN governance — applied by the platform, not the developer','access_scope: ministry-scoped'].join('\\n');}\nfunction caJson(t){return JSON.stringify({name:t.name,description:t.desc,model:'claude-sonnet-4-6',system:t.system,mcp_servers:t.mcp==='[]'?[]:t.mcp.replace(/[\\[\\]]/g,'').split(', '),tools:[{type:'agent_toolset_20260401'}],skills:[],access_scope:'ministry-scoped'},null,2);}\nfunction caConfigBlock(t){return `<div class=\"cacode\">\n    <div class=\"cacode-hd\">\n      <div class=\"cacode-tabs\"><button class=\"cacode-tab sel\" data-fmt=\"yaml\">YAML<\u002Fbutton><button class=\"cacode-tab\" data-fmt=\"json\">JSON<\u002Fbutton><\u002Fdiv>\n      <button class=\"cacode-copy\" id=\"caCopy\" title=\"Copy\"><i data-lucide=\"copy\"><\u002Fi><\u002Fbutton>\n    <\u002Fdiv>\n    <pre class=\"cacode-bd\" id=\"caCode\">${escHtml(caYaml(t))}<\u002Fpre>\n  <\u002Fdiv>`;}\nfunction modalCreateAgent(editId){\n  const ed=editId&&AGENTS[editId]?AGENTS[editId]:null;\n  const eIdx=editId?AGENTS_INDEX.find(x=>x.id===editId):null;\n  const t=CA_TEMPLATES[0];\n  const title=ed?'Edit agent':'Create agent';\n  const intro=ed?'Update your agent — edit the description or config below.':'Start from a template or describe what you need.';\n  const cfgInit=ed?(ed.caCfg||caYaml(Object.assign({},CA_TEMPLATES[0],{name:ed.name,desc:ed.purpose||eIdx&&eIdx.purpose||''}))):caYaml(t);\n  return `<div class=\"mhd\"><h3>${title}<\u002Fh3><button class=\"dclose\" data-act=\"close\"><i data-lucide=\"x\"><\u002Fi><\u002Fbutton><\u002Fdiv><div class=\"mbd\" id=\"caBody\" data-tpl=\"blank\" data-mode=\"describe\"${ed?` data-edit=\"${editId}\" data-generated=\"1\" data-genname=\"${(ed.name||'').replace(/\"/g,'&quot;')}\" data-gendesc=\"${(ed.purpose||'').replace(/\"/g,'&quot;')}\"`:''}>\n  <p class=\"small\" style=\"margin:0 0 16px\">${intro}<\u002Fp>\n  <div class=\"lbl\">Starting point<\u002Fdiv>\n  <div class=\"caseg\" style=\"margin-top:8px\">\n    <button class=\"caseg-opt sel\" data-mode=\"describe\">Describe your agent<\u002Fbutton>\n    <button class=\"caseg-opt\" data-mode=\"template\">Template<\u002Fbutton>\n  <\u002Fdiv>\n  <div id=\"caDescribe\" style=\"margin-top:14px\">\n    <div class=\"cacompose\">\n      <textarea id=\"caPrompt\" rows=\"3\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Describe what you want to build — e.g. Summarizes new GitHub PRs and posts a digest to Slack.\">${ed?(ed.purpose||''):''}<\u002Ftextarea>\n      <div class=\"cacompose-bar\">\n        <span class=\"cacompose-hint\"><i data-lucide=\"sparkles\"><\u002Fi> ${ed?'Re-generate the config from your description':'Generates a starting config you can edit'}<\u002Fspan>\n        <button class=\"btn primary\" id=\"caGen\"><i data-lucide=\"wand-2\"><\u002Fi> ${ed?'Re-generate':'Generate'}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"caTemplate\" style=\"margin-top:14px;display:none\">\n    ${CA_TEMPLATES.map((x,i)=>`<button class=\"catpl${i===0?' sel':''}\" data-tpl=\"${x.id}\"><div class=\"catpl-nm\">${x.name}<\u002Fdiv><div class=\"catpl-ds\">${x.desc}<\u002Fdiv><\u002Fbutton>`).join('')}\n  <\u002Fdiv>\n  <div class=\"lbl\" style=\"margin-top:18px\">Agent config<\u002Fdiv>\n  <div id=\"caConfig\" style=\"margin-top:8px\"><div class=\"cacode\">\n    <div class=\"cacode-hd\">\n      <div class=\"cacode-tabs\"><button class=\"cacode-tab sel\" data-fmt=\"yaml\">YAML<\u002Fbutton><button class=\"cacode-tab\" data-fmt=\"json\">JSON<\u002Fbutton><\u002Fdiv>\n      <button class=\"cacode-copy\" id=\"caCopy\" title=\"Copy\"><i data-lucide=\"copy\"><\u002Fi><\u002Fbutton>\n    <\u002Fdiv>\n    <pre class=\"cacode-bd\" id=\"caCode\">${escHtml(cfgInit)}<\u002Fpre>\n  <\u002Fdiv><\u002Fdiv>\n  <div class=\"dfoot\" style=\"padding:16px 0 0;border:none;background:none;justify-content:space-between;align-items:center\">\n    <span class=\"small\" id=\"caMsg\" style=\"color:var(--muted)\">${ed?'Changes apply on save.':'Environment is attached later, when you start a session.'}<\u002Fspan>\n    <button class=\"btn primary\" id=\"caCreate\">${ed?'Save changes':'Create agent'}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>`;}\nfunction bindModal(){const m=$(\"#mbox\");\n  const envProv=m.querySelector('#envProv');\n  if(envProv)envProv.onclick=()=>{const nm=(m.querySelector('#envName').value||'new-env').split('·')[0].trim();const region=m.querySelector('#envRegion').value;const tpl=m.querySelector('#envTpl').value;\n    ENVIRONMENTS.push({name:m.querySelector('#envName').value,desc:'Provisioned just now, once. Agents attach at session start.',region:region,blocks:tpl.indexOf('Advance')>=0?8:6,agents:0,fresh:true});\n    envProv.disabled=true;envProv.textContent='Provisioned';state.envTab='environments';setTimeout(()=>{closeModal();go('env');},500);};\n  // ---- Start session env picker ----\n  const ssBody=m.querySelector('#ssBody');\n  if(ssBody){\n    m.querySelectorAll('.ssenv').forEach(o=>o.onclick=()=>{m.querySelectorAll('.ssenv').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');ssBody.setAttribute('data-env',o.getAttribute('data-env'));});\n    const ss=m.querySelector('#ssStart');if(ss)ss.onclick=()=>{const id=ssBody.getAttribute('data-id');const env=ssBody.getAttribute('data-env');addSession(id,env);refreshDrawerToSessions(id);openModal(modalChat(id,env));};\n  }\n  // ---- Create agent modal ----\n  const caBody=m.querySelector('#caBody');\n  if(caBody){\n    const tplOf=id=>CA_TEMPLATES.find(x=>x.id===id)||CA_TEMPLATES[0];\n    const rerenderConfig=()=>{const t=tplOf(caBody.getAttribute('data-tpl'));m.querySelector('#caConfig').innerHTML=caConfigBlock(t);bindCaCode();if(window.lucide)lucide.createIcons();};\n    const bindCaCode=()=>{const t=tplOf(caBody.getAttribute('data-tpl'));\n      m.querySelectorAll('.cacode-tab').forEach(tb=>tb.onclick=()=>{m.querySelectorAll('.cacode-tab').forEach(x=>x.classList.remove('sel'));tb.classList.add('sel');const fmt=tb.getAttribute('data-fmt');m.querySelector('#caCode').textContent=fmt==='json'?caJson(t):caYaml(t);});\n      const cp=m.querySelector('#caCopy');if(cp)cp.onclick=()=>{const txt=m.querySelector('#caCode').textContent;if(navigator.clipboard)navigator.clipboard.writeText(txt);cp.classList.add('ok');setTimeout(()=>cp.classList.remove('ok'),900);};};\n    bindCaCode();\n    m.querySelectorAll('.caseg-opt').forEach(o=>o.onclick=()=>{m.querySelectorAll('.caseg-opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');const mode=o.getAttribute('data-mode');caBody.setAttribute('data-mode',mode);m.querySelector('#caDescribe').style.display=mode==='describe'?'block':'none';m.querySelector('#caTemplate').style.display=mode==='template'?'block':'none';});\n    m.querySelectorAll('.catpl').forEach(c=>c.onclick=()=>{m.querySelectorAll('.catpl').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');caBody.setAttribute('data-tpl',c.getAttribute('data-tpl'));rerenderConfig();});\n    const gen=m.querySelector('#caGen');if(gen)gen.onclick=()=>{const p=(m.querySelector('#caPrompt').value||'').trim();if(!p){m.querySelector('#caPrompt').focus();return;}gen.disabled=true;gen.textContent='Generating…';setTimeout(()=>{gen.disabled=false;gen.textContent='Generate';const nm=(p.split(/[.\\n]/)[0]||'').trim().slice(0,48)||'Untitled agent';const t=Object.assign({},CA_TEMPLATES[0],{name:nm,desc:p});const cfg=m.querySelector('#caConfig');cfg.innerHTML=caConfigBlock(t);bindCaCode();caBody.setAttribute('data-generated','1');caBody.setAttribute('data-genname',nm);caBody.setAttribute('data-gendesc',p);const msg=m.querySelector('#caMsg');if(msg){msg.style.color='var(--muted)';msg.textContent='Config generated — review it, then create the agent.';}if(window.lucide)lucide.createIcons();},1100);};\n    const cr=m.querySelector('#caCreate');if(cr)cr.onclick=()=>{\n      const mode=caBody.getAttribute('data-mode');const msg=m.querySelector('#caMsg');\n      const ok=mode==='template'?!!m.querySelector('.catpl.sel'):caBody.getAttribute('data-generated')==='1';\n      if(!ok){if(msg){msg.style.color='var(--alert)';msg.textContent=mode==='describe'?'Describe your agent and click Generate first, or switch to Template.':'Select a template to continue.';}return;}\n      let name,purpose,cfg;\n      if(mode==='template'){const t=tplOf(caBody.getAttribute('data-tpl'));name=t.name;purpose=t.desc;cfg={system:t.system,yaml:caYaml(t)};}\n      else{name=caBody.getAttribute('data-genname')||'Untitled agent';purpose=caBody.getAttribute('data-gendesc')||'A new agent.';const t2=Object.assign({},CA_TEMPLATES[0],{name:name,desc:purpose});cfg={system:t2.system,yaml:caYaml(t2)};}\n      cr.disabled=true;cr.textContent=caBody.getAttribute('data-edit')?'Saving…':'Creating…';\n      const editId=caBody.getAttribute('data-edit');\n      setTimeout(()=>{\n        if(editId&&AGENTS[editId]){\n          AGENTS[editId].name=name;AGENTS[editId].purpose=purpose;AGENTS[editId].caCfg=cfg.yaml;AGENTS[editId].systemPrompt=cfg.system;\n          const ix=AGENTS_INDEX.find(x=>x.id===editId);if(ix){ix.name=name;ix.purpose=purpose;ix.updated='just now';}\n          closeOverlays();refreshGrid();openDetail(editId);\n        } else {\n          const id=createAgentRecord(name,purpose,cfg);closeOverlays();refreshGrid();openDetail(id);\n        }\n      },650);\n    };\n  }\n  m.querySelectorAll('[data-act=\"close\"]').forEach(b=>b.onclick=closeModal);\n  const as=m.querySelector('#authSave');if(as)as.onclick=()=>{const nm=(m.querySelector('#tplName').value||'new-template');m.querySelector('#authDone').innerHTML=`<div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">✓<\u002Fspan><div>Template <b>${nm}<\u002Fb> published to msa-gov. It is now a matchable option in Resolve.<\u002Fdiv><\u002Fdiv>`;as.disabled=true;as.textContent=\"Published\";};\n  const bcr=m.querySelector('#bareCreate');if(bcr)bcr.onclick=()=>{const nm=(m.querySelector('#bareName').value||'bare-env');m.querySelector('#bareDone').innerHTML=`<div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">✓<\u002Fspan><div>Bare environment <b>${nm}<\u002Fb> created in-Kingdom for template authoring. No agent attached; excluded from the developer path.<\u002Fdiv><\u002Fdiv>`;bcr.disabled=true;bcr.textContent=\"Created\";};\n  const rq=m.querySelector('#reqTpl');if(rq)rq.onclick=()=>{m.querySelector('#apprTl').innerHTML+=`<li><div class=\"tt\">Submitted to admin<\u002Fdiv><div class=\"td\">Pending approval in the admin queue.<\u002Fdiv><\u002Fli>`;rq.disabled=true;rq.textContent=\"Request submitted\";};\n  const ci=m.querySelector('#chatIn'),cs=m.querySelector('#chatSend');\n  if(ci&&cs){const log=m.querySelector('#chatLog');const a=AGENTS[log.getAttribute('data-aid')];\n    const send=()=>{const v=ci.value.trim();if(!v)return;ci.value='';const u=document.createElement('div');u.className='bub user';u.textContent=v;log.appendChild(u);log.scrollTop=log.scrollHeight;\n      const r=chatReply(a,v);setTimeout(()=>{const b=document.createElement('div');b.className='bub agent'+(r.guard?' guard':'');let h=(r.guard?'<span class=\"gtag\">⚠ Guardrail · non-compliant route flagged<\u002Fspan>':'')+esc(r.text);if(r.cite)h+='<span class=\"cite\">'+esc(r.cite)+'<\u002Fspan>';if(r.handoff)h+='<span class=\"cite\">↪ Routed to the '+a.officer+' queue — the agent does not make the final decision.<\u002Fspan>';b.innerHTML=h;log.appendChild(b);log.scrollTop=log.scrollHeight;},450);};\n    cs.onclick=send;ci.addEventListener('keydown',e=>{if(e.key==='Enter')send();});setTimeout(()=>{ci.focus();},60);}\n  const aq=m.querySelector('#acqBtn');if(aq)aq.onclick=()=>{const id=aq.getAttribute('data-id');state.acqu ished\",\"Needs attention\":\"Review-ready\",\"Suspended\":\"Deployed\"};\nconst STEPVERB={\"Draft\":\"Build, test & evaluate →\",\"Resolving\":\"Finish & evaluate →\",\"Provisioning\":\"Finish & evaluate →\",\"Deployed\":\"Run evaluation →\",\"In evaluation\":\"Mark review-ready →\",\"Review-ready\":\"Publish →\",\"Needs attention\":\"Retry & evaluate →\",\"Suspended\":\"Resume →\"};\nconst STEPNOTE={\"Review-ready\":\"Resolved, provisioned, tested and evaluated — ready to submit to the Marketplace.\",\"Published\":\"Certified by a domain champion. Now live in the Marketplace.\",\"Deployed\":\"Resumed. The agent is running again.\"};\nfunction advanceMock(id){const e=AGENTS_INDEX.find(x=>x.id===id);const prev=e.life;const nx=NEXT[prev];\n  if(!nx){cliEcho('out',id+' is already '+prev+(prev==='Published'?' — open it with:  market '+id:''));return;}\n  e.life=nx;\n  if(!e.trust && (nx==='In evaluation'||nx==='Review-ready'||nx==='Published')) e.trust=String(74+Math.floor(Math.random()*12));\n  let note; if(prev==='Suspended')note='Resumed. The agent is running again.'; else if(prev==='Needs attention')note='Reprovisioned, redeployed and re-evaluated — ready to submit.'; else note=STEPNOTE[nx]||('Advanced to '+nx+'.');\n  state.mini=e; if(typeof refreshGrid==='function')refreshGrid();\n  openDrawer(agentDrawer(id,'build'));\n  const n=$(\"#mNote\"); if(n){n.style.display='block';n.className='note gov';n.innerHTML='<span class=\"ni\">✓<\u002Fspan><div>'+note+'<\u002Fdiv>';}\n  cliEcho('out','↳ '+id+': '+prev+' → '+nx+(NEXT[nx]?'   ·   next:  next '+id:(nx==='Published'?'   ·   now live — try:  market '+id:'')));\n}\n\n/* ---------- ACQUIRED (consumer workspace) ---------- */\nfunction scrLibrary(){const ids=[...state.acquired];\n  if(!ids.length) return `<h2>Acquired agents<\u002Fh2><p class=\"lede\">Agents you acquire from the Marketplace run here, in your workspace (tenant ${USER.tenant} · ${USER.org}), in-Kingdom under your governance.<\u002Fp>\n    <div class=\"not >Acquire agent<\u002Fbutton>`;\n  return `<div class=\"dhd\"><div><h3>${e.name}<\u002Fh3><div class=\"small\">Marketplace listing · published · consume only<\u002Fdiv><\u002Fdiv><button class=\"dclose\" data-act=\"close\">✕<\u002Fbutton><\u002Fdiv>\n    <div class=\"dtabs\">${tabsHTML}<\u002Fdiv><div class=\"dbody\">${panels}<\u002Fdiv><div class=\"dfoot\">${acts}<\u002Fdiv>`;\n}\nfunction chatReply(a,msg){const m=(msg||'').toLowerCase();const num=(m.match(/\\d[\\d,]{2,}/)||[])[0];const big=num&&parseInt(num.replace(/,/g,''),10)>=100000;\n  if(a.id==='citizen'){\n    if(/qualif|eligib|benefit|support|subsid|grant/.test(m))return{text:\"Eligibility depends on household size and combined monthly income, checked against the approved benefit rules. If you share those two, I can check the threshold.\",cite:\"Family Support Benefit · income threshold table, clause 3.2 (policy-service)\"};\n    if(/document|papers|proof|letter|missing|need/.test(m))return{text:\"A complete application usually needs a recent proof of income and an employment-status letter. I can flag anything missing from your case record.\",cite:\"Required documents checklist (policy-service)\"};\n    if(/income|salary|depend|household|child|sar|\\d/.test(m))return{text:\"Thank you. At that household size and income you are likely within the eligibility threshold. The final amount needs officer judgment, so I won't decide it — I'll route a structured case summary to a human case officer.\",cite:\"Family Support Benefit · clause 3.2 (policy-service)\",handoff:true};\n    return{text:\"I can check benefit eligibility, list the documents you need, and route your case to an officer. What would you like to do?\"};\n  }\n  if(/direct|purchase|procure|buy|vendor/.test(m)&&(big||/new vendor/.test(m)))return{text:\"That route looks non-compliant: direct purchase is only permitted under 100,000 SAR. For this amount, or a new vendor, a competitive quotation process and vendor onboarding are required.\",cite:\"Procurement thresholds · clause 5.1 (policy-service)\",guard:true};\n  if(/budget|fund|code|afford/.test(m))return{text:\"Checking the department budget code… funds appear available for the compliant route. I can draft the request against it.\",cite:\"budget-api · code SOC-TRN-26\"};\n  if(/package|draft|prepare|approv|route|submit/.test(m))return{text:\"I've drafted the compliant package — request summary, justification, a 3-quote checklist and vendor onboarding — and routed it to a human procurement officer for approval.\",handoff:true};\n  if(/purchase|procure|buy|vendor|\\d/.test(m))return{text:\"Got it. I'll check the amount and vendor against policy thresholds and budget. What's the amount, and is the vendor already approved?\"};\n  return{text:\"Tell me the amount, vendor and scope, and I'll validate it against policy and budget, then prepare a compliant package.\"};\n}\nconst SESSIONS={};\nSESSIONS.citizen=[{sid:'sess-9u5m',tenant:'msa-gov'}];\nSESSIONS.procurement=[{sid:'sess-3k2p',tenant:'msa-gov'}];\nfunction agentSessions(id){return SESSIONS[id]||(SESSIONS[id]=[]);}\nfunction addSession(id,tenant){const s={sid:'sess-'+Math.random().toString(36).slice(2,6),tenant:tenant||'msa-gov'};agentSessions(id).unshift(s);return s;}\nfunction sessionRows(id){const list=agentSessions(id);return list.map(s=>`<div class=\"row sessrow\" style=\"align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)\">\n    <div><b style=\"font-family:monospace\">${s.sid}<\u002Fb> <span class=\"small\">· ${s.tenant} · Sovereign Runtime<\u002Fspan><\u002Fdiv>\n    <div class=\"row\" style=\"align-items:center;gap:12px\"><span class=\"small\">just now<\u002Fspan><button class=\"btn sm\" data-act=\"chat\" data-id=\"${id}\" data-tenant=\"${s.tenant}\">Open chat →<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>`).join(\"\");}\nfunction sessionsPanelHTML(id){const list=agentSessions(id);\n  if(!list.length)return `<div class=\"note info\"><span class=\"ni\">i<\u002Fspan><div>No sessions yet. Start a session to run this agent on synthetic data — transcripts and policy traces appear here.<\u002Fdiv><\u002Fdiv><button class=\"btn primary\" data-act=\"startsession\" data-id=\"${id}\" style=\"margin-top:12px\"><i data-lucide=\"server\"><\u002Fi> Select environment<\u002Fbutton>`;\n  return `<div class=\"card\" style=\"box-shadow:none\">\n      <div class=\"hd\"><h3>Sessions<\u002Fh3>${badge('teal',list.length+' run')}<\u002Fdiv>\n      <div class=\"bd\">${sessionRows(id)}\n        <div class=\"note gov\" style=\"margin-top:14px\"><span class=\"ni\">◆<\u002Fspan><div>Each session runs in the attached Sovereign Runtime environment, in-Kingdom, under inherited governance.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"btn primary\" data-act=\"startsession\" data-id=\"${id}\" style=\"margin-top:14px\"><i data-lucide=\"server\"><\u002Fi> New session · select environment<\u002Fbutton>`;}\nfunction refreshDrawerToSessions(id){openDrawer(agentDrawer(id,'build'));const d=$(\"#drawer\");const st=d.querySelector('.dtab[data-tab=\"sessions\"]');if(st)st.click();}\nfunction modalStartSession(id){const a=AGENTS[id];\n  const envs=[['msa-gov','KSA · Riyadh','Advance-python-sandbox v1.0.0 · 8 runtime blocks'],['moh-gov','KSA · Jeddah','basic-python-sandbox v1.0.0 · 6 runtime blocks']];\n  return `<div class=\"mhd\"><h3>Start session · ${a.name}<\u002Fh3><button class=\"dclose\" data-act=\"close\"><i data-lucide=\"x\"><\u002Fi><\u002Fbutton><\u002Fdiv><div class=\"mbd\" id=\"ssBody\" data-id=\"${id}\" data-env=\"msa-gov\">\n    <p class=\"small\" style=\"margin:0 0 14px\">Pick the environment to run this session in. The agent attaches to the environment <b>now<\u002Fb>, at session start — not when it was created. The environment is a Sovereign Runtime, set up once.<\u002Fp>\n    <div class=\"lbl\">Environment<\u002Fdiv>\n    <div style=\"margin-top:8px\">${envs.map((en,i)=>`<button class=\"ssenv${i===0?' sel':''}\" data-env=\"${en[0]}\"><div class=\"row\" style=\"align-items:center;gap:10px\"><span class=\"ssenv-nm\">${en[0]} · Sovereign Runtime<\u002Fspan> ${badge('teal','● Ready')}<\u002Fdiv><div class=\"ssenv-ds\">${en[1]} · ${en[2]}<\u002Fdiv><\u002Fbutton>`).join('')}<\u002Fdiv>\n    <div class=\"note gov\" style=\"margin-top:14px\"><span class=\"ni\">◆<\u002Fspan><div>Governance inherited from the environment: deny-all egress except approved in-Kingdom endpoints, PII redaction, KSA placement. Applied automatically — the developer chooses nothing here.<\u002Fdiv><\u002Fdiv>\n    <div class=\"dfoot\" style=\"padding:16px 0 0;border:none;background:none;justify-content:flex-end;gap:10px\"><button class=\"btn ghost\" data-act=\"close\">Cancel<\u002Fbutton><button class=\"btn primary\" id=\"ssStart\">Start session →<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>`;}\nfunction modalChat(id,tenant){const a=AGENTS[id];tenant=tenant||'msa-gov';\n  const greet=a.fresh?(\"Hello. I'm \"+a.name+\", running in \"+tenant+\" · Sovereign Runtime, in-Kingdom. \"+(a.purpose?(\"You are an agent that \"+a.purpose.charAt(0).toLowerCase()+a.purpose.slice(1)+\". \"):\"\")+\"How can I help?\"):(a.id==='citizen'?\"As-salāmu ʿalaykum. I'm the Citizen Support Agent. I can check benefit eligibility, the documents you need, and route your case to an officer. How can I help?\":\"Hello. I'm the Procurement Compliance Agent. Describe what you need to procure and I'll check policy and budget, then prepare a compliant package.\");\n  return `<div class=\"mhd\"><h3>Chat · ${a.name}<\u002Fh3><button class=\"dclose\" data-act=\"close\">✕<\u002Fbutton><\u002Fdiv><div class=\"mbd\">\n    <div class=\"row\" style=\"gap:6px;margin-bottom:10px\">${badge('gov','◆ running in-Kingdom')} ${badge('teal','✓ in your workspace')} ${badge('muted','synthetic data')}<\u002Fdiv>\n    <div class=\"chat\" id=\"chatLog\" data-aid=\"${id}\" style=\"max-height:46vh;overflow:auto;padding:2px\"><div class=\"bub agent\">${greet}<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"gap:8px;margin-top:12px;flex-wrap:nowrap\"><input id=\"chatIn\" class=\"fld\" style=\"flex:1\" placeholder=\"Type a message…\" autocomplete=\"off\"/><button class=\"btn primary\" id=\"chatSend\">Send<\u002Fbutton><\u002Fdiv>\n    <div class=\"note gov\" style=\"margin-top:10px\"><span class=\"ni\">◆<\u002Fspan><div>Policy-grounded, redacted, in-Kingdom. High-risk decisions route to a human, not the agent.<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n}\nfunction qsSlug(s){return (s||'agent').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'new-agent';}\nfunction qsName(d){d=(d||'').trim().replace(/^(an?|the|build|create|make|set\\s+up|i\\s+want\\s+to|i\\s+want|i\\s+need|provision)\\s+/i,'').trim();d=(d.split(/[.,\\n]/)[0]||'');if(!d)return 'New Agent';if(d.length>44)d=d.slice(0,44).trim();return d.charAt(0).toUpperCase()+d.slice(1);}\nfunction createQuickAgent(desc){const id='quickstart';const nm=qsName(desc);\n  AGENTS[id]=Object.assign({},AGENTS.citizen,{id:id,code:'QS',name:nm,purpose:(desc&&desc.length<70?desc:'Created with Quick Start'),manifest:AGENTS.citizen.manifest.map((m,i)=>i===0?['name',qsSlug(nm)]:m)});\n  var ix=AGENTS_INDEX.find(function(x){return x.id===id;});\n  var rec={id:id,code:'QS',name:nm,purpose:(desc&&desc.length<70?desc:'Created with Quick Start'),runtime:'python 3.11',life:'Draft',trust:'',tenant:'msa-gov',updated:'just now',full:true};\n  if(ix)Object.assign(ix,rec);else AGENTS_INDEX.unshift(rec);}\nconst QSNOTE={submit:'Submitting the agent package…',resolve:'Resolving — matched a sandbox template and assembling the Sovereign Runtime.',plan:'Here is the generated plan. Tweak the dropdowns if you like, or say “approve”.',deploy:'Provisioning the runtime in-Kingdom — applying the blocks.',runtime:'Runtime is live — all blocks READY.',test:'Running the evaluation suite on synthetic data.',evidence:'Evidence captured — Trust Score, audit trail, policy traces.',publish:'Submitted to the Marketplace. That is the full governed path. ✦'};\nfunction qsAppend(role,html){const log=$(\"#qsLog\");if(!log)return;const d=document.createElement('div');d.className='bub '+(role==='user'?'user':'agent');if(role==='user')d.textContent=html;else d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;}\nfunction qsSend(){const i=$(\"#qsIn\");if(!i)return;const v=i.value.trim();if(!v)return;i.value='';qsAppend('user',v);qsHandle(v);}\nfunction qsHandle(v){const t=v.toLowerCase();\n  const stepMap={submit:'submit',resolve:'resolve',plan:'plan',deploy:'deploy',provision:'deploy',runtime:'runtime',status:'runtime',test:'test',evaluat:'test',evidence:'evidence',publish:'publish'};\n  let target=null;for(const k in stepMap){if(t.indexOf(k)>=0){target=stepMap[k];break;}}\n  const advance=/\\b(continue|next|proceed|keep going|go on|yes|do it|approve|ship|onward)\\b/.test(t)||t==='go';\n  const inJourney=AGENTS['quickstart']&&state.agentId==='quickstart'&&STEPS.some(s=>s.id===state.screen);\n  const looksDescribe=v.split(/\\s+/).length>=4&&!advance&&!target;\n  if(!inJourney||looksDescribe){\n    const words=v.split(/\\s+/).filter(Boolean);\n    const looksGibberish=!/[aeiou]/i.test(v)||/^[^a-z]+$/i.test(v);\n    if(words.length<3||looksGibberish){\n      qsAppend('agent','I can scaffold an agent from a short description of what it should do. Try something like <b>“Summarizes new GitHub PRs and posts a digest to Slack”<\u002Fb> or <b>“Checks citizen benefit eligibility against policy”<\u002Fb> — tell me the task and I will generate a starting config.');\n      return;\n    }\n    createQuickAgent(v);\n    qsAppend('agent','Scaffolded <b>'+esc(qsSlug(qsName(v)))+'<\u002Fb> — python, governed, in-Kingdom. Submitting now; watch the main panel.');\n    startJourney('quickstart');\n    setTimeout(function(){if(typeof animateUpload==='function')animateUpload();},350);\n    setTimeout(function(){qsAppend('agent','Uploaded and validated against schema v1. Say <b>continue<\u002Fb> to resolve — or name a step: resolve, plan, deploy, test, publish.');},1700);\n    return;\n  }\n  let next; if(target)next=target; else {const i=stepIndex(state.screen);next=STEPS[Math.min(i+1,STEPS.length-1)].id;}\n  state.agentId='quickstart';go(next);\n  qsAppend('agent',QSNOTE[next]||('Moved to '+next+'.'));\n  if(next!=='publish')qsAppend('agent','Say <b>continue<\u002Fb> for the next step.');\n}\nfunction modalAcquire(id){const e=AGENTS_INDEX.find(x=>x.id===id);const owned=state.acquired.has(id);\n  return `<div class=\"mhd\"><h3>Acquire · ${e.name}<\u002Fh3><button class=\"dclose\" data-act=\"close\">✕<\u002Fbutton><\u002Fdiv><div class=\"mbd\">\n    <p class=\"small\">Add this published agent to your workspace. It runs on the Sovereign Runtime, in-Kingdom, under your tenant's governance. You consume it — you do not manage its build or versions.<\u002Fp>\n    <div class=\"kv\" style=\"margin-top:8px;grid-template-columns:150px 1fr\"><div class=\"k\">Acquiring as<\u002Fdiv><div class=\"v\">${USER.name} · ${USER.role}<\u002Fdiv><div class=\"k\">Into workspace<\u002Fdiv><div class=\"v\">tenant ${USER.tenant} · ${USER.org}<\u002Fdiv><div class=\"k\">Access scope<\u002Fdiv><div class=\"v\">Follows the agent's data classification<\u002Fdiv><div class=\"k\">Placement<\u002Fdiv><div class=\"v\">KSA · Riyadh ${badge('gov','sovereign')}<\u002Fdiv><div class=\"k\">Trust Score<\u002Fdiv><div class=\"v\">${e.trust?e.trust+' /100':'—'} ${badge('teal','evidenced')}<\u002Fdiv><\u002Fdiv>\n    <div id=\"acqDone\">${owned?'<div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">✓<\u002Fspan><div>Already in your workspace.<\u002Fdiv><\u002Fdiv>':''}<\u002Fdiv>\n    <div class=\"dfoot\" style=\"padding:14px 0 0;border:none;background:none\"><button class=\"btn ghost\" data-act=\"close\">Close<\u002Fbutton><button class=\"btn primary\" id=\"acqBtn\" data-id=\"${id}\" ${owned?'disabled':''}>${owned?'Acquired':'Confirm acquisition'}<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\n\nfunction scrEnv(){const tab=state.envTab||'environments';\n  const T=[['environments','Environments'],['templates','Templates'],['tenancy','Tenancy 🔒']];\n  const tabs=T.map(t=>`<div class=\"dtab ${t[0]===tab?'sel':''}\" data-envtab=\"${t[0]}\">${t[1]}<\u002Fdiv>`).join(\"\");\n  const body=tab==='templates'?scrTemplates():tab==='tenancy'?scrTenancy():scrEnvironments();\n  return `<h2>Environments<\u002Fh2><p class=\"lede\">An environment is a Sovereign Runtime — provisioned as code, in-Kingdom. You set it up <b>once<\u002Fb>. Agents attach to an environment when you start a session, not when you create them.<\u002Fp>\n    <div class=\"dtabs\" style=\"margin:14px 0 18px\">${tabs}<\u002Fdiv>${body}`;\n}\nfunction scrEnvironments(){\n  const rows=ENVIRONMENTS.map((en,i)=>`<div class=\"card envcard\"><div class=\"bd\">\n      <div class=\"row\" style=\"gap:12px;align-items:flex-start\">\n        <span class=\"env-ico\"><i data-lucide=\"server-cog\"><\u002Fi><\u002Fspan>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:15px;font-weight:700;color:var(--text)\">${en.name} · Sovereign Runtime<\u002Fdiv>\n          <div class=\"small\" style=\"margin-top:3px\">${en.desc}<\u002Fdiv>\n          <div class=\"row\" style=\"gap:7px;margin-top:12px;align-items:center;flex-wrap:wrap\">${badge('ready','● Ready')} ${badge('muted',en.region)} ${badge('teal',en.blocks+' runtime blocks')} ${badge('muted',en.agents+' agents attached')}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv><\u002Fdiv>`).join(\"\");\n  return `<div class=\"row\" style=\"justify-content:space-between;align-items:center;margin-bottom:14px\"><span class=\"small\">Set up once · reused by every agent in the tenant<\u002Fspan><button class=\"btn primary\" data-modal=\"setupenv\"><i data-lucide=\"plus\"><\u002Fi> Set up environment<\u002Fbutton><\u002Fdiv>\n    <div class=\"envgrid\">${rows}<\u002Fdiv>\n    <div class=\"note info\" style=\"margin-top:16px\"><span class=\"ni\">i<\u002Fspan><div>Environments are provisioned here, once. Agents never create a runtime during creation — they attach to one of these when a session starts.<\u002Fdiv><\u002Fdiv>`;\n}\nfunction scrInfra(){const tab=state.infraTab||'sandboxes';\n  const T=[['sandboxes','Sandboxes'],['templates','Templates'],['requests','My Requests'],['tenancy','Tenancy 🔒']];\n  const tabs=T.map(t=>`<div class=\"dtab ${t[0]===tab?'sel':''}\" data-infratab=\"${t[0]}\">${t[1]}<\u002Fdiv>`).join(\"\");\n  const body=tab==='templates'?scrTemplates():tab==='requests'?scrRequests():tab==='tenancy'?scrTenancy():scrSandboxes();\n  return `<h2>Infrastructure<\u002Fh2><p class=\"lede\">Runtimes, templates and requests — the platform layer behind your agents. Provisioned as code; bare environments are created only in Admin.<\u002Fp>\n  <div class=\"dtabs\" style=\"margin:6px 0 18px;padding:0 4px;border-radius:0\">${tabs}<\u002Fdiv>\n  <div id=\"infraBody\">${body}<\u002Fdiv>`;\n}\n\n/* ---------- ROUTER ---------- */\nconst RENDER={infra:scrInfra,env:scrEnv,agents:scrAgents,detail:scrDetail,mini:scrMini,submit:scrSubmit,resolve:scrResolve,plan:scrPlan,deploy:scrDeploy,runtime:scrRuntime,test:scrTest,evidence:scrEvidence,publish:scrPublish,market:scrMarket,listing:scrListing,scenario:scrScenario,templates:scrTemplates,sandboxes:scrSandboxes,requests:scrRequests,evals:scrEvals,data:scrData,tenancy:scrTenancy,exception:scrException,library:scrLibrary,infra:scrInfra};\nfunction go(screen){state.screen=screen;if(screen==='publish'){var pe=AGENTS_INDEX.find(function(x){return x.id===state.agentId;});if(pe)pe.life='Published';}$(\"#screen\").innerHTML=(RENDER[screen]||scrAgents)();$(\"#screen\").classList.toggle('agents-screen',screen==='agents');renderTop();renderStepper();renderNav();renderCLI();window.scrollTo({top:0});bindScreen();if(window.lucide)lucide.createIcons();if(document.getElementById('agCanvas'))setupCanvas();if(screen==='resolve')animateResolve();if(screen==='deploy')animateDeploy();}\nfunction ensureFullAgent(id){\n  const e=AGENTS_INDEX.find(x=>x.id===id);if(!e)return;\n  if(!AGENTS[id]){\n    const t2=Object.assign({},CA_TEMPLATES[0],{name:e.name,desc:e.purpose});\n    AGENTS[id]={id:id,name:e.name,purpose:e.purpose,tenant:\"Ministry of Social Affairs · tenant: \"+(e.tenant||'msa-gov'),officer:\"case officer\",runtime:e.runtime||\"python 3.11\",model:\"claude-sonnet-4-6\",systemPrompt:\"You are \"+e.name+\".\",caCfg:caYaml(t2),fresh:true};\n  }\n  e.full=true;\n}\nfunction openDetail(id){state.agentId=id;var a=AGENTS[id];var tl=$(\"#tenantline\");if(tl&&a)tl.textContent=a.tenant;openDrawer(agentDrawer(id,'build'));cliEcho('out','↳ open '+id+' (owner)');}\nfunction openMini(id){state.agentId=id;openDrawer(agentDrawer(id,'build'));cliEcho('out','↳ open '+id);}\nfunction startJourney(id){state.agentId=id;var tl=$(\"#tenantline\");if(tl)tl.textContent=AGENTS[id].tenant;go('submit');}\nfunction listAgent(id){if(AGENTS[id])state.agentId=id;openDrawer(marketDrawer(id));cliEcho('out','↳ marketplace · '+id+' (consumer)');}\nfunction bindScreen(){\n  document.querySelectorAll('[data-go]').forEach(el=>{if(el.closest('#nav'))return;el.addEventListener('click',()=>go(el.getAttribute('data-go')));});\n  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openDetail(el.getAttribute('data-open'))));\n  document.querySelectorAll('.hagent[data-id]').forEach(el=>el.addEventListener('click',()=>{el.getAttribute('data-kind')==='open'?openDetail(el.getAttribute('data-id')):openMini(el.getAttribute('data-id'));}));\n  document.querySelectorAll('[data-journey]').forEach(el=>el.addEventListener('click',()=>startJourney(el.getAttribute('data-journey'))));\n  document.querySelectorAll('[data-list]').forEach(el=>el.addEventListener('click',()=>listAgent(el.getAttribute('data-list'))));\n  document.querySelectorAll('[data-run]').forEach(el=>el.addEventListener('click',()=>openModal(modalChat(el.getAttribute('data-run')))));\n  const ub=$(\"#upBtn\");if(ub)ub.addEventListener('click',e=>{e.stopPropagation();animateUpload();});\n  const uz=$(\"#upZone\");if(uz)uz.addEventListener('click',()=>animateUpload());\n  document.querySelectorAll('[data-mmode]').forEach(el=>el.addEventListener('click',()=>{const m=el.getAttribute('data-mmode');document.querySelectorAll('[data-mmode]').forEach(t=>t.classList.toggle('sel',t===el));const up=$(\"#mUpload\"),ed=$(\"#mEdit\");if(up)up.classList.toggle('hidden',m!=='upload');if(ed)ed.classList.toggle('hidden',m!=='edit');}));\n  const dx=$(\"#dlExample\");if(dx)dx.addEventListener('click',()=>downloadText('agent.example.yaml',EXAMPLE_YAML));\n  const dx2=$(\"#dlExample2\");if(dx2)dx2.addEventListener('click',()=>downloadText((A().manifest[0][1]||'agent')+'.yaml',($(\"#yamlEdit\")?$(\"#yamlEdit\").value:EXAMPLE_YAML)));\n  const uy=$(\"#useYaml\");if(uy)uy.addEventListener('click',useEditedYaml);\n  document.querySelectorAll('[data-mini]').forEach(el=>el.addEventListener('click',()=>openMini(el.getAttribute('data-mini'))));\n  const fDb=$(\"#fDropBtn\"),fMenu=$(\"#fMenu\");\n  if(fDb&&fMenu){fDb.addEventListener('click',function(e){e.stopPropagation();fMenu.hidden=!fMenu.hidden;});\n    document.addEventListener('click',function(){if(fMenu)fMenu.hidden=true;});\n    fMenu.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',function(){state.filter.status=b.getAttribute('data-status');var lb=$(\"#fDropLabel\");if(lb)lb.textContent=(state.filter.status==='All'?'All statuses':state.filter.status);fMenu.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('on',x===b));fMenu.hidden=true;refreshGrid();}));}\n  const fQ=$(\"#fq\");if(fQ)fQ.addEventListener('input',()=>{state.filter.q=fQ.value;refreshGrid();});\n  document.querySelectorAll('[data-modal]').forEach(el=>el.addEventListener('click',()=>openNamedModal(el.getAttribute('data-modal'))));\n  document.querySelectorAll('[data-sbx]').forEach(el=>el.addEventListener('click',()=>openSandboxDrawer(el.getAttribute('data-sbx'))));\n  document.querySelectorAll('[data-infratab]').forEach(el=>el.addEventListener('click',()=>{state.infraTab=el.getAttribute('data-infratab');go('infra');}));\n  document.querySelectorAll('[data-envtab]').forEach(el=>el.addEventListener('click',()=>{state.envTab=el.getAttribute('data-envtab');go('env');}));\n  const pm=$(\"#planMore\");if(pm)pm.addEventListener('click',()=>{const d=$(\"#planDetails\");if(d){const hidden=d.classList.toggle('hidden');pm.textContent=hidden?'Show details':'Hide details';}});\n  document.querySelectorAll('[data-eval]').forEach(el=>el.addEventListener('click',()=>openEvalDrawer(el.getAttribute('data-eval'))));\n  document.querySelectorAll('[data-roll]').forEach(el=>el.addEventListener('click',()=>{const n=$(\"#rollNote\");if(n){n.className=\"note gov\";n.innerHTML=`<span class=\"ni\">✓<\u002Fspan><div>Rolled back to ${el.getAttribute('data-roll')} in one action. A new deployment record was written with actor and time.<\u002Fdiv>`;}}));\n  document.querySelectorAll('[data-redeploy]').forEach(el=>el.addEventListener('click',()=>{const n=$(\"#rollNote\");if(n){n.className=\"note gov\";n.innerHTML=`<span class=\"ni\">✓<\u002Fspan><div>Redeployed ${el.getAttribute('data-redeploy')}. Sovereign Runtime re-assembled, image rebuilt, new deployment record stamped.<\u002Fdiv>`;}}));\n  const rt=$(\"#reqTpl\");if(rt)rt.addEventListener('click',()=>{const tl=$(\"#apprTl\");tl.innerHTML+=`<li><div class=\"tt\">Submitted to admin<\u002Fdiv><div class=\"td\">Status: pending approval in the admin queue.<\u002Fdiv><\u002Fli>`;rt.disabled=true;rt.textContent=\"Request submitted\";});\n  const re=$(\"#runEval\");if(re)re.addEventListener('click',()=>{const o=$(\"#evalOut\");o.className=\"note gov\";o.innerHTML=`<span class=\"ni\">✓<\u002Fspan><div>Suite complete on synthetic data. Trust Score ${A().trustScore}, correctness ${A().correctness}, safety pass, access-control pass. Attached to v1.4 as evidence. (Prism if available, otherwise mock — same evidence shape.)<\u002Fdiv>`;re.disabled=true;re.textContent=\"Evaluation complete\";});\n  const rx=$(\"#reqExt\");if(rx)rx.addEventListener('click',()=>{const o=$(\"#extNote\");if(o){o.innerHTML=`<div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">✓<\u002Fspan><div>Extension request submitted to the tenant admin. Track it under My Requests.<\u002Fdiv><\u002Fdiv>`;}rx.disabled=true;});\n  const at=$(\"#authTpl\");if(at)at.addEventListener('click',()=>{$(\"#authForm\").classList.toggle('hidden');});\n  const ac=$(\"#authCancel\");if(ac)ac.addEventListener('click',()=>$(\"#authForm\").classList.add('hidden'));\n  const as=$(\"#authSave\");if(as)as.addEventListener('click',()=>{const nm=($(\"#tplName\").value||'new-template');const d=$(\"#authDone\");d.innerHTML=`<div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">✓<\u002Fspan><div>Template <b>${nm}<\u002Fb> published to tenant msa-gov. It is now a matchable option in Resolve, assembling the Sovereign Runtime from the chosen blocks.<\u002Fdiv><\u002Fdiv>`;as.disabled=true;as.textContent=\"Published\";});\n  const bb=$(\"#bareBtn\");if(bb)bb.addEventListener('click',()=>{$(\"#bareForm\").classList.toggle('hidden');});\n  const bc=$(\"#bareCancel\");if(bc)bc.addEventListener('click',()=>$(\"#bareForm\").classList.add('hidden'));\n  const bcr=$(\"#bareCreate\");if(bcr)bcr.addEventListener('click',()=>{const nm=($(\"#bareName\").value||'bare-env');const d=$(\"#bareDone\");d.innerHTML=`<div class=\"note gov\" style=\"margin-top:12px\"><span class=\"ni\">✓<\u002Fspan><div>Bare environment <b>${nm}<\u002Fb> created in-Kingdom for template authoring. It carries no agent and is excluded from the developer path.<\u002Fdiv><\u002Fdiv>`;bcr.disabled=true;bcr.textContent=\"Created\";});\n}\ndocument.querySelectorAll('#nav a').forEach(a=>a.addEventListener('click',()=>go(a.getAttribute('data-go'))));\n(function(){var tc=$(\"#themeCycle\");\n  function setLbl(){var dark=document.body.getAttribute('data-theme')==='dark';var l=tc&&tc.querySelector('.navlbl');if(l)l.textContent=dark?'Dark':'Light';var ic=tc&&tc.querySelector('i');if(ic){ic.setAttribute('data-lucide',dark?'moon':'sun');if(window.lucide)lucide.createIcons();}}\n  if(tc)tc.addEventListener('click',function(){var dark=document.body.getAttribute('data-theme')==='dark';var nx=dark?'light':'dark';if(nx==='light')document.body.removeAttribute('data-theme');else document.body.setAttribute('data-theme','dark');try{localStorage.setItem('h1-theme',nx);}catch(e){}setLbl();});\n  try{var sv=localStorage.getItem('h1-theme');if(sv==='dark')document.body.setAttribute('data-theme','dark');else document.body.removeAttribute('data-theme');}catch(e){}\n  setLbl();\n  var qg=$(\"#qsGo\"),qi=$(\"#qsIn\");\n  if(qg)qg.addEventListener('click',qsSend);\n  if(qi)qi.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();qsSend();}});})();\n(function(){var wd=$(\"#wsDivider\"),ws=$(\"#workspace\");if(!wd||!ws)return;\n  try{var sv=sessionStorage.getItem('h1-qsw');if(sv)ws.style.setProperty('--qs-w',sv);}catch(e){}\n  var dragging=false;\n  wd.addEventListener('pointerdown',function(e){dragging=true;wd.classList.add('dragging');wd.setPointerCapture(e.pointerId);e.preventDefault();});\n  wd.addEventListener('pointermove',function(e){if(!dragging)return;var r=ws.getBoundingClientRect();var w=Math.max(240,Math.min(640,e.clientX-r.left));ws.style.setProperty('--qs-w',w+'px');});\n  wd.addEventListener('pointerup',function(e){if(!dragging)return;dragging=false;wd.classList.remove('dragging');try{sessionStorage.setItem('h1-qsw',getComputedStyle(ws).getPropertyValue('--qs-w').trim());}catch(e){}});})();\n$(\"#scrim\").addEventListener('click',closeModal);\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'&&$(\"#modal\").classList.contains('open'))closeModal();});\ngo('agents');\nif(window.lucide)lucide.createIcons();\n(function(){\n  function doLogin(){var ls=document.getElementById('loginScreen');if(ls)ls.classList.add('hidden');go('agents');}\n  function doLogout(){var ls=document.getElementById('loginScreen');if(ls)ls.classList.remove('hidden');closeOverlays&&closeOverlays();if(window.lucide)lucide.createIcons();}\n  var lf=document.getElementById('loginForm');if(lf)lf.addEventListener('submit',function(e){e.preventDefault();doLogin();});\n  var sso=document.getElementById('loginSso');if(sso)sso.addEventListener('click',doLogin);\n  var lo=document.getElementById('logoutBtn');if(lo)lo.addEventListener('click',doLogout);\n})();\n(function(){var nt=document.getElementById('navToggle'),app=document.getElementById('app');if(nt&&app){nt.addEventListener('click',function(){app.classList.toggle('collapsed');var c=app.classList.contains('collapsed');document.body.classList.toggle('nav-collapsed',c);try{localStorage.setItem('h1-collapsed',c?'1':'0');}catch(e){}});try{if(localStorage.getItem('h1-collapsed')==='1'){app.classList.add('collapsed');document.body.classList.add('nav-collapsed');}}catch(e){}}})();\n<\u002Fscript>\n<script>(function(){document.addEventListener('contextmenu',function(e){e.preventDefault();});document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if(e.key==='F12'||((e.ctrlKey||e.metaKey)&&k==='u')||((e.ctrlKey||e.metaKey)&&k==='s')||((e.ctrlKey||e.metaKey)&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))){e.preventDefault();return false;}});})();<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
