<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent lifecycle — interactive master flow</title>
<style>
 *{box-sizing:border-box}
 html,body{margin:0;padding:0;background:#FAFAF8}
 body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:#16181D;-webkit-font-smoothing:antialiased}
 .top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid #E4E4DE;background:#fff;position:sticky;top:0;z-index:20}
 .top b{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
 .hint{font-size:12.5px;color:#5B6270}
 .hint kbd{font:600 11px ui-monospace,Menlo,monospace;background:#F1F1EC;border:1px solid #E4E4DE;border-radius:4px;padding:1px 5px}
 .spacer{flex:1}
 .btn{border:1px solid #D8DBE0;background:#fff;border-radius:7px;padding:6px 12px;font:600 12.5px inherit;color:#16181D;cursor:pointer}
 .btn:hover{background:#FAFAF8}

 .frame{padding:22px;display:flex;gap:18px;align-items:flex-start}
 .board{flex:1;min-width:0;background:#fff;border:1px solid #E4E4DE;border-radius:8px;padding:20px;overflow-x:auto}
 svg{display:block;width:100%;min-width:1180px;height:auto}

 .step{cursor:pointer}
 .step>rect:first-of-type{transition:filter .12s}
 .step:hover>rect:first-of-type{filter:brightness(.975)}
 .step:hover>rect:first-of-type,.step:focus>rect:first-of-type{stroke-width:2}
 .step:focus{outline:none}
 .step.sel>rect:first-of-type{stroke:#0F6E63;stroke-width:2.4}
 svg.picking .step:not(.sel){opacity:.42;transition:opacity .15s}

 .panel{width:392px;flex:0 0 392px;background:#fff;border:1px solid #E4E4DE;border-radius:8px;
        position:sticky;top:82px;max-height:calc(100vh - 104px);overflow-y:auto;display:none}
 .panel.on{display:block}
 .ph{padding:16px 18px 12px;border-bottom:1px solid #EFEFEA;position:sticky;top:0;background:#fff;z-index:2}
 .ph .row1{display:flex;align-items:center;gap:9px;margin-bottom:7px}
 .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11.5px inherit;color:#fff;flex:0 0 24px}
 .lane{font:700 9.5px inherit;letter-spacing:.1em;text-transform:uppercase}
 .ph h2{font-size:17px;line-height:1.25;letter-spacing:-.018em;margin:0}
 .node{display:inline-block;font:600 10px ui-monospace,Menlo,monospace;background:#F1F1EC;color:#6B7280;border-radius:4px;padding:2px 7px;margin-top:7px}
 .close{margin-left:auto;border:0;background:none;font-size:19px;color:#8A8F98;cursor:pointer;line-height:1;padding:0 2px}
 .pb{padding:14px 18px 20px}
 .what{font-size:14px;line-height:1.6;color:#31353E;margin:0 0 16px}
 .sec{margin-bottom:15px}
 .sec .lbl{font:700 9.5px inherit;letter-spacing:.11em;text-transform:uppercase;color:#8A8F98;margin-bottom:6px}
 .sec ul{margin:0;padding-left:16px}
 .sec li{font-size:13px;line-height:1.55;color:#31353E;margin:3px 0}
 .who{border-top:1px solid #EFEFEA;padding:8px 0 0;margin-top:6px}
 .who:first-of-type{border-top:0;padding-top:0;margin-top:0}
 .who b{display:block;font-size:12.5px;font-weight:650}
 .who span{font-size:12.5px;color:#5B6270;line-height:1.5}
 .fail{background:#FBEDED;border:1px solid #EFD3D3;border-radius:6px;padding:11px 13px;font-size:12.5px;line-height:1.55;color:#3A3F49}
 .fail .lbl{color:#8A2F2F}
 .open{background:#E9F4F2;border:1px solid #BFE0DA;border-radius:6px;padding:11px 13px;font-size:12.5px;line-height:1.55;color:#3A3F49;margin-top:12px}
 .open .lbl{color:#0F6E63}
 .nav{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid #EFEFEA}
 .nav .btn{flex:1;text-align:center}
 .empty{padding:44px 22px;text-align:center;color:#8A8F98;font-size:13.5px;line-height:1.6}

 .s-col{font:700 9.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;letter-spacing:.1em}
 .s-lane{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;letter-spacing:.06em}
 .s-lane2{font:500 9.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
 .s-blkb{font:700 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
 .s-tiny{font:500 8.6px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
 .s-num{font:700 9px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
 .s-node{font:600 8.4px ui-monospace,SFMono-Regular,Menlo,monospace}

 @media (max-width:1180px){
   .frame{flex-direction:column}
   .panel{width:100%;flex:none;position:static;max-height:none}
 }
 @media print{
   .top,.panel,.nav{display:none}
   body{background:#fff}.frame{padding:0;display:block}
   .board{border:0;padding:0;overflow:visible}
   svg{min-width:0}
   @page{size:A3 landscape;margin:10mm}
 }
</style>
</head>

<script>
const DETAIL = {"1": {"t": "Create the tenant", "lane": "HUMAIN", "node": "", "w": "HUMAIN provisions a new enterprise tenant. One Keycloak realm, one cost ledger, one quota envelope, placement fixed in-Kingdom. Nothing else in this diagram can begin until this exists.", "i": ["Executed commercial agreement", "Tenant name and region"], "o": ["Tenant id", "Keycloak realm scoped to the tenant", "Cost ledger", "Empty quota envelope"], "s": ["Keycloak realm creation (identity layer spec v1.0)", "Substrate tenant registry"], "p": [["Tenant admin", "Does not exist yet — their login is issued at step 4"], ["Developer", "No workspace to build in until the tenant admin configures one"]], "f": "No tenant, nothing downstream starts. Not a runtime failure mode — a prerequisite.", "x": ""}, "2": {"t": "Set platform ceilings", "lane": "HUMAIN", "node": "", "w": "HUMAIN sets the maximum the tenant may ever allocate: sandboxes, compute, storage and evaluation runs per day. The tenant admin allocates inside these and can never exceed them.", "i": ["Commercial tier"], "o": ["Ceiling values on the tenant record"], "s": ["Substrate quota service, enforced at provisioning time"], "p": [["Tenant admin", "Allocates within the ceiling; raising it is a request back to HUMAIN"], ["Developer", "Hits the ceiling at provision time, not at submit time"]], "f": "A ceiling set too low parks agents at provisioning. The tenant admin raises a ceiling request; the agent resumes when granted.", "x": ""}, "3": {"t": "Attach the policy baseline", "lane": "HUMAIN", "node": "", "w": "Eight mandatory checks, the 50% pass-bar floor, and whether this tenant requires Guardian review for internal publishing. Attached at creation and inherited by the tenant as read-only.", "i": ["HUMAIN platform policy version"], "o": ["Set A baseline attached to the tenant", "50% floor", "Per-tenant Guardian rule"], "s": ["Policy service, versioned"], "p": [["Verifier", "Runs these as Set A on every submission; a Set A failure can never be waived as a condition"], ["Tenant admin", "Sees them read-only, attributed to HUMAIN; may add but never remove"], ["Developer", "These are the checks that must pass regardless of what their tenant adds"]], "f": "If the platform policy version advances, already-published agents may need re-certification. That trigger is not designed yet.", "x": "Open: does a policy version bump force re-certification of live agents?"}, "4": {"t": "Issue the first admin login", "lane": "HUMAIN", "node": "", "w": "The only role grant the tenant does not make for itself. Everything the tenant admin later configures depends on this one account existing.", "i": ["Named person at the tenant"], "o": ["Keycloak user carrying the tenant-admin role"], "s": ["Keycloak; roles arrive in realm_access.roles on the access token"], "p": [["Tenant admin", "Becomes able to act"], ["Verifier / developer", "Cannot be created until this account exists"]], "f": "Without it the tenant is provisioned but unusable.", "x": ""}, "5": {"t": "Create logins and role grants", "lane": "TENANT ADMIN", "node": "", "w": "The tenant admin creates developer, verifier and co-admin logins. The grants are separable; the admin holds every verifier action as well, and the audit records which role a person acted under.", "i": ["Names and work emails", "Role choice per person"], "o": ["Keycloak users with role grants scoped to this tenant"], "s": ["Keycloak; coarse authorization from realm roles, fine-grained in the control plane"], "p": [["Verifier", "Comes into existence here. If nobody is named, the queue has no owner"], ["Developer", "Gains the ability to build and submit, and nothing else"]], "f": "An unnamed verifier is the most likely real-world failure: submissions accumulate at cert_pending with nobody to resolve them, and in practice the role quietly reverts to the developer — which is exactly the separation this design exists to prevent.", "x": "Needed before Phase-1 launch: who is the named verifier for our own tenant?"}, "6": {"t": "Set the pass bar and SLA", "lane": "TENANT ADMIN", "node": "", "w": "The tenant quality threshold — at or above the 50% platform floor — and the turnaround target for verification decisions.", "i": ["Tenant risk appetite"], "o": ["Pass bar percentage", "SLA in business days"], "s": ["Tenant policy record; applies to new submissions only"], "p": [["Developer", "Sees the bar on the Evaluate step; crossing it is what makes a version eligible"], ["Verifier", "Queue rows age against the SLA and flag amber once past it"]], "f": "Changing the bar does not re-open closed records or un-publish live versions. Raising it mid-flight only affects the next submission.", "x": ""}, "7": {"t": "Add checks and approve templates", "lane": "TENANT ADMIN", "node": "", "w": "Tenant-specific checks layered on top of the locked baseline, plus the sandbox templates that agents are matched against during Resolve. Developers never build infrastructure — they request a template and the tenant admin publishes it.", "i": ["Sector and compliance requirements", "Template requests raised by developers"], "o": ["Set B checks, marked required or advisory", "Published templates, matchable in Resolve"], "s": ["Tenant policy record", "Template catalogue"], "p": [["Developer", "An agent that matches no template parks at Resolve until this queue is worked"], ["Verifier", "Runs Set B alongside Set A on every submission, internal or public"]], "f": "An unworked template request leaves an agent parked indefinitely. The console shows what is parked on each request for exactly this reason.", "x": "Phase 2: tenant policy and compliance documents with a RAG pre-check the verifier interprets."}, "8": {"t": "Author agent.yaml", "lane": "DEVELOPER", "node": "submit", "w": "The developer submits one thing: the manifest. The manifest is the agent — runtime, services, data, policy, and a source field saying where the code lives. There is no separate package upload.", "i": ["Agent design", "Repository and branch, or a code archive"], "o": ["agent.yaml validated against manifest schema v1", "draft_submissions row persisted before the substrate call"], "s": ["POST /v1/graphs/devflow/runs with an Idempotency-Key", "Code archive passed by reference as a short-lived signed URL, never by value"], "p": [["Verifier", "Everything they later check derives from what is declared here — egress allowlist, tools, access scope"], ["Tenant admin", "The declared runtime determines whether an approved template matches"]], "f": "Schema validation fails before anything runs. The durability boundary means a substrate timeout leaves a recoverable draft rather than a lost submission.", "x": ""}, "9": {"t": "Resolve and provision", "lane": "DEVELOPER", "node": "lint · static-scan · build", "w": "The platform matches an approved template, assembles the Sovereign Runtime as code, then lints, scans and builds the image. No infrastructure choices are asked of the developer.", "i": ["Validated manifest"], "o": ["Matched template", "Provisioned runtime blocks", "Built image with a pinned digest"], "s": ["Three DevFlow nodes running inside the substrate", "Runtime assembled from Terraform-style modules"], "p": [["Tenant admin", "Their template catalogue decides whether a match exists at all"], ["Verifier", "The scan output becomes evidence they read later"]], "f": "Two real failures: no template match, which parks the agent and raises a request to the tenant admin; and image build or pull failure, which returns the developer to the manifest.", "x": ""}, "10": {"t": "Deploy and test in the sandbox", "lane": "DEVELOPER", "node": "sandbox-eval", "w": "The agent is deployed into an isolated sandbox and exercised against synthetic data. No production data at any point. This is the developer checking behaviour, not a consumer using the service.", "i": ["Built image", "Synthetic dataset"], "o": ["Sandbox job results", "Runtime traces, redaction records, observed egress"], "s": ["Turing's Sandbox Adapter translates the manifest into a jobspec, then POST /v1/sandbox/jobs", "HMAC-signed callback on completion — the sole documented inbound exception to the one-way boundary"], "p": [["Verifier", "The traces produced here are the evidence they read: which endpoints were actually called, what was redacted"], ["Tenant admin", "Consumes sandbox quota from the tenant allocation"]], "f": "Sandbox provisioning failure, or a job that never calls back. Idempotency is keyed on the manifest hash so retries do not provision a second microVM.", "x": "Phase 2: verifier-run security probing inside the live sandbox."}, "11": {"t": "Run the quality evaluation", "lane": "DEVELOPER", "node": "quality-eval", "w": "The developer's own evaluation set is scored and compared against the tenant pass bar. This is the developer's territory — they iterate here freely, with no approvals.", "i": ["Evaluation dataset and suite version"], "o": ["Score, per-metric results, report reference", "Version-against-version comparison"], "s": ["Eval handoff to the evaluator, returning decision plus score and a report URI"], "p": [["Tenant admin", "Owns the bar this is measured against"], ["Verifier", "Reads the result but does not run it; a low score simply never reaches them"]], "f": "Below the bar the developer keeps iterating and nothing enters the queue. That is the intended behaviour, not an error.", "x": "The eval-node handoff field names are still marked PROPOSED in the v0.3.1 addendum — HUMAIN is waiting on us to confirm them."}, "12": {"t": "Choose destination and submit", "lane": "DEVELOPER", "node": "", "w": "The developer chooses the internal workspace or the public marketplace, and submits. This is a declaration of intent — the verifier still decides — but the choice determines whether Guardian is in the path at all.", "i": ["A version at or above the bar", "Listing draft: title, description, category, support contact"], "o": ["Submission carrying the target", "Evidence bundle sealed — eight artifacts, immutable from here"], "s": ["BFF write; the bundle cannot change during review"], "p": [["Verifier", "Receives exactly what the developer previewed — the sealing is what makes 'no surprises' structural"], ["Guardian", "Enters the path only if the target is public"]], "f": "A submission with an incomplete bundle is blocked at the pre-submit gates rather than reaching the queue.", "x": ""}, "13": {"t": "The record opens by itself", "lane": "VERIFIER", "node": "cert_pending", "w": "The DevFlow graph reaches human-cert and pauses. A verification record opens in the verifier's queue automatically — there is no approval step between the evaluation passing and the queue.", "i": ["Submission and sealed bundle"], "o": ["Verification record id", "Run status stays running, with current_node set to cert_pending"], "s": ["Substrate emits events; the BFF projects them into a local review queue", "The projection is rebuildable — the substrate Agent Registry stays canonical"], "p": [["Tenant admin", "Queue depth and SLA ageing become visible as workload"], ["Developer", "Sees the state change and who holds it, but has no controls"]], "f": "If the projection falls behind, the queue is stale but recoverable by replaying substrate events. The decision itself is never taken against the projection alone.", "x": ""}, "14": {"t": "Automated checks resolve", "lane": "VERIFIER", "node": "", "w": "Fourteen automated checks across Set A and Set B resolve the moment the record opens. The verifier arrives to a record that has already done its own arithmetic.", "i": ["Evidence bundle, scan reports, runtime traces"], "o": ["Per-sub-check result, the bar it was measured against, and an evidence reference"], "s": ["Scanners and suites; stubbed in the current mockups, with the UI complete"], "p": [["Developer", "Anything failing here becomes a finding they receive with a re-run path"], ["HUMAIN", "Set A results are the platform's assurance, not the tenant's"]], "f": "A failing Set A check cannot be waived as a condition — it blocks. A failing Set B check can be waived only if the tenant admin has enabled conditional approval.", "x": "Matches the SteerCo principle: automation first, humans for novel or ambiguous cases only."}, "15": {"t": "Safety suite and human review", "lane": "VERIFIER", "node": "safety-eval", "w": "The verifier-owned safety regression suite runs, and the verifier performs the three reviews that cannot be automated: human handoff on irreversible actions, capability against listing claims, and refusal behaviour.", "i": ["Safety suite version", "Evaluation transcripts", "Listing diff against the last verified version"], "o": ["Recorded review notes", "Suite version stamped onto the record"], "s": ["safety-eval node"], "p": [["Developer", "Read-only — they see that it ran and what it found, never the suite's contents"], ["HUMAIN", "Guardian audits independently later; this does not substitute for that"]], "f": "Stamping the suite version is what makes re-certification answerable later: if the suite advances, we know which agents were verified against an older one.", "x": "Open: does Guardian eventually own this suite? If so this becomes an integration rather than a build."}, "16": {"t": "Decide — four outcomes", "lane": "VERIFIER", "node": "human-cert", "w": "The verifier decides: approve, approve with conditions, request changes, or reject. Approval requires every check resolved; rejection is available at any point, because an obviously unsafe submission should not need a full pass first.", "i": ["Everything above, plus the verifier's own review notes"], "o": ["Decision written to the record", "Findings, each with the failing check, evidence and a re-run path", "Audit entry naming actor, role, time and outcome"], "s": ["A saga of two idempotent writes: the decision resumes the paused human-cert node, then the audit record is written", "A broadcast keeps concurrent reviewers consistent; duplicate decisions are idempotent"], "p": [["Developer", "Receives findings that are specific and re-testable, and resubmits as a new version"], ["Guardian", "Only reached if the decision is approve and the target is public"], ["Tenant admin", "Holds this same authority; the audit records which role acted"]], "f": "A crash between the two writes leaves a recoverable state — the missing write is retried with the same key. Two reviewers deciding at once is a designed-for race, not an edge case.", "x": ""}, "17": {"t": "Publish internally", "lane": "VERIFIER", "node": "publish", "w": "On approval the internal listing goes live in the tenant workspace immediately. For a public-marketplace submission this still happens — the internal listing serves while Guardian works.", "i": ["Approval decision"], "o": ["Published internal version", "Previous version retained for rollback"], "s": ["DevFlow publish node"], "p": [["Developer", "Sees a state change, not a button — they never publish internally"], ["Consumers in the tenant", "Can now use the agent"]], "f": "Rollback is a version pin, not a rebuild. The previous version keeps serving until the new one is live.", "x": ""}, "18": {"t": "Send to Guardian", "lane": "VERIFIER", "node": "", "w": "For a public-marketplace target the evidence package goes to Guardian. This is mandatory, set by HUMAIN, and cannot be switched off by the tenant admin or the verifier.", "i": ["Approved record and its evidence"], "o": ["Guardian thread id and cycle id, persisted against the agent"], "s": ["POST /audits with an Idempotency-Key; poll every 30–60 seconds", "Persist the thread id per agent so re-audits continue the same thread"], "p": [["Developer", "Nothing required of them yet; the internal listing is already serving"], ["HUMAIN", "Guardian is a separate team, reached through the API, on its own timeline"]], "f": "Rate limits are real: three concurrent audits per key, twenty launches an hour. A queue of public submissions has to respect them.", "x": "Launching at approval rather than at decision-time means the verdict is usually ready when the verifier next looks."}, "19": {"t": "Independent audit", "lane": "GUARDIAN", "node": "", "w": "Guardian audits the source independently of anything we ran. It is a real audit thread with a cycle inside it, so re-audits after a fix compound rather than starting over.", "i": ["Code archive or connected repository", "Optionally a running app endpoint for live probing"], "o": ["Findings with severity, confidence band, evidence references and reproduction steps"], "s": ["embedded_audit.v1 — a frozen contract", "Typically around thirty minutes; progress is honest stage labels, never percentages"], "p": [["Verifier", "Holds the thread; the poll and the forwarding are theirs"], ["Developer", "Receives the findings only through the verifier, never directly"]], "f": "Failures are classed recoverable or terminal. Trust labels distinguish what Guardian verified itself from what we claimed — worth surfacing to the verifier rather than flattening.", "x": ""}, "20": {"t": "Findings and a verdict band", "lane": "GUARDIAN", "node": "", "w": "Guardian returns findings, a band of ready, needs work or hold, one recommended action and a plain-language ship opinion. It deliberately never returns a pass or a fail.", "i": ["Completed audit cycle"], "o": ["Structured findings", "Four deliverable artifacts plus an agent-handoff package for coding agents"], "s": ["GET findings and deliverables; download URLs live fifteen minutes and are fetched on demand"], "p": [["Verifier", "Must map evidence to a decision — this is precisely why the role has to exist"], ["Developer", "Guidance reaches them through the verifier, with a re-run path attached"]], "f": "Guardian will not add a pass field, a score or a threshold; requests for one are declined by design. Our platform owns the mapping, under our accountability.", "x": "Simplified to pass or fail in the current mockups and tagged as such."}, "21": {"t": "Release to the marketplace", "lane": "DEVELOPER", "node": "publish", "w": "Once certified, the developer performs the release. This is the one publish action the developer legitimately holds: both gates it depends on — the verifier's approval and Guardian's certification — have already been cleared, so the release is execution rather than a decision.", "i": ["Guardian certification"], "o": ["Public listing carrying the verification record and the certification"], "s": ["DevFlow publish node"], "p": [["Verifier", "Does not publish publicly; their record closes at certification"], ["Buyers", "See verified-by-the-tenant-verifier alongside Guardian's verdict"], ["HUMAIN", "Operates the catalogue the listing appears in"]], "f": "Publishing is blocked unless the state is genuinely certified. A new version starts a new record and is verified again.", "x": "Confirmed 18 August. This is the one place our model follows Google Cloud Marketplace rather than Apple: approval and release are separate acts."}, "22": {"t": "Monitor and re-verify", "lane": "VERIFIER", "node": "", "w": "The verifier watches live behaviour. A new version always opens a new record and is verified again — certification does not transfer between versions.", "i": ["Runtime signals: trust drift, error rate, latency, policy violations"], "o": ["Re-verification, or a pause"], "s": ["Observability stack"], "p": [["Tenant admin", "Can pause a live agent in one action, recorded with who did it"], ["Developer", "Notified with the reason and a resubmit path"]], "f": "Without this, an agent that degrades after publication has no route back into verification.", "x": "Phase 2: production watch, flagging drift to both the verifier and the tenant admin."}, "23": {"t": "Quotas, pause, retire, erase", "lane": "TENANT ADMIN", "node": "", "w": "Tenant-side operations. Pause stops a runtime in one click; retirement tears down and produces an erasure record that outlives the agent.", "i": ["Retirement request from a developer, or an operational decision"], "o": ["Pause record", "Immutable erasure record: what was preserved, what was erased and in what order"], "s": ["Control plane; every action carries actor, time and outcome"], "p": [["Developer", "Requests retirement; does not execute it"], ["Verifier", "Holds pause authority too under the tenant-admin grant"]], "f": "The erasure record is the data-protection guarantee. It has to survive the resources it describes, which is why it is written before teardown begins.", "x": ""}, "24": {"t": "Marketplace catalogue", "lane": "HUMAIN", "node": "", "w": "HUMAIN operates cross-tenant discovery. Listings carry both the tenant verifier's record and Guardian's certification.", "i": ["Certified, released listings"], "o": ["Catalogue entries discoverable by every tenant"], "s": ["HUMAIN marketplace"], "p": [["Developer", "Their listing appears here after release"], ["Buyers in other tenants", "Acquire and run the agent"]], "f": "", "x": "Open, and the one I would resolve before sign-off: the SteerCo operating model lists a Cert approval queue under HUMAIN Operations at two FTE. If that is a further human review after Guardian, this diagram needs a sixth lane."}}
;
const LANEC = {"HUMAIN":"#6B3FA0","TENANT ADMIN":"#4A5568","DEVELOPER":"#2A5FC4","VERIFIER":"#9A4A14","GUARDIAN":"#0F6E63"};
const svg = document.querySelector('svg');
const panel = document.getElementById('panel');
let cur = null;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function list(items){return items&&items.length?'<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';}

function render(n){
  const d = DETAIL[n]; if(!d) return;
  const c = LANEC[d.lane] || '#5B6270';
  panel.innerHTML =
    '<div class="ph"><div class="row1">'+
      '<span class="num" style="background:'+c+'">'+n+'</span>'+
      '<span class="lane" style="color:'+c+'">'+esc(d.lane)+'</span>'+
      '<button class="close" id="x" aria-label="Close">&times;</button></div>'+
      '<h2>'+esc(d.t)+'</h2>'+
      (d.node?'<span class="node">'+esc(d.node)+'</span>':'')+
    '</div>'+
    '<div class="pb">'+
      '<p class="what">'+esc(d.w)+'</p>'+
      (d.i&&d.i.length?'<div class="sec"><div class="lbl">Inputs — what arrives</div>'+list(d.i)+'</div>':'')+
      (d.o&&d.o.length?'<div class="sec"><div class="lbl">Outputs — what it produces</div>'+list(d.o)+'</div>':'')+
      (d.s&&d.s.length?'<div class="sec"><div class="lbl">How it runs</div>'+list(d.s)+'</div>':'')+
      (d.p&&d.p.length?'<div class="sec"><div class="lbl">Who else this touches</div>'+
        d.p.map(p=>'<div class="who"><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></div>').join('')+'</div>':'')+
      (d.f?'<div class="fail"><div class="lbl lblx" style="font:700 9.5px inherit;letter-spacing:.11em;text-transform:uppercase;margin-bottom:5px">Where it breaks</div>'+esc(d.f)+'</div>':'')+
      (d.x?'<div class="open"><div class="lbl" style="font:700 9.5px inherit;letter-spacing:.11em;text-transform:uppercase;margin-bottom:5px">Note</div>'+esc(d.x)+'</div>':'')+
    '</div>'+
    '<div class="nav">'+
      '<button class="btn" id="prev"'+(n<=1?' disabled':'')+'>&larr; Step '+(n-1)+'</button>'+
      '<button class="btn" id="next"'+(n>=24?' disabled':'')+'>Step '+(n+1)+' &rarr;</button>'+
    '</div>';
  panel.classList.add('on');
  document.getElementById('x').onclick = clear;
  const p=document.getElementById('prev'), q=document.getElementById('next');
  if(p&&!p.disabled) p.onclick=()=>select(n-1);
  if(q&&!q.disabled) q.onclick=()=>select(n+1);
  panel.scrollTop=0;
}

function select(n){
  cur=n;
  svg.classList.add('picking');
  svg.querySelectorAll('.step').forEach(g=>g.classList.toggle('sel', +g.dataset.step===n));
  render(n);
  history.replaceState(null,'','#step-'+n);
  const g=svg.querySelector('.step[data-step="'+n+'"]');
  if(g&&g.scrollIntoView) g.scrollIntoView({block:'nearest',inline:'nearest'});
}
function clear(){
  cur=null; svg.classList.remove('picking');
  svg.querySelectorAll('.step').forEach(g=>g.classList.remove('sel'));
  panel.classList.remove('on'); panel.innerHTML='';
  history.replaceState(null,'',location.pathname);
}

svg.querySelectorAll('.step').forEach(g=>{
  const n=+g.dataset.step;
  g.addEventListener('click',()=>select(n));
  g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n);} });
});
document.getElementById('closeAll').onclick=clear;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') return clear();
  if(!cur) return;
  if(e.key==='ArrowRight'&&cur<24) select(cur+1);
  if(e.key==='ArrowLeft'&&cur>1) select(cur-1);
});
const h=location.hash.match(/^#step-(\d+)$/);
if(h) select(Math.min(24,Math.max(1,+h[1])));
</script>
</body>
</html>
