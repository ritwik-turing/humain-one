<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUMAIN ONE Marketplace — Public Marketplace V1</title>
<style>
:root{--bg:#faf9f5;--ink:#1f1c18;--muted:#6f6a61;--line:#e5e1d8;--green:#0e9b76;--greenbg:#eef7f2;--amber:#b45309;--amberbg:#fdf6e7;--red:#b91c1c;--redbg:#f6ebe9;--card:#fff;--blue:#155f9e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 26px}
.logo{font-weight:800;font-size:15px;letter-spacing:.01em;cursor:pointer;white-space:nowrap}
.logo span{color:var(--green)}
.searchbox{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.searchbox input{border:none;outline:none;background:transparent;flex:1;font-size:13px}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 26px 70px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:#c9c3b6}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:#0c8767}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:default}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.badge.gov{background:var(--greenbg);color:var(--green)}
.badge.preview{background:var(--amberbg);color:var(--amber)}
.badge.alert{background:var(--redbg);color:var(--red)}
.badge.muted{background:#f0ede6;color:var(--muted)}
.badge.blue{background:#e8f1fa;color:var(--blue)}
.chipbtn{appearance:none;border:1px solid var(--line);background:#fff;color:#4a4640;font-weight:600;font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer}
.chipbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.small{font-size:11.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acard{padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.acard:hover{border-color:var(--green)}
.av{width:34px;height:34px;border-radius:9px;background:var(--greenbg);color:var(--green);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.nm{font-weight:700;font-size:13.5px}
.pub{font-size:11px;color:var(--muted)}
.vrf{color:var(--blue);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}
.kv:last-child{border-bottom:none}
.kv b{text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{appearance:none;border:1px solid var(--line);background:#fff;color:#4a4640;font-weight:600;font-size:12px;padding:6px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.note{display:flex;gap:9px;border-radius:10px;padding:9px 12px;font-size:12.5px;align-items:flex-start}
.note.gov{background:var(--greenbg)}
.note.warn{background:var(--amberbg)}
.note.bad{background:var(--redbg)}
.planbox{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.planbox.on{border-color:var(--green);background:var(--greenbg)}
.price{font-weight:800;font-size:14px;white-space:nowrap}
.copychip{display:inline-block;font-size:10px;font-weight:700;background:#f0ede6;color:var(--muted);padding:2px 8px;border-radius:999px;cursor:pointer}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--blue);cursor:pointer;text-decoration:none}
.jwrap{display:grid;grid-template-columns:225px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.jwrap{grid-template-columns:1fr}}
.jnav{position:sticky;top:64px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px 4px}
.jnav .jt{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:0 0 10px 4px}
.jitem{display:flex;gap:10px;padding:0 4px;border-radius:10px}
.jitem.click{cursor:pointer}
.jitem.click:hover .jl{color:var(--green)}
.jrail{display:flex;flex-direction:column;align-items:center}
.jdot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:#f0ede6;color:var(--muted);flex:none}
.jitem.done .jdot{background:var(--greenbg);color:var(--green)}
.jitem.on .jdot{background:var(--green);color:#fff;box-shadow:0 0 0 3px var(--greenbg)}
.jline{width:2px;flex:1;background:var(--line);min-height:14px;margin:2px 0}
.jitem.done .jline{background:var(--green)}
.jbody{padding:2px 0 14px}
.jl{font-weight:700;font-size:12.5px}
.jitem.on .jl{color:var(--green)}
.js{font-size:10.5px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:11px;min-height:200px;max-height:320px;overflow:auto}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;font-size:12.5px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.msg.ag{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.meter{height:7px;border-radius:4px;background:#eee9df;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}
.qr{width:74px;height:74px;display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#fff;padding:4px;border:1px solid var(--line);border-radius:6px}
.qr i{background:#1f1c18;border-radius:1px}
.qr i.o{background:transparent}
.two{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.f,select.f{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;background:#fff;font-family:inherit}
#toastbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f1c18;color:#fff;font-size:12.5px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toastbar.show{opacity:1}
.hero{background:linear-gradient(100deg,#0e3d31,#0e9b76);border-radius:14px;color:#fff;padding:22px 24px;margin-bottom:18px}
.hero h2{margin:0 0 4px;font-size:19px}
.hero p{margin:0;font-size:12.5px;opacity:.9}
h3.sec{font-size:14px;margin:20px 0 10px}
.demobar{position:fixed;right:14px;bottom:14px;z-index:30;background:#fff;border:1px dashed var(--amber);border-radius:11px;padding:8px 10px;font-size:11px;max-width:220px}
</style>
</head>
<body>
<div class="top">
  <div class="logo" data-go="store">HUMAIN <span>ONE</span> · Marketplace</div>
  <div class="searchbox"><span style="color:var(--muted)">⌕</span><input id="q" aria-label="Search agents" placeholder="Search agents, use cases… (⌘K)"/></div>
  <div class="topright">
    <span class="badge blue" title="Signed in as a company executive acquiring for the tenant">Nora Al-Qahtani · Exec · Al-Noor Trading Co.</span>
    <button class="btn sm" data-go="work" id="myagentsBtn">My agents</button>
  </div>
</div>
<div class="wrap" id="app"></div>
<div id="toastbar"></div>
<div class="demobar"><button class="btn sm ghost" data-demotoggle style="border:none;padding:2px 4px;font-weight:800;color:var(--amber)">⚙ Demo controls</button>
<div id="demobody" style="display:none"><div class="small" style="font-size:10.5px">Failure paths for the walkthrough:</div>
<div class="frow" style="margin-top:5px;gap:5px">
<button class="btn sm ghost" data-demo="exhaust">Exhaust entitlement</button>
<button class="btn sm ghost" data-demo="block">Admin-block</button>
</div></div></div>

<script>
/* ============ catalog ============ */
const CATS=['All','Citizen services','Back office','Finance','HR','Travel','Language'];
const AGENTS=[
 {id:'translate',nm:'Translation Agent',pub:'Turing Labs',vrf:1,cat:'Language',ds:'Arabic–English document and live-chat translation with legal-register support.',use:'18.2k',trust:94,mo:499,task:0.35,kingdom:1,cert:1,feat:1},
 {id:'meeting',nm:'Meeting Manager',pub:'Turing Labs',vrf:1,cat:'Back office',ds:'Schedules, briefs, and follows up on meetings across your org calendar.',use:'8.6k',trust:91,mo:299,task:0.20,kingdom:0,cert:1,feat:1},
 {id:'citizen',nm:'Citizen Support Agent',pub:'Ministry of Social Affairs',vrf:1,cat:'Citizen services',ds:'Answers citizen queries on benefits and services, escalates with full context.',use:'12.4k',trust:92,mo:899,task:0.55,kingdom:1,cert:1,feat:1},
 {id:'trip',nm:'Trip Planner',pub:'Turing Labs',vrf:1,cat:'Travel',ds:'Plans compliant business travel: flights, hotels, visas, per-diem rules.',use:'7.8k',trust:88,mo:249,task:0.18,kingdom:0,cert:1,feat:0},
 {id:'invoice',nm:'Invoice Chaser',pub:'Riyadh FinTech Works',vrf:1,cat:'Finance',ds:'Follows up unpaid invoices in Arabic and English, reconciles on payment.',use:'6.3k',trust:87,mo:399,task:0.25,kingdom:0,cert:1,feat:0},
 {id:'contract',nm:'Contract Summarizer',pub:'Jeddah Legal AI',vrf:1,cat:'Back office',ds:'Summarizes and red-flags contracts against your playbook. Sharia-clause aware.',use:'4.9k',trust:90,mo:1299,task:0.90,kingdom:1,cert:1,feat:0},
 {id:'hr',nm:'HR Onboarder',pub:'Turing Labs',vrf:1,cat:'HR',ds:'Runs new-hire onboarding: contracts, GOSI registration, equipment, buddy plan.',use:'3.7k',trust:85,mo:349,task:0.22,kingdom:0,cert:1,feat:0},
 {id:'procure',nm:'Procurement Copilot',pub:'Riyadh FinTech Works',vrf:1,cat:'Finance',ds:'Drafts RFQs, compares supplier quotes, and tracks Etimad tender deadlines.',use:'2.9k',trust:83,mo:599,task:0.40,kingdom:0,cert:0,feat:0},
 {id:'triage',nm:'Support Triage',pub:'Dammam Cloud Co.',vrf:0,cat:'Back office',ds:'Classifies and routes inbound support tickets with SLA awareness.',use:'1.2k',trust:78,mo:199,task:0.12,kingdom:0,cert:0,feat:0},
];
const A=id=>AGENTS.find(a=>a.id===id);
const VAT=0.15;
const fmt=n=>'SAR '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ============ state ============ */
const state={screen:'store',cat:'All',q:'',agentId:null,tab:'overview',plan:'trial',tier:'hosted',owned:null,checkoutErr:false};
/* owned = {agentId, plan, tier, seats, cap, used, blocked, exhausted, cancelled, invoice} */

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toastbar');t.textContent=m;t.classList.add('show');clearTimeout(toast._x);toast._x=setTimeout(()=>t.classList.remove('show'),2400);}
function badge(c,t){return '<span class="badge '+c+'">'+t+'</span>';}
function copychip(id){return '<span class="copychip" data-copy="'+id+'" title="Copy to clipboard">⧉ '+id+'</span>';}
function av(a){return '<div class="av">'+a.nm.split(' ').map(w=>w[0]).slice(0,2).join('')+'</div>';}
function publine(a){return '<span class="pub">'+a.pub+(a.vrf?' <span class="vrf" title="Verified publisher">✓ verified</span>':'')+'</span>';}
function trustline(a){return badge('gov','Trust '+a.trust)+' '+badge('muted',a.use+' monthly runs')+(a.cert?' '+badge('blue','certified'):'')+(a.kingdom?' '+badge('preview','in-Kingdom tier'):'');}
function qr(){let s='';for(let i=0;i<49;i++){s+='<i class="'+(((i*7)%13<6)?'':'o')+'"></i>';}return '<div class="qr">'+s+'</div>';}
function sideNav(cur){
 const S=[['Discover','Browse & search','store'],['Evaluate','Trust & evidence','listing'],['Try & choose','Sandbox · plan · tier','listing'],['Checkout','SAR · VAT · ZATCA e-invoice',''],['Entitle','Instant · magic link + creds',''],['First use','Run in your workspace','work']];
 const ix=S.findIndex(s=>s[0]===cur);
 return '<div class="jnav"><div class="jt">YOUR JOURNEY</div>'+S.map((s,i)=>{
  const st=i<ix?'done':i===ix?'on':'';
  const clickable=(st==='done'&&s[2]&&(s[2]!=='listing'||state.agentId))||(s[0]==='First use'&&st!=='on'&&state.owned&&!state.owned.cancelled);
  return '<div class="jitem '+st+(clickable?' click':'')+'"'+(clickable?' data-jnav="'+s[2]+'"':'')+'><div class="jrail"><div class="jdot">'+(st==='done'?'✓':(i+1))+'</div>'+(i<S.length-1?'<div class="jline"></div>':'')+'</div><div class="jbody"><div class="jl">'+s[0]+'</div><div class="js">'+s[1]+'</div></div></div>';
 }).join('')+'</div>';
}
function planPrice(a,plan,tier){
 let base=0,label='';
 if(plan==='trial'){base=0;label='14-day free trial · then '+fmt(a.mo)+'/mo';}
 if(plan==='sub'){base=a.mo;label=fmt(a.mo)+' / month · 25 seats · 5,000 tasks';}
 if(plan==='usage'){base=a.task*1000;label=fmt(a.task)+' per task · billed monthly (est. 1,000 tasks)';}
 if(tier==='kingdom'){base=base*1.4;
  if(plan==='sub')label=fmt(base)+' / month · 25 seats · 5,000 tasks · in-Kingdom dedicated';
  if(plan==='usage')label=fmt(a.task*1.4)+' per task · in-Kingdom dedicated · billed monthly';
  if(plan==='trial')label='14-day free trial · then '+fmt(a.mo*1.4)+'/mo on the in-Kingdom tier';}
 return {base,label};
}

/* ============ screens ============ */
function scrStore(){
 const list=AGENTS.filter(a=>(state.cat==='All'||a.cat===state.cat)&&(!state.q||((a.nm+' '+a.ds+' '+a.pub+' '+a.cat).toLowerCase().includes(state.q.toLowerCase()))));
 const feat=AGENTS.filter(a=>a.feat);
 return `
 <div class="hero"><h2>Sovereign AI agents for the Kingdom of Saudi Arabia</h2>
 <p>Certified agents · SAR billing with ZATCA e-invoicing · optional in-Kingdom dedicated runtime. Every listing is security-reviewed before it appears here.</p></div>
 ${state.q?'':`<h3 class="sec">Featured</h3><div class="grid">${feat.map(cardA).join('')}</div>`}
 <h3 class="sec">Browse</h3>
 <div class="frow" style="margin-bottom:12px">${CATS.map(c=>`<button class="chipbtn ${c===state.cat?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
 <div class="grid">${list.map(cardA).join('')||'<div class="small">No agents match.</div>'}</div>
 <p class="small" style="margin-top:16px">Listings show verified publishers and live usage instead of star ratings. Reviews open to verified purchasers later.</p>`;
}
function cardA(a){
 return `<div class="card acard" data-open="${a.id}">
 <div class="frow" style="justify-content:space-between">${av(a)}<span class="price" style="font-size:12px">from ${fmt(a.mo)}<span class="small">/mo</span></span></div>
 <div><div class="nm">${a.nm}</div>${publine(a)}</div>
 <div class="small" style="min-height:32px">${a.ds}</div>
 <div>${trustline(a)}</div></div>`;
}

function scrListing(){
 const a=A(state.agentId);
 const T=[['overview','Overview'],['capab','Capabilities & data'],['sec','Security & compliance'],['cert','Certification'],['perf','Performance & standing']];
 const p=planPrice(a,state.plan,state.tier);
 const owned=state.owned&&state.owned.agentId===a.id&&!state.owned.cancelled;
 const body={
  overview:`<div class="card" style="padding:14px">
   <div class="kv"><span>Publisher</span><b>${a.pub}${a.vrf?' ✓':''}</b></div>
   <div class="kv"><span>Category</span><b>${a.cat}</b></div>
   <div class="kv"><span>Monthly runs</span><b>${a.use}</b></div><div class="kv"><span>Reuse</span><b>4 tenant organizations</b></div>
   <div class="kv"><span>Agent card (A2A)</span><b>${copychip('a2a_'+a.id+'_v1')}</b></div>
   <div class="kv"><span>Protocols</span><b>MCP · A2A</b></div>
   <div class="kv"><span>Last updated</span><b>Jul 2026</b></div></div>
   <div class="note gov" style="margin-top:10px"><span>✓</span><div>${a.ds} Works in Arabic and English out of the box.</div></div>`,
  capab:`<div class="card" style="padding:14px">
   <div class="kv"><span>Actions</span><b>12 declared actions</b></div>
   <div class="kv"><span>Data access</span><b>Read: your connected sources · Write: drafts only</b></div>
   <div class="kv"><span>Knowledge</span><b>Tenant-scoped, never shared across buyers</b></div>
   <div class="kv"><span>Rate limits</span><b>60 tasks/min per tenant</b></div></div>`,
  sec:`<div class="card" style="padding:14px">
   <div class="kv"><span>Security review</span><b>${a.cert?'Passed adversarial review':'Pending'} </b></div>
   <div class="kv"><span>Egress</span><b>Deny-all except approved endpoints</b></div>
   <div class="kv"><span>Secrets</span><b>No secret values in logs or outputs</b></div>
   <div class="kv"><span>Prompt-injection posture</span><b>Behavioral testing on every version</b></div></div>
   <div class="small" style="margin-top:8px">Infrastructure certificates alone don't cover agent behaviour; every version is re-reviewed.</div>`,
  cert:`<div class="card" style="padding:14px">
   <div class="kv"><span>Certification profile</span><b>${a.cert?'gov-citizen-v1 · signed':'not yet certified'}</b></div>
   <div class="kv"><span>Hosting assessment</span><b>NCA ECC + CCC-2:2024 assessed (CST Class C)</b></div>
   <div class="kv"><span>Data residency</span><b>${a.kingdom?'In-Kingdom dedicated tier available (KSA, Riyadh)':'HUMAIN-hosted (KSA region)'}</b></div>
   <div class="kv"><span>Evidence reference</span><b>${copychip('cert_'+a.id+'_71a2')}</b></div></div>`,
  perf:`<div class="card" style="padding:14px">
   <div class="kv"><span>Task completion</span><b>97% · category median 92%</b></div>
   <div class="kv"><span>p95 latency</span><b>470 ms</b></div>
   <div class="kv"><span>Cost per outcome</span><b>≈ ${fmt(a.task*0.75)} · median ${fmt(a.task)}</b></div></div>
   <div class="small" style="margin-top:8px">${badge('gov','indicative')} Figures are indicative until this version has enough volume.</div>`,
 }[state.tab];
 return `<div class="crumb"><a data-go="store">Marketplace</a> / ${a.cat} / ${a.nm}</div>
 <div class="two">
 <div>
  <div class="frow" style="gap:12px">${av(a)}<div><div class="nm" style="font-size:17px">${a.nm}</div>${publine(a)}</div><span style="margin-left:auto">${trustline(a)}</span></div>
  <div class="tabs">${T.map(t=>`<button class="tab ${t[0]===state.tab?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${body}
 </div>
 <div class="card" style="padding:14px;position:sticky;top:64px">
  ${owned?`<div class="note gov"><span>✓</span><div><b>You own this agent.</b> Plan: ${state.owned.plan==='sub'?'Standard':state.owned.plan==='usage'?'Usage':'Trial'}.</div></div>
   <button class="btn pri" style="width:100%;margin-top:10px" data-go="work">Open in my workspace</button>`
  :`<div style="font-weight:700;margin-bottom:8px">Choose a plan</div>
  <div style="display:grid;gap:8px">
   <div class="planbox ${state.plan==='trial'?'on':''}" data-plan="trial"><span><b>Free trial</b><div class="small">14 days · one per tenant · hard stop, no auto-charge</div></span><span class="price">SAR 0</span></div>
   <div class="planbox ${state.plan==='sub'?'on':''}" data-plan="sub"><span><b>Standard</b><div class="small">25 seats · 5,000 tasks/mo · prorated</div></span><span class="price">${fmt(a.mo)}<span class="small">/mo</span></span></div>
   <div class="planbox ${state.plan==='usage'?'on':''}" data-plan="usage"><span><b>Usage</b><div class="small">Pay per completed task</div></span><span class="price">${fmt(a.task)}<span class="small">/task</span></span></div>
  </div>
  <div style="font-weight:700;margin:12px 0 6px">Runtime tier</div>
  <div style="display:grid;gap:8px">
   <div class="planbox ${state.tier==='hosted'?'on':''}" data-tier="hosted"><span><b>HUMAIN-hosted</b><div class="small">KSA region · fastest start</div></span><span class="small">included</span></div>
   <div class="planbox ${state.tier==='kingdom'?'on':''}" data-tier="kingdom" ${a.kingdom?'':'style="opacity:.45;pointer-events:none"'}><span><b>In-Kingdom dedicated</b><div class="small">Runs in your tenant · NCA-assessed · data never leaves</div></span><span class="small">+40%</span></div>
  </div>
  <div class="small" style="margin:10px 0 4px">${p.label}</div>
  <button class="btn pri" style="width:100%" data-buy="1">${state.plan==='trial'?'Start free trial':'Continue to checkout'}</button>
  <button class="btn ghost" style="width:100%;margin-top:6px" data-sandbox="1">Try in sandbox — no sign-up</button>
  <div class="small" style="margin-top:8px">Instant activation on payment. Cancel any time: one action ends billing and deprovisions the runtime.</div>`}
 </div></div>`;
}

function scrCheckout(){
 const a=A(state.agentId);const p=planPrice(a,state.plan,state.tier);
 const vat=p.base*VAT, total=p.base+vat;
 return `<div class="crumb"><a data-go="store">Marketplace</a> / <a data-open="${a.id}">${a.nm}</a> / Checkout</div>
 <div class="two">
 <div class="card" style="padding:16px">
  <div style="font-weight:700;margin-bottom:10px">Billing details</div>

/* ============ render + wiring ============ */
function go(scr){state.screen=scr;render();}
let lastScreen=null;
function render(){
 const app=$('#app');
 const keepY=(lastScreen===state.screen)?window.scrollY:0;
 const inner={store:scrStore,listing:scrListing,checkout:scrCheckout,invoice:scrInvoice,entitle:scrEntitle,work:scrWork}[state.screen]();
 const NAVFOR={listing:'Evaluate',checkout:'Checkout',invoice:'Entitle',entitle:'Entitle',work:'First use'};
 let nv=NAVFOR[state.screen];
 if(state.screen==='work'&&(!state.owned||state.owned.cancelled))nv=null;
 app.innerHTML = nv ? '<div class="jwrap">'+sideNav(nv)+'<div>'+inner+'</div></div>' : inner;
 const ch=$('#chat'); if(ch)ch.scrollTop=ch.scrollHeight;
 window.scrollTo(0,keepY);
 lastScreen=state.screen;
}
document.addEventListener('click',e=>{
 const t=x=>e.target.closest?e.target.closest(x):null;
 let n;
 if(n=t('[data-copy]')){if(navigator.clipboard)navigator.clipboard.writeText(n.getAttribute('data-copy'));const o=n.textContent;n.textContent='copied';setTimeout(()=>n.textContent=o,1100);return;}
 if(n=t('[data-open]')){state.agentId=n.getAttribute('data-open');state.tab='overview';state.plan='trial';state.tier='hosted';state.checkoutErr=false;go('listing');return;}
 if(n=t('[data-jnav]')){go(n.getAttribute('data-jnav'));return;}
 if(n=t('[data-go]')){go(n.getAttribute('data-go'));return;}
 if(n=t('[data-cat]')){state.cat=n.getAttribute('data-cat');render();return;}
 if(n=t('[data-tab]')){state.tab=n.getAttribute('data-tab');render();return;}
 if(n=t('[data-plan]')){state.plan=n.getAttribute('data-plan');render();return;}
 if(n=t('[data-tier]')){state.tier=n.getAttribute('data-tier');render();return;}
 if(n=t('[data-buy]')){state.checkoutErr=false;go('checkout');return;}
 if(n=t('[data-sandbox]')){openSandbox();return;}
 if(n=t('[data-pay]')){
   if(n.getAttribute('data-pay')==='fail'){state.checkoutErr=true;render();toast('Declined — nothing charged, nothing created');return;}
   const a=A(state.agentId);const p=planPrice(a,state.plan,state.tier);
   state.owned={agentId:a.id,plan:state.plan,tier:state.tier,seats:25,cap:state.plan==='trial'?200:5000,used:0,blocked:false,exhausted:false,cancelled:false,firstRun:false,scope:'org',msgs:[],total:p.base*(1+VAT),invoice:'inv_ZATCA_8842'};
   if(state.plan==='trial'){go('entitle');toast('Trial started · entitlement live · hard stop in 14 days');}
   else{go('invoice');toast('Payment cleared · entitlement created');}
   return;}
 if(n=t('[data-scope]')){state.owned.scope=n.getAttribute('data-scope');document.querySelectorAll('[data-scope]').forEach(b=>b.classList.toggle('on',b===n));return;}
 if(n=t('[data-send]')){sendMsg();return;}
 if(n=t('[data-fb]')){toast('Feedback recorded — feeds the agent\'s marketplace standing');return;}
 if(n=t('[data-cancel]')){
   if(!state.owned)return;
   state.owned.cancelled=true;toast('Cancelled: billing stopped + runtime deprovisioned');render();return;}
 if(n=t('[data-demotoggle]')){const b=document.getElementById('demobody');b.style.display=b.style.display==='none'?'block':'none';return;}
 if(n=t('[data-demo]')){
   if(!state.owned||state.owned.cancelled){toast('Acquire an agent first (demo controls act on your workspace)');return;}
   if(n.getAttribute('data-demo')==='exhaust'){state.owned.exhausted=true;state.owned.used=state.owned.cap;}
   else{state.owned.blocked=true;}
   go('work');return;}
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){state.q=e.target.value;if(state.screen!=='store')state.screen='store';render();const q=$('#q');q.value=state.q;q.focus();q.setSelectionRange(q.value.length,q.value.length);} });
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();$('#q').focus();return;}
 if(e.key==='Enter'&&e.target.id==='chatin')sendMsg();
});
function sendMsg(){
 const inp=$('#chatin');if(!inp||!inp.value.trim())return;
 const o=state.owned;const a=A(o.agentId);
 o.msgs.push({who:'me',tx:inp.value.trim()});o.used+=1;render();
 const f1=$('#chatin');if(f1)f1.focus();
 setTimeout(()=>{
  o.msgs.push({who:'ag',tx:demoReply(a)});o.used+=2;o.firstRun=true;render();
  const f2=$('#chatin');if(f2)f2.focus();
 },700);
}
function demoReply(a){
 const R={translate:'Done — translated your document to English (legal register), 4 pages. Draft saved to your workspace for review.',
  meeting:'Scheduled your steering review for Sunday 10:00, brief circulated to 6 attendees, and I\'ll chase confirmations tomorrow.',
  citizen:'I found the applicable benefit: housing support, eligibility confirmed. Drafted the citizen reply in Arabic for your review.',
  trip:'Riyadh → Jeddah, Tue–Thu: flights held within policy, hotel at corporate rate, per-diem calculated. Approval sent to your manager.'};
 return R[a.id]||'Task completed. The result draft is in your workspace for review — I never send anything externally without your approval.';
}
function openSandbox(){
 const a=A(state.agentId);
 const ov=document.createElement('div');
 ov.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(20,18,14,.45);display:flex;align-items:center;justify-content:center';
 ov.innerHTML=`<div class="card" style="width:520px;max-width:94vw;padding:16px">
  <div class="frow" style="justify-content:space-between"><b>Sandbox — ${a.nm}</b>${badge('preview','no sign-up · sample data only')}</div>
  <div class="chat" style="margin-top:10px"><div class="msg ag">This is a sandbox with sample data — nothing you try here touches real systems. Ask me something.</div><div class="msg me">Summarize this supplier contract.</div><div class="msg ag">${demoReply(a)}</div></div>
  <div class="small" style="margin-top:8px">Liked it? Start the 14-day trial — one per tenant, hard stop, no auto-charge.</div>
  <div class="frow" style="margin-top:10px;justify-content:flex-end"><button class="btn" data-x="1">Close</button><button class="btn pri" data-trybuy="1">Start free trial</button></div></div>`;
 document.body.appendChild(ov);
 function esc(e){if(e.key==='Escape'){ov.remove();document.removeEventListener('keydown',esc);}}
 document.addEventListener('keydown',esc);
 ov.addEventListener('click',e=>{
  if(e.target===ov||e.target.closest('[data-x]')){ov.remove();document.removeEventListener('keydown',esc);return;}
  if(e.target.closest('[data-trybuy]')){ov.remove();document.removeEventListener('keydown',esc);state.plan='trial';go('checkout');}
 });
}
window.__mk={state,go,render,A};
render();
</script>
